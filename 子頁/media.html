<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>OBS 媒體播放 · 清單</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script src="../yt-live-sync.js"></script>
    <style>
      :root {
        --bg: #000;
        --fg: rgba(255, 255, 255, 0.9);
        --muted: rgba(255, 255, 255, 0.55);
        --font-zh: "IBM Plex Sans TC", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
        --font-num: "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-zh);
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #stage video,
      #stage iframe,
      #stage .yt-host,
      #stage .yt-host iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
      #tapPlay {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: none;
        place-items: center;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        border: 0;
      }
      #tapPlay.show {
        display: grid;
      }
      #stage video.fit-contain {
        object-fit: contain;
      }
      #stage video.fit-cover {
        object-fit: cover;
      }
      #stage video.fit-fill {
        object-fit: fill;
      }
      #hud {
        position: absolute;
        left: 10px;
        bottom: 10px;
        z-index: 5;
        max-width: calc(100% - 20px);
        padding: 6px 10px;
        border-radius: 0;
        background: rgba(0, 0, 0, 0.55);
        font-size: 12px;
        line-height: 1.35;
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #hud[hidden],
      #empty[hidden] {
        display: none !important;
      }
      #empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }
      #empty code {
        font-family: var(--font-num);
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="empty">
        尚未加入可播放項目。<br />
        請在入口⑪貼上網址或本機路徑（一行一個）。
      </div>
      <button type="button" id="tapPlay" aria-label="開始播放">點一下開始播放</button>
      <div id="hud" hidden></div>
    </div>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const stage = document.getElementById("stage");
        const empty = document.getElementById("empty");
        const hud = document.getElementById("hud");
        const tapPlay = document.getElementById("tapPlay");
        const isHttp =
          location.protocol === "http:" || location.protocol === "https:";

        const mode = String(params.get("mode") || "loop").toLowerCase();
        const fit = String(params.get("fit") || "contain").toLowerCase();
        // mute=1 = 真的靜音；預設有聲（瀏覽器擋有聲自動播時：先靜音開播再立刻開聲）
        const mute = ["1", "true", "yes", "on"].includes(
          String(params.get("mute") || "0").toLowerCase()
        );
        const wantSound = !mute;
        const volume = Math.min(
          1,
          Math.max(0, Number(params.get("volume") || (mute ? 0 : 1)))
        );
        const dwellSec = Math.max(3, Number(params.get("dwell") || 15) || 15);
        const showHud = !["0", "false", "no", "off", "hide"].includes(
          String(params.get("hud") || "1").toLowerCase()
        );

        function cssVar(name, value) {
          if (value != null && value !== "") {
            document.documentElement.style.setProperty(name, value);
          }
        }
        const bg = (params.get("bg") || "").trim();
        if (bg && bg !== "0" && bg !== "false" && bg !== "none") cssVar("--bg", bg);

        function decodeListParam(raw) {
          const s = String(raw || "").trim();
          if (!s) return [];
          if (s.startsWith("b64:")) {
            try {
              const b64 = s.slice(4).replace(/-/g, "+").replace(/_/g, "/");
              const pad = b64.length % 4 ? "=".repeat(4 - (b64.length % 4)) : "";
              const json = decodeURIComponent(escape(atob(b64 + pad)));
              const arr = JSON.parse(json);
              return Array.isArray(arr) ? arr.map(String) : [];
            } catch (_) {
              return [];
            }
          }
          return s.split(/\r?\n|\|/).map((x) => x.trim()).filter(Boolean);
        }

        function toPlayableUrl(raw) {
          let s = String(raw || "").trim();
          if (!s) return "";
          if (/^[a-zA-Z]:[\\/]/.test(s)) {
            s = "file:///" + s.replace(/\\/g, "/");
          } else if (s.startsWith("\\\\")) {
            s = "file:" + s.replace(/\\/g, "/");
          }
          if (!/^(https?:|file:|data:)/i.test(s) && !s.startsWith("//")) {
            try {
              s = new URL("../" + s.replace(/^\.\//, ""), location.href).href;
            } catch (_) {}
          }
          return s;
        }

        function youtubeId(url) {
          try {
            const u = new URL(url);
            const host = u.hostname.replace(/^www\./, "");
            if (host === "youtu.be") {
              const id = u.pathname.split("/").filter(Boolean)[0] || "";
              return /^[\w-]{11}$/.test(id) ? id : "";
            }
            if (
              host.endsWith("youtube.com") ||
              host.endsWith("youtube-nocookie.com")
            ) {
              const v = u.searchParams.get("v");
              if (v && /^[\w-]{11}$/.test(v)) return v;
              const parts = u.pathname.split("/").filter(Boolean);
              if (
                (parts[0] === "embed" ||
                  parts[0] === "live" ||
                  parts[0] === "shorts") &&
                parts[1] &&
                /^[\w-]{11}$/.test(parts[1])
              ) {
                return parts[1];
              }
            }
          } catch (_) {}
          return "";
        }

        function classify(url) {
          const yt = youtubeId(url);
          if (yt) return { kind: "youtube", ytId: yt, src: url };
          if (/\.(mp4|webm|ogg|ogv|mov|m4v)(\?|#|$)/i.test(url)) {
            return { kind: "video", src: url };
          }
          return { kind: "page", src: url };
        }

        function loadYtApi() {
          return new Promise((resolve, reject) => {
            if (window.YT && window.YT.Player) {
              resolve(window.YT);
              return;
            }
            const prev = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = function () {
              try {
                if (typeof prev === "function") prev();
              } catch (_) {}
              resolve(window.YT);
            };
            if (!document.getElementById("yt-iframe-api")) {
              const s = document.createElement("script");
              s.id = "yt-iframe-api";
              s.src = "https://www.youtube.com/iframe_api";
              s.onerror = () => reject(new Error("yt api"));
              document.head.appendChild(s);
            }
            setTimeout(() => {
              if (window.YT && window.YT.Player) resolve(window.YT);
            }, 8000);
          });
        }

        function shuffle(arr) {
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const t = a[i];
            a[i] = a[j];
            a[j] = t;
          }
          return a;
        }

        let items = decodeListParam(params.get("list") || params.get("items") || "")
          .map(toPlayableUrl)
          .filter(Boolean)
          .map((src, i) => ({ i, ...classify(src), raw: src }));

        async function pullSharedPlaylist() {
          if (!window.MyObsYtLiveSync) return false;
          const paths = ["../資料/media-playlist.js", "資料/media-playlist.js"];
          for (const p of paths) {
            const ok = await new Promise((resolve) => {
              const s = document.createElement("script");
              s.src = p + "?t=" + Date.now();
              s.onload = () => resolve(true);
              s.onerror = () => resolve(false);
              document.head.appendChild(s);
            });
            if (!ok) continue;
            const data = window.__MY_OBS_MEDIA_PLAYLIST__;
            if (!data || !Array.isArray(data.items) || !data.items.length) continue;
            items = data.items
              .map(String)
              .map(toPlayableUrl)
              .filter(Boolean)
              .map((src, i) => ({ i, ...classify(src), raw: src }));
            return true;
          }
          return false;
        }

        let order = [];
        let pos = -1;
        let dwellTimer = 0;
        let currentEl = null;
        let ytPlayer = null;
        let stopped = false;
        let playToken = 0;
        let tapTimer = 0;

        function rebuildOrder(startFresh) {
          if (!items.length) {
            order = [];
            return;
          }
          if (mode === "random") order = shuffle(items.map((_, idx) => idx));
          else order = items.map((_, idx) => idx);
          if (startFresh) pos = -1;
        }

        function setHud(text) {
          if (!showHud) {
            hud.hidden = true;
            return;
          }
          hud.hidden = !text;
          hud.textContent = text || "";
        }

        function hideTap() {
          clearTimeout(tapTimer);
          tapPlay.classList.remove("show");
        }

        function showTap(msg) {
          tapPlay.textContent = msg || "點一下開始播放";
          tapPlay.classList.add("show");
        }

        function applyYtSound(player) {
          if (!wantSound || !player) return;
          try {
            player.unMute();
            player.setVolume(Math.round(volume * 100));
          } catch (_) {}
        }

        function clearStageMedia() {
          clearTimeout(dwellTimer);
          hideTap();
          playToken += 1;
          if (ytPlayer) {
            try {
              ytPlayer.destroy();
            } catch (_) {}
            ytPlayer = null;
          }
          if (currentEl) {
            try {
              if (currentEl.tagName === "VIDEO") {
                currentEl.pause();
                currentEl.removeAttribute("src");
                currentEl.load();
              }
            } catch (_) {}
            currentEl.remove();
            currentEl = null;
          }
        }

        function mountVideo(src, { label, token } = {}) {
          const v = document.createElement("video");
          v.className =
            fit === "cover" ? "fit-cover" : fit === "fill" ? "fit-fill" : "fit-contain";
          v.autoplay = true;
          v.playsInline = true;
          // 有聲需求：先靜音開播，成功後再開聲（否則會卡在暫停）
          v.muted = true;
          v.volume = volume;
          v.controls = false;
          v.addEventListener("ended", () => {
            if (token === playToken) next(false);
          });
          v.addEventListener("error", () => {
            if (token !== playToken) return;
            setHud("播放失敗，跳下一則 · " + (label || src));
            setTimeout(() => next(false), 800);
          });
          v.addEventListener("playing", () => {
            if (!wantSound) return;
            try {
              v.muted = false;
            } catch (_) {}
            hideTap();
          });
          stage.appendChild(v);
          currentEl = v;
          v.src = src;
          const p = v.play();
          if (p && p.then) {
            p.then(() => {
              if (wantSound) {
                try {
                  v.muted = false;
                } catch (_) {}
              } else {
                v.muted = true;
              }
            }).catch(() => {
              showTap("點一下開始播放");
            });
          }
          tapTimer = setTimeout(() => {
            if (token === playToken && v.paused) showTap("點一下開始播放");
          }, 2500);
          return v;
        }

        function mountIframe(src, { onEndedSafetySec } = {}) {
          const f = document.createElement("iframe");
          f.src = src;
          f.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
          f.allowFullscreen = true;
          f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
          f.referrerPolicy = "strict-origin-when-cross-origin";
          f.addEventListener("error", () => {
            setHud("頁面載入失敗，跳下一則");
            setTimeout(() => next(false), 800);
          });
          stage.appendChild(f);
          currentEl = f;
          if (onEndedSafetySec && onEndedSafetySec > 0) {
            dwellTimer = setTimeout(() => next(false), onEndedSafetySec * 1000);
          }
          return f;
        }

        async function mountYtPlayer(videoId, { token, label } = {}) {
          const host = document.createElement("div");
          host.className = "yt-host";
          host.id = "yt-host-" + token;
          stage.appendChild(host);
          currentEl = host;
          let YT;
          try {
            YT = await loadYtApi();
          } catch (_) {
            setHud("YouTube API 載入失敗，跳下一則");
            setTimeout(() => next(false), 800);
            return null;
          }
          if (token !== playToken) return null;

          // 關鍵：一定要 mute 開播，才不會卡在大紅鍵；開播後立刻 unMute（有聲）
          ytPlayer = new YT.Player(host.id, {
            width: "100%",
            height: "100%",
            videoId: videoId,
            playerVars: {
              autoplay: 1,
              mute: 1,
              controls: 1,
              rel: 0,
              modestbranding: 1,
              playsinline: 1,
              enablejsapi: 1,
              origin: location.origin,
            },
            events: {
              onReady(ev) {
                if (token !== playToken) return;
                try {
                  ev.target.mute();
                  ev.target.playVideo();
                } catch (_) {}
                // 稍後開聲：使用者聽到的是有聲，不會卡在預覽
                setTimeout(() => {
                  if (token !== playToken) return;
                  applyYtSound(ev.target);
                  try {
                    ev.target.playVideo();
                  } catch (_) {}
                }, 400);
                tapTimer = setTimeout(() => {
                  if (token !== playToken) return;
                  try {
                    const st = ev.target.getPlayerState();
                    // -1 unstarted, 2 paused, 5 cued
                    if (st === -1 || st === 2 || st === 5) {
                      showTap("點一下開始播放（有聲）");
                    }
                  } catch (_) {
                    showTap("點一下開始播放（有聲）");
                  }
                }, 2800);
              },
              onStateChange(ev) {
                if (token !== playToken) return;
                const st = ev.data;
                if (st === YT.PlayerState.PLAYING) {
                  applyYtSound(ev.target);
                  hideTap();
                  setHud(
                    (label || "YouTube") + (wantSound ? " · 有聲播放中" : " · 靜音")
                  );
                } else if (st === YT.PlayerState.ENDED) {
                  next(false);
                } else if (
                  st === YT.PlayerState.CUED ||
                  st === YT.PlayerState.UNSTARTED
                ) {
                  try {
                    ev.target.mute();
                    ev.target.playVideo();
                  } catch (_) {}
                }
              },
              onError() {
                if (token !== playToken) return;
                setHud("YouTube 播放失敗，跳下一則");
                setTimeout(() => next(false), 800);
              },
            },
          });
          dwellTimer = setTimeout(
            () => next(false),
            Math.max(dwellSec, 6 * 3600) * 1000
          );
          return ytPlayer;
        }

        tapPlay.addEventListener("click", () => {
          hideTap();
          if (ytPlayer) {
            try {
              ytPlayer.mute();
              ytPlayer.playVideo();
              setTimeout(() => {
                applyYtSound(ytPlayer);
                try {
                  ytPlayer.playVideo();
                } catch (_) {}
              }, 200);
            } catch (_) {}
            return;
          }
          if (currentEl && currentEl.tagName === "VIDEO") {
            currentEl.muted = true;
            const p = currentEl.play();
            if (p && p.then) {
              p.then(() => {
                if (wantSound) currentEl.muted = false;
              }).catch(() => {});
            }
          }
        });

        function playIndex(itemIndex) {
          const item = items[itemIndex];
          if (!item) return;
          clearStageMedia();
          empty.hidden = true;
          const label =
            (mode === "random" ? "隨機" : mode === "seq" ? "順序" : "循環") +
            ` · ${itemIndex + 1}/${items.length}`;
          const token = playToken;

          if (item.kind === "video") {
            setHud(label + " · " + item.raw);
            mountVideo(item.src, { label: item.raw, token });
            return;
          }

          if (item.kind === "youtube") {
            if (!isHttp) {
              empty.hidden = false;
              empty.innerHTML =
                "YouTube 在 <code>file://</code> 會 Error 153。<br />請雙擊工具夾 <code>啟動本機伺服器.bat</code>，<br />再用入口複製的 <code>http://127.0.0.1:8765/...</code> 貼到 OBS。";
              setHud(label + " · 需本機 http 伺服器");
              return;
            }
            setHud(label + " · YouTube 啟動中…");
            mountYtPlayer(item.ytId, { token, label: label + " · YouTube" });
            return;
          }

          setHud(label + " · 網頁 · " + item.raw);
          mountIframe(item.src, { onEndedSafetySec: dwellSec });
        }

        function next(fromUser) {
          if (stopped && !fromUser) return;
          if (!order.length) {
            empty.hidden = false;
            setHud("");
            return;
          }
          pos += 1;
          if (pos >= order.length) {
            if (mode === "seq") {
              stopped = true;
              pos = order.length - 1;
              setHud("清單播完（順序模式）");
              return;
            }
            rebuildOrder(true);
            pos = 0;
          }
          playIndex(order[pos]);
        }

        async function boot() {
          if (!items.length) await pullSharedPlaylist();
          if (!items.length) {
            empty.hidden = false;
            setHud("");
            return;
          }
          rebuildOrder(true);
          next(true);
          setInterval(async () => {
            const before = items.map((x) => x.raw).join("\n");
            const ok = await pullSharedPlaylist();
            if (!ok) return;
            const after = items.map((x) => x.raw).join("\n");
            if (after !== before && items.length) {
              stopped = false;
              rebuildOrder(true);
              next(true);
            }
          }, 15000);
        }

        boot();
      })();
    </script>
  </body>
</html>
