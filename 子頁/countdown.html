<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script src="../material-icons.js"></script>
    <script src="../panel-bg.js"></script>
    <style>
      :root {
        --bg: rgba(0, 0, 0, 0.45);
        --fg: rgba(255, 255, 255, 0.85);
        --icon: var(--fg);
        --muted: rgba(255, 255, 255, 0.7);
        --size: 22px;
        --bar-h: calc(var(--size) + 16px);
        --pad-x: 12px;
        --gap: 10px;
        --radius: 0;
        --font-zh: "IBM Plex Sans TC", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
        --font-num: "JetBrains Mono", "Cascadia Mono", "Consolas", "Courier New",
          monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        color: var(--fg);
      }

      #bar {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: var(--gap);
        height: var(--bar-h);
        padding: var(--panel-inset, 0 var(--pad-x));
        background-color: var(--bg);
        background-image: var(--panel-img, none);
        background-size: var(--panel-fit, 100% 100%);
        background-repeat: no-repeat;
        background-position: center;
        border-radius: var(--radius);
        white-space: nowrap;
        line-height: 1;
        overflow: hidden;
      }

      .icon-slot {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: calc(var(--size) * 0.95);
        height: calc(var(--size) * 0.95);
        flex: 0 0 auto;
      }

      .icon-slot[hidden] {
        display: none;
      }

      .icon,
      .custom-icon {
        width: 100%;
        height: 100%;
        opacity: 0.95;
        display: block;
        object-fit: contain;
      }

      .material-symbols-outlined.icon {
        width: auto;
        height: auto;
        font-size: calc(var(--size) * 0.95);
        line-height: 1;
        color: var(--icon);
        font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
        user-select: none;
      }

      .ms-svg-icon.icon,
      .svg-icon {
        width: 100%;
        height: 100%;
        color: var(--icon);
        fill: currentColor;
      }

      .label,
      .value {
        display: flex;
        align-items: center;
        height: var(--size);
        margin: 0;
        padding: 0;
        border: 0;
        line-height: 1;
      }

      .label {
        color: var(--muted);
        font-family: var(--font-zh);
        font-size: calc(var(--size) * 0.82);
        font-weight: 600;
        letter-spacing: 0.04em;
        /* 中文字面常偏上，微向下做光學置中 */
        transform: translateY(0.06em);
      }

      .value {
        font-family: var(--font-num);
        font-size: var(--size);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        transform: translateY(0.02em);
      }
    </style>
  </head>
  <body>
    <div id="bar" aria-live="polite">
      <span class="icon-slot" id="cd-icon"></span>
      <span class="label" id="countdown-label" hidden></span>
      <span class="value" id="countdown">00:00:00</span>
    </div>

    <script>
      (() => {
        const params = new URLSearchParams(location.search);

        function cssVar(name, value) {
          if (value) document.documentElement.style.setProperty(name, value);
        }

        cssVar("--size", params.get("fontSize") ? `${params.get("fontSize")}px` : "");
        cssVar("--fg", params.get("color"));
        cssVar("--icon", params.get("iconColor") || params.get("iconColour"));
        const bgParam = (params.get("bg") || "").trim();
        if (!bgParam || bgParam === "0" || bgParam === "false" || bgParam === "none" || bgParam === "off") {
          cssVar("--bg", "transparent");
        } else {
          cssVar("--bg", bgParam);
        }
        if (window.ObsPanelBg) {
          ObsPanelBg.applyOverlayPanelBg(params, cssVar, { defaultInset: 12 });
        }
        cssVar("--gap", params.get("gap") ? `${params.get("gap")}px` : "");
        cssVar("--radius", params.get("radius") ? `${params.get("radius")}px` : "");

        const els = {
          countdown: document.getElementById("countdown"),
          countdownLabel: document.getElementById("countdown-label"),
        };

        const cdLabel = params.get("cdLabel") || params.get("label") || "";
        if (cdLabel) {
          els.countdownLabel.hidden = false;
          els.countdownLabel.textContent = cdLabel;
        }

        function isUrlIcon(raw) {
          const s = String(raw || "").trim();
          return /^https?:\/\//i.test(s) || /\.(png|svg|webp|gif|jpe?g)(\?|#|$)/i.test(s);
        }

        const cdIconRaw = (params.get("cdIcon") || params.get("icon") || "hourglass_empty").trim();
        const slot = document.getElementById("cd-icon");
        const hideIcon =
          !cdIconRaw ||
          cdIconRaw === "0" ||
          cdIconRaw === "none" ||
          cdIconRaw === "off" ||
          cdIconRaw === "false" ||
          cdIconRaw === "hide";
        if (slot && hideIcon) {
          slot.hidden = true;
          slot.innerHTML = "";
        } else if (slot && cdIconRaw) {
          slot.hidden = false;
          if (isUrlIcon(cdIconRaw)) {
            slot.innerHTML = "";
            const img = document.createElement("img");
            img.className = "custom-icon";
            img.alt = "";
            img.referrerPolicy = "no-referrer";
            img.src = cdIconRaw;
            img.onerror = () => {
              if (window.MyObsMaterialIcons) {
                window.MyObsMaterialIcons.mountIcon(slot, "hourglass_empty", {
                  forceSvg: true,
                });
              }
            };
            slot.appendChild(img);
          } else if (window.MyObsMaterialIcons) {
            window.MyObsMaterialIcons.mountIcon(slot, cdIconRaw || "hourglass_empty", {
              forceSvg: true,
            });
          }
        }

        function pad(n) {
          return String(Math.max(0, Math.floor(n))).padStart(2, "0");
        }

        function formatHMS(totalSeconds) {
          const s = Math.max(0, Math.floor(totalSeconds));
          const h = Math.floor(s / 3600);
          const m = Math.floor((s % 3600) / 60);
          const sec = s % 60;
          return `${pad(h)}:${pad(m)}:${pad(sec)}`;
        }

        function parseCountdownTarget() {
          const absolute = params.get("countdown") || params.get("target");
          if (absolute) {
            const t = Date.parse(absolute);
            if (!Number.isNaN(t)) return new Date(t);
          }
          const mins = parseFloat(params.get("cdMins") || params.get("mins") || "");
          const secs = parseFloat(params.get("cdSecs") || params.get("secs") || "");
          let total = 0;
          if (!Number.isNaN(mins)) total += mins * 60;
          if (!Number.isNaN(secs)) total += secs;
          if (total > 0) return new Date(Date.now() + total * 1000);
          return null;
        }

        const countdownTarget = parseCountdownTarget();
        const doneText = params.get("cdDone") || "00:00:00";

        function tick() {
          if (!countdownTarget) {
            els.countdown.textContent = doneText;
            return;
          }
          const remain = (countdownTarget - Date.now()) / 1000;
          els.countdown.textContent =
            remain <= 0 ? doneText : formatHMS(remain);
        }

        tick();
        setInterval(tick, 250);
      })();
    </script>
  </body>
</html>
