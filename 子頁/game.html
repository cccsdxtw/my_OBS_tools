<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS Game Title</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script src="../material-icons.js"></script>
    <style>
      :root {
        --bg: rgba(0, 0, 0, 0.45);
        --fg: rgba(255, 255, 255, 0.85);
        --icon: var(--fg);
        --muted: rgba(255, 255, 255, 0.7);
        --size: 22px;
        --bar-h: calc(var(--size) + 16px);
        --pad-x: 12px;
        --gap: 10px;
        --radius: 0;
        --font-zh: "IBM Plex Sans TC", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
        --font-num: "JetBrains Mono", "Cascadia Mono", "Consolas", "Courier New",
          monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        color: var(--fg);
      }

      #bar {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: var(--gap);
        height: var(--bar-h);
        padding: 0 var(--pad-x);
        background: var(--bg);
        border-radius: var(--radius);
        white-space: nowrap;
        line-height: 1;
        overflow: hidden;
      }

      .icon-slot {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: calc(var(--size) * 0.95);
        height: calc(var(--size) * 0.95);
        flex: 0 0 auto;
      }

      .icon,
      .custom-icon {
        width: 100%;
        height: 100%;
        opacity: 0.95;
        display: block;
        object-fit: contain;
      }

      .material-symbols-outlined.icon {
        font-family: "Material Symbols Outlined", sans-serif;
        font-weight: normal;
        font-style: normal;
        width: auto;
        height: auto;
        font-size: calc(var(--size) * 0.95);
        line-height: 1;
        color: var(--icon);
        font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
        -webkit-font-feature-settings: "liga";
        font-feature-settings: "liga";
        display: inline-block;
        white-space: nowrap;
        direction: ltr;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        user-select: none;
      }

      .svg-icon {
        width: 100%;
        height: 100%;
        display: block;
        fill: var(--icon);
        color: var(--icon);
      }

      .label::after {
        content: "：";
        margin-right: 0.1em;
      }

      .label,
      .value {
        display: flex;
        align-items: center;
        height: var(--size);
        margin: 0;
        padding: 0;
        border: 0;
        line-height: 1;
      }

      .label {
        color: var(--muted);
        font-family: var(--font-zh);
        font-size: calc(var(--size) * 0.82);
        font-weight: 600;
        letter-spacing: 0.04em;
        transform: translateY(0.06em);
      }

      .value {
        font-family: var(--font-zh);
        font-size: var(--size);
        font-weight: 600;
        transform: translateY(0.02em);
      }

      .sep {
        opacity: 0.55;
        font-weight: 500;
        margin: 0 0.15em;
      }

      .platform {
        font-family: var(--font-num);
        font-weight: 500;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="bar" aria-live="polite">
      <span class="icon-slot" id="game-icon" hidden></span>
      <span class="label" id="game-label">遊戲名稱</span>
      <span class="value" id="game-value">
        <span class="platform" id="game-platform">PC</span>
        <span class="sep" id="game-sep"> - </span>
        <span id="game-name">遊戲名</span>
      </span>
    </div>

    <script>
      (() => {
        const params = new URLSearchParams(location.search);

        function cssVar(name, value) {
          if (value) document.documentElement.style.setProperty(name, value);
        }

        cssVar("--size", params.get("fontSize") ? `${params.get("fontSize")}px` : "");
        cssVar("--fg", params.get("color"));
        cssVar("--icon", params.get("iconColor") || params.get("iconColour"));
        const bgParam = (params.get("bg") || "").trim();
        if (!bgParam || bgParam === "0" || bgParam === "false" || bgParam === "none" || bgParam === "off") {
          cssVar("--bg", "transparent");
        } else {
          cssVar("--bg", bgParam);
        }
        cssVar("--gap", params.get("gap") ? `${params.get("gap")}px` : "");
        cssVar("--radius", params.get("radius") ? `${params.get("radius")}px` : "");

        const ms = window.MyObsMaterialIcons;
        const normalizeMsName =
          (ms && ms.normalizeMsName) ||
          function (raw) {
            return String(raw || "")
              .trim()
              .replace(/([a-z0-9])([A-Z])/g, "$1_$2")
              .replace(/[\s-]+/g, "_")
              .toLowerCase()
              .replace(/[^a-z0-9_]/g, "");
          };

        function isUrlIcon(raw) {
          const s = String(raw || "").trim();
          return /^https?:\/\//i.test(s) || /\.(png|svg|webp|gif|jpe?g)(\?|#|$)/i.test(s);
        }

        function mountDefaultSvgIcon(slot) {
          slot.innerHTML = "";
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "svg-icon");
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("aria-hidden", "true");
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute(
            "d",
            "M21.58 16.09l-1.09-7.66C20.21 6.46 18.52 5 16.53 5H7.47C5.48 5 3.79 6.46 3.51 8.43l-1.09 7.66C2.2 17.63 3.39 19 4.94 19c.68 0 1.32-.27 1.8-.75L9 16h6l2.25 2.25c.48.48 1.13.75 1.8.75 1.56 0 2.75-1.37 2.53-2.91zM11 11H9v2H8v-2H6v-1h2V8h1v2h2v1zm4-1.5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"
          );
          svg.appendChild(path);
          slot.appendChild(svg);
        }

        function iconLooksEmpty(el) {
          try {
            const r = el.getBoundingClientRect();
            return !r.width || r.width < 2 || !r.height || r.height < 2;
          } catch (_) {
            return true;
          }
        }

        async function mountMaterialIcon(slot, rawName) {
          const name = normalizeMsName(rawName) || "sports_esports";
          // 預設手把：直接 SVG，避免 file://／OBS／精簡字型缺 glyph 時空白
          if (name === "sports_esports") {
            mountDefaultSvgIcon(slot);
            return;
          }
          slot.innerHTML = "";
          const span = document.createElement("span");
          span.className = "material-symbols-outlined icon";
          span.setAttribute("aria-hidden", "true");
          span.textContent = name;
          slot.appendChild(span);
          // Google Fonts 優先 → 快取 → 內建 fonts/；量不到寬度就當失敗
          let source = "local";
          if (ms && ms.ensureMaterialSymbols) {
            source = await ms.ensureMaterialSymbols([name]);
          }
          if (document.fonts && document.fonts.load) {
            try {
              await document.fonts.load(`500 24px "Material Symbols Outlined"`);
            } catch (_) {}
          }
          // 等一幀再量，給 ligature 字形時間
          await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
          if (iconLooksEmpty(span) || source === "local") {
            // 本機精簡字型通常沒有完整圖示；量不到就退回手把 SVG
            mountDefaultSvgIcon(slot);
          }
        }

        // 沒帶參數也給預設手把圖，避免 OBS 網址漏掉 gameIcon 時完全沒圖
        const iconRaw = (
          params.get("gameIcon") ||
          params.get("icon") ||
          "sports_esports"
        ).trim();
        const iconSlot = document.getElementById("game-icon");
        if (iconSlot && iconRaw && iconRaw !== "0" && iconRaw !== "none" && iconRaw !== "off") {
          iconSlot.hidden = false;
          if (isUrlIcon(iconRaw)) {
            iconSlot.innerHTML = "";
            const img = document.createElement("img");
            img.className = "custom-icon";
            img.alt = "";
            img.referrerPolicy = "no-referrer";
            img.src = iconRaw;
            img.onerror = () => mountDefaultSvgIcon(iconSlot);
            iconSlot.appendChild(img);
          } else {
            mountMaterialIcon(iconSlot, iconRaw);
          }
        }

        const label =
          (params.get("gameLabel") || params.get("label") || "遊戲名稱").trim() || "遊戲名稱";
        const platform = (params.get("platform") || params.get("plat") || "").trim();
        const game = (params.get("game") || params.get("title") || "").trim();
        let sep = params.get("sep");
        if (sep == null || sep === "") sep = " - ";
        else {
          try {
            sep = decodeURIComponent(sep);
          } catch (_) {}
        }

        document.getElementById("game-label").textContent = label;
        const platEl = document.getElementById("game-platform");
        const sepEl = document.getElementById("game-sep");
        const nameEl = document.getElementById("game-name");

        if (platform && game) {
          platEl.textContent = platform;
          sepEl.textContent = sep;
          nameEl.textContent = game;
        } else if (game) {
          platEl.hidden = true;
          sepEl.hidden = true;
          nameEl.textContent = game;
        } else if (platform) {
          sepEl.hidden = true;
          nameEl.hidden = true;
          platEl.textContent = platform;
        } else {
          platEl.textContent = "平台";
          nameEl.textContent = "遊戲名";
        }
      })();
    </script>
  </body>
</html>
