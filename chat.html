<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>拉基的OBS工具箱 · 聊天室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style id="base-style">
      :root {
        --bg: rgba(0, 0, 0, 0.45);
        --fg: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.55);
        --tw: #bf94ff;
        --yt: #ff6b6b;
        --size: 18px;
        --pad: 10px;
        --radius: 0;
        --gap: 6px;
        --font-zh: "IBM Plex Sans TC", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        color: var(--fg);
        font-family: var(--font-zh);
      }

      #wrap {
        width: 100%;
        height: 100%;
        padding: var(--pad);
        background: var(--bg);
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      #wrap.stack-bottom {
        justify-content: flex-end;
      }

      #wrap.stack-top {
        justify-content: flex-start;
      }

      #feed {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        overflow: hidden;
        min-height: 0;
        width: 100%;
      }

      #wrap.stack-bottom #feed {
        justify-content: flex-end;
      }

      #wrap.stack-top #feed {
        justify-content: flex-start;
      }

      .msg {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        line-height: 1.35;
        font-size: var(--size);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        animation: in 0.2s ease-out;
        word-break: break-word;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }

      .msg.fade-out {
        opacity: 0;
        transform: translateY(-4px);
      }

      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #wrap.stack-top .msg {
        animation-name: in-top;
      }

      @keyframes in-top {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .plat {
        flex: 0 0 auto;
        font-size: 0.72em;
        font-weight: 700;
        letter-spacing: 0.04em;
        margin-top: 0.2em;
        opacity: 0.9;
      }

      .plat.tw {
        color: var(--tw);
      }

      .plat.yt {
        color: var(--yt);
      }

      body.hide-source .plat {
        display: none;
      }

      .user {
        flex: 0 0 auto;
        font-weight: 700;
        color: var(--muted);
        margin-top: 0.05em;
      }

      .user::after {
        content: ":";
        margin-left: 1px;
      }

      .text {
        min-width: 0;
        font-weight: 500;
      }

      #status {
        position: absolute;
        left: 8px;
        top: 6px;
        font-size: 12px;
        color: var(--muted);
        opacity: 0.7;
        pointer-events: none;
        z-index: 2;
      }

      body.hide-status #status {
        display: none;
      }
    </style>
    <style id="custom-style"></style>
  </head>
  <body>
    <div id="status">connecting…</div>
    <div id="wrap" class="stack-bottom">
      <div id="feed" aria-live="polite"></div>
    </div>

    <script>
      (() => {
        const YT_API = "https://www.googleapis.com/youtube/v3";
        const params = new URLSearchParams(location.search);
        const wrap = document.getElementById("wrap");

        function cssVar(name, value) {
          if (value) document.documentElement.style.setProperty(name, value);
        }

        cssVar("--size", params.get("fontSize") ? `${params.get("fontSize")}px` : "");
        cssVar("--fg", params.get("color"));
        cssVar("--pad", params.get("pad") ? `${params.get("pad")}px` : "");
        cssVar("--gap", params.get("gap") ? `${params.get("gap")}px` : "");
        cssVar("--radius", params.get("radius") ? `${params.get("radius")}px` : "");
        const bgParam = (params.get("bg") || "").trim();
        if (!bgParam || bgParam === "0" || bgParam === "false" || bgParam === "none" || bgParam === "off") {
          cssVar("--bg", "transparent");
        } else {
          cssVar("--bg", bgParam);
        }

        const maxMsgs = Math.max(5, Math.min(100, parseInt(params.get("max") || "30", 10) || 30));
        const ttlSec = Math.max(0, parseInt(params.get("ttl") || "0", 10) || 0);
        const stack = (params.get("stack") || "bottom").toLowerCase() === "top" ? "top" : "bottom";
        const showSource = params.get("showSource") !== "0";
        const demo = params.get("demo") === "1";
        if (params.get("hideStatus") === "1") document.body.classList.add("hide-status");
        if (!showSource) document.body.classList.add("hide-source");
        wrap.className = `stack-${stack}`;

        const customCss = params.get("css") || "";
        if (customCss) {
          try {
            document.getElementById("custom-style").textContent = customCss;
          } catch (_) {}
        }

        const twitchLogin = (
          params.get("login") ||
          params.get("twitch") ||
          params.get("channel") ||
          ""
        )
          .trim()
          .toLowerCase();
        const ytChannel = (params.get("yt") || params.get("youtube") || params.get("ytChannel") || "").trim();
        const ytVideoParam = (params.get("ytVideo") || "").trim();
        const ytKey = (params.get("ytKey") || params.get("youtubeKey") || "").trim();
        // auto|twitch|youtube|both（分開兩頁時各傳 twitch / youtube）
        const sources = (params.get("chatSource") || "auto").toLowerCase();

        const feed = document.getElementById("feed");
        const statusEl = document.getElementById("status");
        const connected = { tw: false, yt: false };

        const wantTw =
          !!twitchLogin && (sources === "auto" || sources === "twitch" || sources === "both");
        const wantYt =
          !!(ytVideoParam || (ytChannel && ytKey)) &&
          (sources === "auto" || sources === "youtube" || sources === "both");
        // demo 時依 chatSource 決定要播哪些示範平台
        const demoTw = demo && (sources === "auto" || sources === "twitch" || sources === "both");
        const demoYt = demo && (sources === "auto" || sources === "youtube" || sources === "both");

        function refreshStatus() {
          if (demo && !wantTw && !wantYt) {
            statusEl.textContent = "DEMO";
            return;
          }
          const parts = [];
          if (wantTw) parts.push(connected.tw ? "TW●" : "TW○");
          if (wantYt) parts.push(connected.yt ? "YT●" : "YT○");
          if (demo) parts.push("DEMO");
          statusEl.textContent = parts.length ? parts.join(" ") : "NO SRC";
        }

        function trimFeed() {
          while (feed.children.length > maxMsgs) {
            if (stack === "top") feed.removeChild(feed.lastChild);
            else feed.removeChild(feed.firstChild);
          }
        }

        function addMessage({ platform, user, text, born }) {
          const row = document.createElement("div");
          row.className = "msg";
          row.dataset.born = String(born || Date.now());
          row.dataset.platform = platform;
          const plat = document.createElement("span");
          plat.className = `plat ${platform}`;
          plat.textContent = platform === "tw" ? "TW" : "YT";
          const u = document.createElement("span");
          u.className = "user";
          u.textContent = user || "anon";
          const t = document.createElement("span");
          t.className = "text";
          t.textContent = text || "";
          row.append(plat, u, t);
          if (stack === "top") feed.insertBefore(row, feed.firstChild);
          else feed.appendChild(row);
          trimFeed();
        }

        function expireTick() {
          if (!ttlSec) return;
          const cutoff = Date.now() - ttlSec * 1000;
          document.querySelectorAll(".msg").forEach((el) => {
            const born = parseInt(el.dataset.born || "0", 10) || 0;
            if (born && born < cutoff && !el.classList.contains("fade-out")) {
              el.classList.add("fade-out");
              setTimeout(() => {
                try {
                  el.remove();
                } catch (_) {}
              }, 380);
            }
          });
        }
        if (ttlSec > 0) setInterval(expireTick, 500);

        function startDemo() {
          const all = [
            { platform: "tw", user: "拉基粉絲A", text: "哈哈哈這招好強" },
            { platform: "yt", user: "YT觀眾1", text: "剛進來～晚安" },
            { platform: "tw", user: "NightOwl", text: "KKK 太好笑了" },
            { platform: "yt", user: "貓奴", text: "求歌單！" },
            { platform: "tw", user: "BoxBox", text: "POG" },
            { platform: "yt", user: "小白", text: "訂閱了～" },
            { platform: "tw", user: "Tea", text: "今天氣氛很好" },
            { platform: "yt", user: "StreamerFan", text: "加油加油" },
          ];
          const samples = all.filter((m) => (m.platform === "tw" ? demoTw : demoYt));
          if (!samples.length) return;
          const now = Date.now();
          samples.slice(0, Math.min(6, samples.length)).forEach((m, i) => {
            addMessage({ ...m, born: now - (6 - i) * 2500 });
          });
          let i = 0;
          setInterval(() => {
            addMessage(samples[i % samples.length]);
            i += 1;
          }, 2200);
        }

        if (!wantTw && !wantYt && !demo) {
          statusEl.textContent = "NO SRC";
          return;
        }
        refreshStatus();

        function connectTwitch() {
          if (!wantTw) return;
          const nick = `justinfan${Math.floor(10000 + Math.random() * 80000)}`;
          let ws;
          let closed = false;
          let retry = 0;

          function connect() {
            ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
            ws.addEventListener("open", () => {
              ws.send("PASS SCHMOOPIIE");
              ws.send(`NICK ${nick}`);
              ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
              ws.send(`JOIN #${twitchLogin}`);
            });
            ws.addEventListener("message", (ev) => {
              const raw = String(ev.data || "");
              raw.split("\r\n").forEach((line) => {
                if (!line) return;
                if (line.startsWith("PING")) {
                  ws.send("PONG :tmi.twitch.tv");
                  return;
                }
                if (line.includes(" JOIN #")) {
                  connected.tw = true;
                  refreshStatus();
                }
                const m = line.match(
                  /^(?:@([^ ]+) )?(?::([^ ]+) )?PRIVMSG #[^ ]+ :(.*)$/
                );
                if (!m) return;
                const tags = {};
                if (m[1]) {
                  m[1].split(";").forEach((kv) => {
                    const i = kv.indexOf("=");
                    if (i > -1) tags[kv.slice(0, i)] = kv.slice(i + 1);
                  });
                }
                const user =
                  decodeURIComponent((tags["display-name"] || "").replace(/\\s/g, " ")) ||
                  (m[2] || "").split("!")[0] ||
                  "twitch";
                addMessage({ platform: "tw", user, text: m[3] });
              });
            });
            ws.addEventListener("close", () => {
              connected.tw = false;
              refreshStatus();
              if (closed) return;
              retry = Math.min(retry + 1, 6);
              setTimeout(connect, 1000 * retry);
            });
            ws.addEventListener("error", () => {
              try {
                ws.close();
              } catch (_) {}
            });
          }
          connect();
          window.addEventListener("beforeunload", () => {
            closed = true;
            try {
              ws && ws.close();
            } catch (_) {}
          });
        }

        function normalizeHandle(input) {
          let s = input.trim();
          if (s.startsWith("http://") || s.startsWith("https://")) {
            try {
              const u = new URL(s);
              const parts = u.pathname.split("/").filter(Boolean);
              if (parts[0] === "channel" && parts[1]) return parts[1];
              if (parts[0]?.startsWith("@")) return parts[0];
              if (parts[0]) return parts[0];
            } catch (_) {}
          }
          return s;
        }

        async function resolveYtChannelId() {
          const raw = normalizeHandle(ytChannel);
          if (/^UC[\w-]{22}$/.test(raw)) return raw;
          const handle = raw.startsWith("@") ? raw.slice(1) : raw;
          const url = `${YT_API}/channels?part=id&forHandle=${encodeURIComponent(
            handle
          )}&key=${encodeURIComponent(ytKey)}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`yt channel ${res.status}`);
          const json = await res.json();
          const id = json?.items?.[0]?.id;
          if (!id) throw new Error("yt channel not found");
          return id;
        }

        async function resolveLiveVideoId() {
          if (ytVideoParam) return ytVideoParam;
          const channelId = await resolveYtChannelId();
          const url = `${YT_API}/search?part=snippet&channelId=${encodeURIComponent(
            channelId
          )}&eventType=live&type=video&maxResults=1&key=${encodeURIComponent(ytKey)}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`yt search ${res.status}`);
          const json = await res.json();
          return json?.items?.[0]?.id?.videoId || null;
        }

        async function resolveLiveChatId(videoId) {
          const url = `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
            videoId
          )}&key=${encodeURIComponent(ytKey)}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`yt videos ${res.status}`);
          const json = await res.json();
          return json?.items?.[0]?.liveStreamingDetails?.activeLiveChatId || null;
        }

        async function pollYoutube() {
          if (!wantYt) return;
          if (!ytKey && !ytVideoParam) return;
          let videoId = null;
          let chatId = null;
          let pageToken = "";
          let seen = new Set();
          let fail = 0;

          async function ensureChat() {
            videoId = await resolveLiveVideoId();
            if (!videoId) throw new Error("yt offline");
            chatId = await resolveLiveChatId(videoId);
            if (!chatId) throw new Error("yt no live chat");
            connected.yt = true;
            refreshStatus();
            fail = 0;
          }

          async function tick() {
            try {
              if (!chatId) await ensureChat();
              const url = new URL(`${YT_API}/liveChat/messages`);
              url.searchParams.set("liveChatId", chatId);
              url.searchParams.set("part", "snippet,authorDetails");
              url.searchParams.set("maxResults", "20");
              url.searchParams.set("key", ytKey);
              if (pageToken) url.searchParams.set("pageToken", pageToken);
              const res = await fetch(url);
              if (!res.ok) {
                if (res.status === 403 || res.status === 404) {
                  chatId = null;
                  connected.yt = false;
                  refreshStatus();
                }
                throw new Error(`yt chat ${res.status}`);
              }
              const json = await res.json();
              pageToken = json.nextPageToken || pageToken;
              const wait = Math.max(2500, Number(json.pollingIntervalMillis || 5000));
              (json.items || []).forEach((item) => {
                const id = item.id;
                if (!id || seen.has(id)) return;
                seen.add(id);
                if (seen.size > 500) {
                  seen = new Set(Array.from(seen).slice(-200));
                }
                const text =
                  item.snippet?.displayMessage ||
                  item.snippet?.textMessageDetails?.messageText ||
                  "";
                const user = item.authorDetails?.displayName || "youtube";
                if (text) addMessage({ platform: "yt", user, text });
              });
              setTimeout(tick, wait);
            } catch (err) {
              console.warn(err);
              connected.yt = false;
              refreshStatus();
              fail += 1;
              chatId = fail >= 3 ? null : chatId;
              setTimeout(tick, Math.min(15000, 3000 * fail));
            }
          }

          tick();
        }

        if (demo) startDemo();
        else {
          connectTwitch();
          pollYoutube();
        }
        refreshStatus();
      })();
    </script>
  </body>
</html>
