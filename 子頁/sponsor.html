<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS 贊助條 · TW 小奇點 + YT 超留</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script src="../panel-bg.js"></script>
    <style>
      :root {
        --bg: rgba(0, 0, 0, 0.45);
        --fg: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.55);
        --tw: #bf94ff;
        --yt: #ff6b6b;
        --bar: #3dcf9a;
        --size: 18px;
        --pad-x: 12px;
        --pad-y: 8px;
        --radius: 0;
        --gap: 10px;
        --font-zh: "IBM Plex Sans TC", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
        --font-num: "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        color: var(--fg);
        font-family: var(--font-zh);
      }

      #bar {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: calc(var(--size) + 16px);
        padding: var(--panel-inset, var(--pad-y) var(--pad-x));
        background-color: var(--bg);
        background-image: var(--panel-img, none);
        background-size: var(--panel-fit, 100% 100%);
        background-repeat: no-repeat;
        background-position: center;
        border-radius: var(--radius);
        line-height: 1.2;
      }

      .top {
        display: flex;
        align-items: center;
        gap: var(--gap);
        flex-wrap: wrap;
        white-space: nowrap;
      }

      .totals {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: var(--size);
        font-weight: 700;
      }

      .tot.tw {
        color: var(--tw);
      }
      .tot.yt {
        color: var(--yt);
      }
      .tot.combined {
        color: var(--bar);
      }

      #manualToggle {
        margin-left: 4px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.08);
        color: var(--muted);
        font: inherit;
        font-size: calc(var(--size) * 0.7);
        font-weight: 700;
        padding: 2px 7px;
        cursor: pointer;
      }
      #manualToggle:hover {
        color: var(--fg);
        border-color: rgba(255, 255, 255, 0.45);
      }

      #manualPanel {
        display: none;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        padding: 4px 0 2px;
        font-size: calc(var(--size) * 0.72);
      }
      #manualPanel.open {
        display: flex;
      }
      #manualPanel select,
      #manualPanel input {
        font: inherit;
        font-size: inherit;
        color: var(--fg);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 3px 6px;
        max-width: 140px;
      }
      #manualPanel button {
        font: inherit;
        font-size: inherit;
        font-weight: 700;
        border: 0;
        background: var(--bar);
        color: #042016;
        padding: 3px 10px;
        cursor: pointer;
      }

      .tot span.num {
        font-family: var(--font-num);
        font-weight: 700;
      }

      #goals {
        flex: 1;
        min-width: 140px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .goal-wrap {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .goal-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: calc(var(--size) * 0.72);
        color: var(--muted);
        font-weight: 600;
      }

      .goal-track {
        height: 8px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }

      .goal-fill {
        height: 100%;
        width: 0%;
        background: var(--bar);
        transition: width 0.35s ease;
      }

      .evt .fund {
        color: var(--bar);
        font-weight: 700;
      }

      #status {
        margin-left: auto;
        font-size: calc(var(--size) * 0.7);
        color: var(--muted);
        font-weight: 600;
      }

      body.hide-status #status {
        display: none;
      }

      .feed {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        min-height: calc(var(--size) * 1.1);
      }

      .evt {
        display: inline-flex;
        align-items: baseline;
        gap: 0.35em;
        padding: 2px 8px;
        background: rgba(255, 255, 255, 0.08);
        font-size: calc(var(--size) * 0.88);
        font-weight: 600;
        white-space: nowrap;
        animation: pop 0.35s ease;
      }

      .evt.tw {
        box-shadow: inset 3px 0 0 var(--tw);
      }
      .evt.yt {
        box-shadow: inset 3px 0 0 var(--yt);
      }

      .evt .who {
        color: var(--fg);
      }
      .evt .amt {
        font-family: var(--font-num);
        font-weight: 700;
      }
      .evt.tw .amt {
        color: var(--tw);
      }
      .evt.yt .amt {
        color: var(--yt);
      }
      .evt .msg {
        color: var(--muted);
        font-weight: 500;
        max-width: 14em;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="bar" aria-live="polite">
      <div class="top">
        <div class="totals">
          <div class="tot combined" id="totCombined" hidden>
            合計 <span class="num" id="combinedMoney">—</span>
          </div>
          <div class="tot tw" id="totTw" hidden>TW <span class="num" id="twBits">0</span> bits</div>
          <div class="tot yt" id="totYt" hidden>YT <span class="num" id="ytMoney">—</span></div>
        </div>
        <div id="goals" hidden></div>
        <div id="status">…</div>
        <button type="button" id="manualToggle" title="手動補登（OBS 來源→互動）">＋手動</button>
      </div>
      <form id="manualPanel" autocomplete="off">
        <select id="manualFund" aria-label="基金"></select>
        <select id="manualPlatform" aria-label="平台">
          <option value="tw">TW bits</option>
          <option value="yt">YT 金額</option>
        </select>
        <input id="manualAmount" type="number" step="1" min="0" placeholder="數量" required />
        <input id="manualMsg" type="text" placeholder="備註（選填）" />
        <button type="submit">加入</button>
      </form>
      <div class="feed" id="feed"></div>
    </div>

    <script>
      (() => {
        const YT_API = "https://www.googleapis.com/youtube/v3";
        const params = new URLSearchParams(location.search);

        function cssVar(name, value) {
          if (value) document.documentElement.style.setProperty(name, value);
        }

        cssVar("--size", params.get("fontSize") ? `${params.get("fontSize")}px` : "");
        cssVar("--fg", params.get("color"));
        const bgParam = (params.get("bg") || "").trim();
        if (!bgParam || bgParam === "0" || bgParam === "false" || bgParam === "none" || bgParam === "off") {
          cssVar("--bg", "transparent");
        } else {
          cssVar("--bg", bgParam);
        }
        if (window.ObsPanelBg) {
          ObsPanelBg.applyOverlayPanelBg(params, cssVar, { defaultInset: 12 });
        }
        if (params.get("hideStatus") === "1") document.body.classList.add("hide-status");

        const twitchLogin = (
          params.get("login") ||
          params.get("twitch") ||
          params.get("channel") ||
          ""
        )
          .trim()
          .toLowerCase();
        const ytChannel = (params.get("yt") || params.get("youtube") || params.get("ytChannel") || "").trim();
        const ytKey = (params.get("ytKey") || params.get("youtubeKey") || "").trim();

        function extractYoutubeVideoId(raw) {
          const s = String(raw || "").trim();
          if (!s) return "";
          if (/^[\w-]{11}$/.test(s)) return s;
          try {
            const u = new URL(s);
            const host = u.hostname.replace(/^www\./, "");
            if (host === "youtu.be") {
              const id = u.pathname.split("/").filter(Boolean)[0] || "";
              return /^[\w-]{11}$/.test(id) ? id : "";
            }
            if (
              host === "youtube.com" ||
              host === "m.youtube.com" ||
              host === "music.youtube.com"
            ) {
              const v = u.searchParams.get("v");
              if (v && /^[\w-]{11}$/.test(v)) return v;
              const parts = u.pathname.split("/").filter(Boolean);
              if (
                (parts[0] === "live" || parts[0] === "embed" || parts[0] === "shorts") &&
                parts[1] &&
                /^[\w-]{11}$/.test(parts[1])
              ) {
                return parts[1];
              }
            }
          } catch (_) {}
          const m = s.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/);
          return m ? m[1] : s;
        }

        const ytVideoParam = extractYoutubeVideoId(params.get("ytVideo") || "");
        const wantTw = !!twitchLogin;
        const wantYt = !!(ytVideoParam || (ytChannel && ytKey));
        function flagOn(raw) {
          return ["1", "true", "yes", "demo", "on"].includes(
            String(raw || "").trim().toLowerCase()
          );
        }
        // 入口預覽／DEMO：不讀寫正式贊助進度
        const demo = flagOn(params.get("demo")) || flagOn(params.get("preview"));
        const maxEvents = Math.max(3, Math.min(20, parseInt(params.get("max") || "8", 10) || 8));
        const combine = params.get("combine") === "1";
        const bitsRate = combine
          ? Math.max(0, Number(params.get("bitsRate") || 0) || 0)
          : 0; // 每 100 bits → 多少目標幣（僅合併時）
        const goalCurrency = (params.get("goalCurrency") || "TWD").trim() || "TWD";

        function splitKeywords(raw) {
          return String(raw || "")
            .split(/[,，、\n\r|／/]+/)
            .map((s) => s.trim())
            .filter(Boolean);
        }

        // manual=platform|amount|currency|fundName|note|id （可多筆）
        // 舊版相容：manualBits / manualYt
        function parseManualEntries() {
          const list = [];
          params.getAll("manual").forEach((raw, i) => {
            const parts = String(raw || "").split("|");
            const platform = (parts[0] || "").trim().toLowerCase() === "yt" ? "yt" : "tw";
            const amount = Number(parts[1] || 0) || 0;
            if (!amount) return;
            list.push({
              id: (parts[5] || "").trim() || `manual:url:${i}:${platform}:${amount}`,
              platform,
              amount,
              currency: ((parts[2] || goalCurrency).trim() || goalCurrency).toUpperCase(),
              fundName: (parts[3] || "").trim(),
              note: (parts[4] || "").trim() || "手動補登",
            });
          });
          const legacyBits = parseInt(params.get("manualBits") || "0", 10) || 0;
          const legacyYt = Number(params.get("manualYt") || 0) || 0;
          const legacyCur = (
            params.get("manualYtCurrency") ||
            params.get("manualCurrency") ||
            goalCurrency
          )
            .trim()
            .toUpperCase() || goalCurrency;
          const legacyNote = (params.get("manualNote") || "手動補登").trim() || "手動補登";
          if (legacyBits) {
            list.push({
              id: `manual:legacy:tw:${legacyBits}`,
              platform: "tw",
              amount: legacyBits,
              currency: "",
              fundName: "",
              note: legacyNote,
            });
          }
          if (legacyYt) {
            list.push({
              id: `manual:legacy:yt:${legacyYt}`,
              platform: "yt",
              amount: legacyYt,
              currency: legacyCur,
              fundName: "",
              note: legacyNote,
            });
          }
          return list;
        }

        const manualEntries = parseManualEntries();

        function parseFunds() {
          const rawList = params.getAll("fund").filter(Boolean);
          /** @type {Array<{id:string,name:string,goal:number,keywords:string[]}>} */
          let list = rawList.map((raw, i) => {
            const parts = String(raw).split("|");
            const name = (parts[0] || "").trim() || `基金${i + 1}`;
            const goal = Math.max(0, Number(parts[1] || 0) || 0);
            const kwRaw = (parts[2] != null ? parts[2] : "").trim();
            const keywords = splitKeywords(kwRaw || name);
            return {
              id: `fund${i}_${name}`,
              name,
              goal,
              keywords,
            };
          });
          if (!list.length) {
            // 舊版單目標
            const goal = Math.max(0, Number(params.get("goal") || 0) || 0);
            const name = (params.get("goalLabel") || "本場目標").trim() || "本場目標";
            const keywords = splitKeywords(params.get("must") || params.get("keywords") || "");
            list = [
              {
                id: "fund0_" + name,
                name,
                goal,
                keywords: keywords.length ? keywords : [],
              },
            ];
          }
          return list;
        }

        const funds = parseFunds();
        /** @type {Record<string,{twBits:number,yt:number}>} */
        const fundState = {};
        funds.forEach((f) => {
          fundState[f.id] = { twBits: 0, yt: 0 };
        });

        function parseTimeMs(raw) {
          const s = String(raw || "").trim();
          if (!s) return null;
          const t = Date.parse(s);
          return Number.isNaN(t) ? null : t;
        }

        const windowStartMs = parseTimeMs(params.get("start") || params.get("from"));
        const durationMins = Math.max(0, parseInt(params.get("duration") || "0", 10) || 0);
        let windowEndMs = parseTimeMs(params.get("end") || params.get("until"));
        if (windowEndMs == null && windowStartMs != null && durationMins > 0) {
          windowEndMs = windowStartMs + durationMins * 60 * 1000;
        } else if (windowEndMs == null && windowStartMs == null && durationMins > 0) {
          windowEndMs = Date.now() + durationMins * 60 * 1000;
        }

        function inCountWindow(tsMs) {
          if (demo) return true;
          const t = tsMs == null || Number.isNaN(tsMs) ? Date.now() : tsMs;
          if (windowStartMs != null && t < windowStartMs) return false;
          if (windowEndMs != null && t >= windowEndMs) return false;
          return true;
        }

        function windowPhase(now = Date.now()) {
          if (demo) return "demo";
          if (windowStartMs != null && now < windowStartMs) return "wait";
          if (windowEndMs != null && now >= windowEndMs) return "done";
          return "active";
        }

        function bestKeywordHitLen(fund, text) {
          if (!fund.keywords.length) return funds.length === 1 ? 0 : -1;
          let best = -1;
          fund.keywords.forEach((k) => {
            const key = k.toLowerCase();
            if (!key) return;
            if (text.includes(key)) best = Math.max(best, key.length);
          });
          return best;
        }

        // 一筆只進一個基金：多個都符合時，關鍵字較長者優先；一樣長則清單較前者
        function resolveFundId(rawMsg, forcedId) {
          if (forcedId && fundState[forcedId]) return forcedId;
          if (funds.length === 1 && !funds[0].keywords.length) return funds[0].id;
          const text = String(rawMsg || "").toLowerCase();
          if (!text.trim()) return "";
          let bestId = "";
          let bestLen = -1;
          funds.forEach((f) => {
            const len = bestKeywordHitLen(f, text);
            if (len > bestLen) {
              bestLen = len;
              bestId = f.id;
            }
          });
          return bestLen >= 0 ? bestId : "";
        }

        const els = {
          totCombined: document.getElementById("totCombined"),
          combinedMoney: document.getElementById("combinedMoney"),
          totTw: document.getElementById("totTw"),
          totYt: document.getElementById("totYt"),
          twBits: document.getElementById("twBits"),
          ytMoney: document.getElementById("ytMoney"),
          goals: document.getElementById("goals"),
          feed: document.getElementById("feed"),
          status: document.getElementById("status"),
          manualToggle: document.getElementById("manualToggle"),
          manualPanel: document.getElementById("manualPanel"),
          manualFund: document.getElementById("manualFund"),
          manualPlatform: document.getElementById("manualPlatform"),
          manualAmount: document.getElementById("manualAmount"),
          manualMsg: document.getElementById("manualMsg"),
        };

        const showTw =
          wantTw || demo || manualEntries.some((m) => m.platform === "tw");
        const showYt =
          wantYt || demo || manualEntries.some((m) => m.platform === "yt");
        els.totCombined.hidden = !(combine && (showTw || showYt));
        els.totTw.hidden = !showTw;
        els.totYt.hidden = !showYt;

        /** @type {Record<string,{wrap:HTMLElement,label:HTMLElement,text:HTMLElement,fill:HTMLElement}>} */
        const goalEls = {};
        function buildGoalUi() {
          els.goals.innerHTML = "";
          const showGoals = funds.some((f) => f.goal > 0) || funds.length > 1;
          els.goals.hidden = !showGoals;
          funds.forEach((f) => {
            const wrap = document.createElement("div");
            wrap.className = "goal-wrap";
            wrap.dataset.fund = f.id;
            const meta = document.createElement("div");
            meta.className = "goal-meta";
            const label = document.createElement("span");
            label.textContent = f.name;
            const text = document.createElement("span");
            text.textContent = "0";
            meta.append(label, text);
            const track = document.createElement("div");
            track.className = "goal-track";
            const fill = document.createElement("div");
            fill.className = "goal-fill";
            track.appendChild(fill);
            if (f.goal <= 0) track.style.display = "none";
            wrap.append(meta, track);
            els.goals.appendChild(wrap);
            goalEls[f.id] = { wrap, label, text, fill };
          });
          els.manualFund.innerHTML = "";
          funds.forEach((f) => {
            const opt = document.createElement("option");
            opt.value = f.id;
            opt.textContent = f.name;
            els.manualFund.appendChild(opt);
          });
        }
        buildGoalUi();

        const connected = { tw: false, yt: false };
        let twBitsTotal = 0;
        /** @type {Record<string, number>} currency -> major units */
        const ytByCurrency = {};
        /** @type {Array<object>} */
        let events = [];
        /** @type {Set<string>} */
        let seenIds = new Set();

        // 預覽模式 persistKey 為空＝只活在記憶體；正式 key 永不加 preview 前綴混用
        const persistKey = demo
          ? ""
          : [
              "laji_obs_sponsor_v2",
              twitchLogin || "-",
              (ytChannel || ytVideoParam || "-").toLowerCase(),
              windowStartMs || 0,
              windowEndMs || 0,
              durationMins || 0,
              combine ? "1" : "0",
              bitsRate || 0,
              funds.map((f) => `${f.name}:${f.goal}:${f.keywords.join(",")}`).join(";"),
              manualEntries.map((m) => `${m.id}:${m.platform}:${m.amount}`).join(","),
            ].join(":");

        function savePersist() {
          if (demo || !persistKey || persistKey.startsWith("preview:")) return;
          try {
            localStorage.setItem(
              persistKey,
              JSON.stringify({
                twBitsTotal,
                ytByCurrency,
                fundState,
                events: events.slice(0, maxEvents),
                seen: Array.from(seenIds).slice(-400),
                savedAt: Date.now(),
              })
            );
          } catch (_) {}
        }

        function loadPersist() {
          if (demo || !persistKey || persistKey.startsWith("preview:")) return;
          try {
            const raw = JSON.parse(localStorage.getItem(persistKey) || "null");
            if (!raw || typeof raw !== "object") return;
            twBitsTotal = Math.max(0, Number(raw.twBitsTotal) || 0);
            if (raw.ytByCurrency && typeof raw.ytByCurrency === "object") {
              Object.keys(raw.ytByCurrency).forEach((c) => {
                const n = Number(raw.ytByCurrency[c]);
                if (!Number.isNaN(n) && n > 0) ytByCurrency[c] = n;
              });
            }
            if (raw.fundState && typeof raw.fundState === "object") {
              Object.keys(fundState).forEach((id) => {
                const s = raw.fundState[id];
                if (!s) return;
                fundState[id].twBits = Math.max(0, Number(s.twBits) || 0);
                fundState[id].yt = Math.max(0, Number(s.yt) || 0);
              });
            }
            if (Array.isArray(raw.events)) {
              events = raw.events
                .filter((e) => e && e.platform && e.amountText)
                .slice(0, maxEvents);
            }
            if (Array.isArray(raw.seen)) {
              seenIds = new Set(raw.seen.map(String).filter(Boolean));
            }
          } catch (_) {}
        }

        function refreshStatus() {
          if (demo && !wantTw && !wantYt) {
            els.status.textContent = "DEMO";
            return;
          }
          const parts = [];
          const phase = windowPhase();
          if (phase === "wait") parts.push("未開始");
          else if (phase === "done") parts.push("已結束");
          else if (windowStartMs != null || windowEndMs != null) parts.push("計時中");
          if (wantTw) parts.push(connected.tw ? "TW●" : "TW○");
          if (wantYt) parts.push(connected.yt ? "YT●" : "YT○");
          if (combine) parts.push("合併");
          if (funds.length > 1) parts.push(`${funds.length}基金`);
          if (manualEntries.length) parts.push(`手動${manualEntries.length}`);
          if (persistKey && (twBitsTotal > 0 || Object.keys(ytByCurrency).length)) {
            parts.push("已記住");
          }
          if (demo) parts.push("DEMO");
          els.status.textContent = parts.length ? parts.join(" ") : "NO SRC";
        }

        function formatMoney(amount, currency) {
          const c = currency || goalCurrency;
          if (c === "TWD") return `NT$${Math.round(amount)}`;
          if (c === "USD") return `$${Number(amount).toFixed(2)}`;
          return `${c} ${Number(amount).toFixed(2)}`;
        }

        function formatYtTotals() {
          const keys = Object.keys(ytByCurrency);
          if (!keys.length) return "0";
          return keys.map((c) => formatMoney(ytByCurrency[c], c)).join(" · ");
        }

        function displayTwBits() {
          return twBitsTotal;
        }

        function fundBits(fundId) {
          const st = fundState[fundId] || { twBits: 0, yt: 0 };
          return st.twBits;
        }

        function fundYt(fundId) {
          const st = fundState[fundId] || { twBits: 0, yt: 0 };
          return st.yt;
        }

        function resolveFundIdByName(name) {
          const n = String(name || "").trim();
          if (!n) return funds[0]?.id || "";
          const hit = funds.find((f) => f.name === n || f.id === n);
          return hit ? hit.id : funds[0]?.id || "";
        }

        function fundProgressValue(fundId) {
          let sum = fundYt(fundId);
          if (combine && bitsRate > 0) sum += (fundBits(fundId) * bitsRate) / 100;
          return sum;
        }

        function allFundsProgressValue() {
          // 各基金互斥累計後加總（同一筆不會進兩基金，故不會重複）
          return funds.reduce((acc, f) => acc + fundProgressValue(f.id), 0);
        }

        function renderTotals() {
          // 上方總計：各基金各自累計後加總（互斥，不會同一筆算兩次）
          const twSum = funds.reduce((acc, f) => acc + fundBits(f.id), 0);
          const ytSum = funds.reduce((acc, f) => acc + fundYt(f.id), 0);
          els.twBits.textContent = String(twSum || displayTwBits());
          els.ytMoney.textContent =
            ytSum > 0 || Object.keys(ytByCurrency).length
              ? formatMoney(ytSum, goalCurrency)
              : formatYtTotals();
          if (combine) {
            els.combinedMoney.textContent = formatMoney(allFundsProgressValue(), goalCurrency);
          }
          funds.forEach((f) => {
            const ui = goalEls[f.id];
            if (!ui) return;
            const cur = fundProgressValue(f.id);
            const bits = fundBits(f.id);
            const parts = [];
            if (f.goal > 0) {
              const pct = Math.max(0, Math.min(100, (cur / f.goal) * 100));
              ui.fill.style.width = pct.toFixed(1) + "%";
              parts.push(
                `${formatMoney(cur, goalCurrency)} / ${formatMoney(f.goal, goalCurrency)}`
              );
            } else {
              parts.push(formatMoney(cur, goalCurrency));
            }
            if (bits > 0) parts.push(`${bits} bits`);
            ui.text.textContent = parts.join(" · ");
          });
        }

        function renderFeed() {
          els.feed.innerHTML = "";
          events.forEach((e) => {
            const row = document.createElement("div");
            row.className = `evt ${e.platform}`;
            if (e.fundName) {
              const fundTag = document.createElement("span");
              fundTag.className = "fund";
              fundTag.textContent = e.fundName;
              row.appendChild(fundTag);
            }
            const who = document.createElement("span");
            who.className = "who";
            who.textContent = e.user || "anon";
            const amt = document.createElement("span");
            amt.className = "amt";
            amt.textContent = e.amountText;
            row.append(who, amt);
            if (e.message) {
              const msg = document.createElement("span");
              msg.className = "msg";
              msg.textContent = e.message;
              row.appendChild(msg);
            }
            els.feed.appendChild(row);
          });
        }

        function pushEvent(evt) {
          events.unshift(evt);
          while (events.length > maxEvents) events.pop();
          renderFeed();
        }

        function creditFund(fundId, bits, ytMajor) {
          if (!fundId || !fundState[fundId]) return false;
          if (bits) fundState[fundId].twBits += bits;
          if (ytMajor) fundState[fundId].yt += ytMajor;
          return true;
        }

        function addTwBits(user, bits, message, tsMs, idHint, opts = {}) {
          const n = Math.max(0, parseInt(bits, 10) || 0);
          if (!n) return false;
          const force = !!opts.force;
          const cleanMsg = (message || "").replace(/Cheer\d+/gi, "").trim();
          const id =
            idHint ||
            `tw:${tsMs || 0}:${String(user || "").toLowerCase()}:${n}:${cleanMsg.slice(0, 40)}`;
          if (seenIds.has(id)) return false;
          seenIds.add(id);
          if (seenIds.size > 500) seenIds = new Set(Array.from(seenIds).slice(-250));
          if (!force && !inCountWindow(tsMs)) {
            savePersist();
            return false;
          }
          // 互斥：只解析出一個基金
          const fundId = resolveFundId(cleanMsg || message, opts.fundId);
          if (!fundId) {
            savePersist();
            return false;
          }
          const fund = funds.find((f) => f.id === fundId);
          twBitsTotal += n;
          creditFund(fundId, n, 0);
          pushEvent({
            platform: "tw",
            user,
            amountText: `${n} bits`,
            message: cleanMsg,
            fundId,
            fundName: fund ? fund.name : "",
            id,
          });
          renderTotals();
          savePersist();
          return true;
        }

        function addYtSuper(user, amountDisplay, amountMicros, currency, message, tsMs, idHint, opts = {}) {
          const id = idHint || `yt:${tsMs || 0}:${user}:${amountMicros || 0}`;
          if (seenIds.has(id)) return false;
          seenIds.add(id);
          if (seenIds.size > 500) seenIds = new Set(Array.from(seenIds).slice(-250));
          const force = !!opts.force;
          const msg = (message || "").trim();
          if (!force && !inCountWindow(tsMs)) {
            savePersist();
            return false;
          }
          // 互斥：只解析出一個基金
          const fundId = resolveFundId(msg, opts.fundId);
          if (!fundId) {
            savePersist();
            return false;
          }
          const fund = funds.find((f) => f.id === fundId);
          const cur = (currency || "TWD").toUpperCase();
          const major = amountMicros != null ? Number(amountMicros) / 1e6 : 0;
          if (!Number.isNaN(major) && major > 0) {
            ytByCurrency[cur] = (ytByCurrency[cur] || 0) + major;
            if (cur === goalCurrency) creditFund(fundId, 0, major);
          }
          pushEvent({
            platform: "yt",
            user,
            amountText: amountDisplay || `${cur} ${major}`,
            message: msg,
            fundId,
            fundName: fund ? fund.name : "",
            id,
          });
          renderTotals();
          savePersist();
          return true;
        }

        function applyUrlManualEntries() {
          manualEntries.forEach((m) => {
            const fundId = resolveFundIdByName(m.fundName);
            const id = `manual:url:${m.id}`;
            if (m.platform === "tw") {
              addTwBits("手動", m.amount, m.note, Date.now(), id, {
                force: true,
                fundId,
              });
            } else {
              addYtSuper(
                "手動",
                formatMoney(m.amount, m.currency || goalCurrency),
                m.amount * 1e6,
                m.currency || goalCurrency,
                m.note,
                Date.now(),
                id,
                { force: true, fundId }
              );
            }
          });
        }

        els.manualToggle.addEventListener("click", () => {
          els.manualPanel.classList.toggle("open");
          if (els.manualPanel.classList.contains("open")) {
            els.manualAmount.focus();
          }
        });
        els.manualPanel.addEventListener("submit", (ev) => {
          ev.preventDefault();
          const amount = Number(els.manualAmount.value);
          if (!amount || amount <= 0) return;
          const note = (els.manualMsg.value || "").trim() || "手動補登";
          const fundId = els.manualFund.value || funds[0]?.id;
          const now = Date.now();
          if (els.manualPlatform.value === "tw") {
            addTwBits("手動", amount, note, now, `manual:ui:tw:${now}`, {
              force: true,
              fundId,
            });
          } else {
            addYtSuper(
              "手動",
              formatMoney(amount, goalCurrency),
              amount * 1e6,
              goalCurrency,
              note,
              now,
              `manual:ui:yt:${now}`,
              { force: true, fundId }
            );
          }
          els.manualAmount.value = "";
          els.manualMsg.value = "";
          els.manualPanel.classList.remove("open");
        });

        loadPersist();
        // 網址手動補登：用穩定 id，重整不重複加
        applyUrlManualEntries();
        setInterval(refreshStatus, 1000);

        // ----- Twitch IRC cheers -----
        function connectTwitch() {
          if (!wantTw) return;
          const nick = `justinfan${Math.floor(10000 + Math.random() * 80000)}`;
          let ws;
          let closed = false;
          let retry = 0;

          function connect() {
            ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
            ws.addEventListener("open", () => {
              ws.send("PASS SCHMOOPIIE");
              ws.send(`NICK ${nick}`);
              ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
              ws.send(`JOIN #${twitchLogin}`);
            });
            ws.addEventListener("message", (ev) => {
              String(ev.data || "")
                .split("\r\n")
                .forEach((line) => {
                  if (!line) return;
                  if (line.startsWith("PING")) {
                    ws.send("PONG :tmi.twitch.tv");
                    return;
                  }
                  if (line.includes(" JOIN #")) {
                    connected.tw = true;
                    refreshStatus();
                  }
                  const m = line.match(
                    /^(?:@([^ ]+) )?(?::([^ ]+) )?PRIVMSG #[^ ]+ :(.*)$/
                  );
                  if (!m) return;
                  const tags = {};
                  if (m[1]) {
                    m[1].split(";").forEach((kv) => {
                      const i = kv.indexOf("=");
                      if (i > -1) tags[kv.slice(0, i)] = kv.slice(i + 1);
                    });
                  }
                  const bits = tags.bits;
                  if (!bits) return;
                  const user =
                    decodeURIComponent((tags["display-name"] || "").replace(/\\s/g, " ")) ||
                    (m[2] || "").split("!")[0] ||
                    "twitch";
                  const tsMs = tags["tmi-sent-ts"]
                    ? parseInt(tags["tmi-sent-ts"], 10)
                    : Date.now();
                  addTwBits(user, bits, m[3] || "", tsMs);
                });
            });
            ws.addEventListener("close", () => {
              connected.tw = false;
              refreshStatus();
              if (closed) return;
              retry = Math.min(retry + 1, 6);
              setTimeout(connect, 1000 * retry);
            });
            ws.addEventListener("error", () => {
              try {
                ws.close();
              } catch (_) {}
            });
          }
          connect();
          window.addEventListener("beforeunload", () => {
            closed = true;
            try {
              ws && ws.close();
            } catch (_) {}
          });
        }

        // ----- YouTube super chat (reuse live resolve) -----
        async function ytFetchJson(url, label) {
          let res;
          try {
            res = await fetch(url);
          } catch (e) {
            throw new Error(`${label} network`);
          }
          let json = null;
          try {
            json = await res.json();
          } catch (_) {}
          if (!res.ok) {
            throw new Error(`${label} ${res.status}`);
          }
          return json;
        }

        function normalizeHandle(input) {
          let s = String(input || "").trim();
          if (s.startsWith("http://") || s.startsWith("https://")) {
            try {
              const u = new URL(s);
              const parts = u.pathname.split("/").filter(Boolean);
              if (parts[0] === "channel" && parts[1]) return parts[1];
              if (parts[0]?.startsWith("@")) return parts[0];
              if (parts[0]) return parts[0];
            } catch (_) {}
          }
          return s;
        }

        const ytLiveCacheKey = `laji_obs_yt_live_cache:${(
          ytChannel ||
          ytVideoParam ||
          "default"
        ).toLowerCase()}`;

        function readYtLiveCache() {
          try {
            return JSON.parse(localStorage.getItem(ytLiveCacheKey) || "null");
          } catch (_) {
            return null;
          }
        }
        function writeYtLiveCache(data) {
          try {
            localStorage.setItem(ytLiveCacheKey, JSON.stringify(data));
          } catch (_) {}
        }
        function clearYtLiveCache() {
          try {
            localStorage.removeItem(ytLiveCacheKey);
          } catch (_) {}
        }

        async function resolveYtChannelId() {
          const raw = normalizeHandle(ytChannel);
          if (/^UC[\w-]{22}$/.test(raw)) return raw;
          const cache = readYtLiveCache();
          if (cache?.channelId && /^UC[\w-]{22}$/.test(cache.channelId)) return cache.channelId;
          const handle = raw.startsWith("@") ? raw.slice(1) : raw;
          const url = `${YT_API}/channels?part=id&forHandle=${encodeURIComponent(
            handle
          )}&key=${encodeURIComponent(ytKey)}`;
          const json = await ytFetchJson(url, "yt channel");
          const id = json?.items?.[0]?.id;
          if (!id) throw new Error("yt channel not found");
          return id;
        }

        async function resolveLiveViaUploads(channelId) {
          const chJson = await ytFetchJson(
            `${YT_API}/channels?part=contentDetails&id=${encodeURIComponent(
              channelId
            )}&key=${encodeURIComponent(ytKey)}`,
            "yt channel details"
          );
          const uploads = chJson?.items?.[0]?.contentDetails?.relatedPlaylists?.uploads;
          if (!uploads) return null;
          const plJson = await ytFetchJson(
            `${YT_API}/playlistItems?part=contentDetails&playlistId=${encodeURIComponent(
              uploads
            )}&maxResults=15&key=${encodeURIComponent(ytKey)}`,
            "yt uploads"
          );
          const ids = (plJson?.items || [])
            .map((it) => it?.contentDetails?.videoId)
            .filter(Boolean);
          if (!ids.length) return null;
          const vJson = await ytFetchJson(
            `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
              ids.join(",")
            )}&key=${encodeURIComponent(ytKey)}`,
            "yt recent videos"
          );
          const live = (vJson?.items || []).find((it) => {
            const d = it?.liveStreamingDetails;
            return d && d.actualStartTime && !d.actualEndTime;
          });
          return live?.id || null;
        }

        async function resolveLiveVideoId() {
          if (ytVideoParam) return ytVideoParam;
          const cache = readYtLiveCache();
          if (cache?.videoId) {
            try {
              const vJson = await ytFetchJson(
                `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
                  cache.videoId
                )}&key=${encodeURIComponent(ytKey)}`,
                "yt videos"
              );
              const d = vJson?.items?.[0]?.liveStreamingDetails;
              if (d && d.actualStartTime && !d.actualEndTime) return cache.videoId;
            } catch (_) {}
            clearYtLiveCache();
          }
          const channelId = await resolveYtChannelId();
          let id = null;
          try {
            id = await resolveLiveViaUploads(channelId);
          } catch (e) {
            console.warn(e);
          }
          if (!id) {
            const json = await ytFetchJson(
              `${YT_API}/search?part=snippet&channelId=${encodeURIComponent(
                channelId
              )}&eventType=live&type=video&maxResults=1&key=${encodeURIComponent(ytKey)}`,
              "yt search"
            );
            id = json?.items?.[0]?.id?.videoId || null;
          }
          if (id) writeYtLiveCache({ channelId, videoId: id, ts: Date.now() });
          return id;
        }

        async function resolveLiveChatId(videoId) {
          const json = await ytFetchJson(
            `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
              videoId
            )}&key=${encodeURIComponent(ytKey)}`,
            "yt videos"
          );
          const d = json?.items?.[0]?.liveStreamingDetails;
          if (!d || d.actualEndTime) return null;
          return d.activeLiveChatId || null;
        }

        async function pollYoutube() {
          if (!wantYt) return;
          if (!ytKey && !ytVideoParam) return;
          let chatId = null;
          let pageToken = "";
          let fail = 0;

          async function ensure() {
            const videoId = await resolveLiveVideoId();
            if (!videoId) throw new Error("yt offline");
            chatId = await resolveLiveChatId(videoId);
            if (!chatId) throw new Error("yt no live chat");
            connected.yt = true;
            refreshStatus();
            fail = 0;
          }

          async function tick() {
            try {
              if (!chatId) await ensure();
              const url = new URL(`${YT_API}/liveChat/messages`);
              url.searchParams.set("liveChatId", chatId);
              url.searchParams.set("part", "snippet,authorDetails");
              url.searchParams.set("maxResults", "20");
              url.searchParams.set("key", ytKey);
              if (pageToken) url.searchParams.set("pageToken", pageToken);
              const res = await fetch(url);
              if (!res.ok) {
                if (res.status === 403 || res.status === 404) {
                  chatId = null;
                  connected.yt = false;
                  refreshStatus();
                  clearYtLiveCache();
                }
                throw new Error("yt chat " + res.status);
              }
              const json = await res.json();
              pageToken = json.nextPageToken || pageToken;
              const wait = Math.max(2500, Number(json.pollingIntervalMillis || 5000));
              (json.items || []).forEach((item) => {
                const id = item.id;
                if (!id) return;
                const type = item.snippet?.type || "";
                if (type !== "superChatEvent" && type !== "superStickerEvent") return;
                const details =
                  item.snippet?.superChatDetails || item.snippet?.superStickerDetails || {};
                const user = item.authorDetails?.displayName || "youtube";
                const published = item.snippet?.publishedAt
                  ? Date.parse(item.snippet.publishedAt)
                  : Date.now();
                addYtSuper(
                  user,
                  details.amountDisplayString || "",
                  details.amountMicros,
                  details.currency,
                  details.userComment || item.snippet?.displayMessage || "",
                  published,
                  `yt:${id}`
                );
              });
              setTimeout(tick, wait);
            } catch (err) {
              console.warn(err);
              connected.yt = false;
              refreshStatus();
              fail += 1;
              chatId = fail >= 3 ? null : chatId;
              setTimeout(tick, Math.min(15000, 3000 * fail));
            }
          }
          tick();
        }

        if (!wantTw && !wantYt && !demo && !manualEntries.length) {
          els.status.textContent = "NO SRC";
          // 仍可開＋手動，方便只做補登測試
        }
        renderTotals();
        renderFeed();
        refreshStatus();
        if (demo) {
          // 僅入口 iframe 展示用：可自動跳，但不寫正式進度
          function startDemo() {
            const a = funds[0]?.name || "基金A";
            const b = funds[1]?.name || funds[0]?.name || "基金B";
            const samples = [
              () =>
                addTwBits("NightOwl", 100, `${a} 加油`, Date.now(), `demo:tw:1:${Date.now()}`),
              () =>
                addYtSuper(
                  "貓奴",
                  "NT$50",
                  50e6,
                  "TWD",
                  `${b} 超留`,
                  Date.now(),
                  `demo:yt:1:${Date.now()}`
                ),
              () =>
                addTwBits("Tea", 500, `Cheer500 ${b}`, Date.now(), `demo:tw:2:${Date.now()}`),
              () =>
                addYtSuper(
                  "小白",
                  "NT$100",
                  100e6,
                  "TWD",
                  `${a} 晚上好`,
                  Date.now(),
                  `demo:yt:2:${Date.now()}`
                ),
            ];
            samples.forEach((fn, i) => setTimeout(fn, 400 + i * 900));
            let i = 0;
            setInterval(() => {
              samples[i % samples.length]();
              i += 1;
            }, 3200);
          }
          els.status.hidden = false;
          els.status.textContent =
            "展示 DEMO（不寫正式）· OBS 請用入口「複製／預覽」正式網址";
          startDemo();
        } else {
          connectTwitch();
          pollYoutube();
        }
      })();
    </script>
