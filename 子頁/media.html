<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS 媒體播放 · 清單</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script src="../yt-live-sync.js"></script>
    <style>
      :root {
        --bg: #000;
        --fg: rgba(255, 255, 255, 0.9);
        --muted: rgba(255, 255, 255, 0.55);
        --font-zh: "IBM Plex Sans TC", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
        --font-num: "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-zh);
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #stage video,
      #stage iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
      #stage video.fit-contain {
        object-fit: contain;
      }
      #stage video.fit-cover {
        object-fit: cover;
      }
      #stage video.fit-fill {
        object-fit: fill;
      }
      #hud {
        position: absolute;
        left: 10px;
        bottom: 10px;
        z-index: 5;
        max-width: calc(100% - 20px);
        padding: 6px 10px;
        border-radius: 0;
        background: rgba(0, 0, 0, 0.55);
        font-size: 12px;
        line-height: 1.35;
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #hud[hidden],
      #empty[hidden] {
        display: none !important;
      }
      #empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }
      #empty code {
        font-family: var(--font-num);
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="empty">
        尚未加入可播放項目。<br />
        請在入口⑪貼上網址或本機路徑（一行一個）。
      </div>
      <div id="hud" hidden></div>
    </div>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const stage = document.getElementById("stage");
        const empty = document.getElementById("empty");
        const hud = document.getElementById("hud");

        const mode = String(params.get("mode") || "loop").toLowerCase(); // seq | loop | random
        const fit = String(params.get("fit") || "contain").toLowerCase();
        const mute = !["0", "false", "no", "off"].includes(
          String(params.get("mute") || "1").toLowerCase()
        );
        const volume = Math.min(
          1,
          Math.max(0, Number(params.get("volume") || (mute ? 0 : 1)))
        );
        const dwellSec = Math.max(3, Number(params.get("dwell") || 15) || 15);
        const showHud = !["0", "false", "no", "off", "hide"].includes(
          String(params.get("hud") || "1").toLowerCase()
        );

        function cssVar(name, value) {
          if (value != null && value !== "") {
            document.documentElement.style.setProperty(name, value);
          }
        }
        const bg = (params.get("bg") || "").trim();
        if (bg && bg !== "0" && bg !== "false" && bg !== "none") cssVar("--bg", bg);

        function decodeListParam(raw) {
          const s = String(raw || "").trim();
          if (!s) return [];
          // base64url JSON array
          if (s.startsWith("b64:")) {
            try {
              const b64 = s
                .slice(4)
                .replace(/-/g, "+")
                .replace(/_/g, "/");
              const pad = b64.length % 4 ? "=".repeat(4 - (b64.length % 4)) : "";
              const json = decodeURIComponent(escape(atob(b64 + pad)));
              const arr = JSON.parse(json);
              return Array.isArray(arr) ? arr.map(String) : [];
            } catch (_) {
              return [];
            }
          }
          return s.split(/\r?\n|\|/).map((x) => x.trim()).filter(Boolean);
        }

        function toPlayableUrl(raw) {
          let s = String(raw || "").trim();
          if (!s) return "";
          // Windows path
          if (/^[a-zA-Z]:[\\/]/.test(s)) {
            s = "file:///" + s.replace(/\\/g, "/");
          } else if (s.startsWith("\\\\")) {
            s = "file:" + s.replace(/\\/g, "/");
          }
          // relative → from tool root (parent of 子頁)
          if (
            !/^(https?:|file:|data:)/i.test(s) &&
            !s.startsWith("//")
          ) {
            try {
              s = new URL("../" + s.replace(/^\.\//, ""), location.href).href;
            } catch (_) {}
          }
          return s;
        }

        function youtubeId(url) {
          try {
            const u = new URL(url);
            const host = u.hostname.replace(/^www\./, "");
            if (host === "youtu.be") {
              const id = u.pathname.split("/").filter(Boolean)[0] || "";
              return /^[\w-]{11}$/.test(id) ? id : "";
            }
            if (host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")) {
              const v = u.searchParams.get("v");
              if (v && /^[\w-]{11}$/.test(v)) return v;
              const parts = u.pathname.split("/").filter(Boolean);
              if (
                (parts[0] === "embed" || parts[0] === "live" || parts[0] === "shorts") &&
                parts[1] &&
                /^[\w-]{11}$/.test(parts[1])
              ) {
                return parts[1];
              }
            }
          } catch (_) {}
          return "";
        }

        function classify(url) {
          const yt = youtubeId(url);
          if (yt) {
            return {
              kind: "youtube",
              src:
                "https://www.youtube.com/embed/" +
                yt +
                "?autoplay=1&rel=0&modestbranding=1&playsinline=1" +
                (mute ? "&mute=1" : ""),
            };
          }
          if (/\.(mp4|webm|ogg|ogv|mov|m4v)(\?|#|$)/i.test(url)) {
            return { kind: "video", src: url };
          }
          // treat as website / page
          return { kind: "page", src: url };
        }

        function shuffle(arr) {
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const t = a[i];
            a[i] = a[j];
            a[j] = t;
          }
          return a;
        }

        let items = decodeListParam(params.get("list") || params.get("items") || "")
          .map(toPlayableUrl)
          .filter(Boolean)
          .map((src, i) => ({ i, ...classify(src), raw: src }));

        // 入口寫入的共用清單（可更新已開著的 OBS）
        async function pullSharedPlaylist() {
          if (!window.MyObsYtLiveSync) return false;
          // reuse script loader paths pattern via direct script for media playlist
          const paths = ["../資料/media-playlist.js", "資料/media-playlist.js"];
          for (const p of paths) {
            const ok = await new Promise((resolve) => {
              const s = document.createElement("script");
              s.src = p + "?t=" + Date.now();
              s.onload = () => resolve(true);
              s.onerror = () => resolve(false);
              document.head.appendChild(s);
            });
            if (!ok) continue;
            const data = window.__MY_OBS_MEDIA_PLAYLIST__;
            if (!data || !Array.isArray(data.items) || !data.items.length) continue;
            items = data.items
              .map(String)
              .map(toPlayableUrl)
              .filter(Boolean)
              .map((src, i) => ({ i, ...classify(src), raw: src }));
            if (data.mode) {
              /* mode from file only if URL didn't set? keep URL mode as source of truth */
            }
            return true;
          }
          return false;
        }

        let order = [];
        let pos = -1;
        let dwellTimer = 0;
        let currentEl = null;
        let stopped = false;

        function rebuildOrder(startFresh) {
          if (!items.length) {
            order = [];
            return;
          }
          if (mode === "random") order = shuffle(items.map((_, idx) => idx));
          else order = items.map((_, idx) => idx);
          if (startFresh) pos = -1;
        }

        function setHud(text) {
          if (!showHud) {
            hud.hidden = true;
            return;
          }
          hud.hidden = !text;
          hud.textContent = text || "";
        }

        function clearStageMedia() {
          clearTimeout(dwellTimer);
          if (currentEl) {
            try {
              if (currentEl.tagName === "VIDEO") {
                currentEl.pause();
                currentEl.removeAttribute("src");
                currentEl.load();
              }
            } catch (_) {}
            currentEl.remove();
            currentEl = null;
          }
        }

        function playIndex(itemIndex) {
          const item = items[itemIndex];
          if (!item) return;
          clearStageMedia();
          empty.hidden = true;
          const label =
            (mode === "random" ? "隨機" : mode === "seq" ? "順序" : "循環") +
            ` · ${itemIndex + 1}/${items.length} · ${item.kind}`;
          setHud(label + " · " + item.raw);

          if (item.kind === "video") {
            const v = document.createElement("video");
            v.className =
              fit === "cover" ? "fit-cover" : fit === "fill" ? "fit-fill" : "fit-contain";
            v.src = item.src;
            v.autoplay = true;
            v.playsInline = true;
            v.muted = mute;
            v.volume = volume;
            v.controls = false;
            v.addEventListener("ended", () => next(false));
            v.addEventListener("error", () => {
              setHud("播放失敗，跳下一則 · " + item.raw);
              setTimeout(() => next(false), 800);
            });
            stage.appendChild(v);
            currentEl = v;
            const p = v.play();
            if (p && p.catch) p.catch(() => {});
            return;
          }

          // youtube / page → iframe + dwell
          const f = document.createElement("iframe");
          f.src = item.src;
          f.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
          f.allowFullscreen = true;
          f.referrerPolicy = "strict-origin-when-cross-origin";
          stage.appendChild(f);
          currentEl = f;
          dwellTimer = setTimeout(() => next(false), dwellSec * 1000);
        }

        function next(fromUser) {
          if (stopped && !fromUser) return;
          if (!order.length) {
            empty.hidden = false;
            setHud("");
            return;
          }
          pos += 1;
          if (pos >= order.length) {
            if (mode === "seq") {
              stopped = true;
              pos = order.length - 1;
              setHud("清單播完（順序模式）");
              return;
            }
            rebuildOrder(true);
            pos = 0;
          }
          playIndex(order[pos]);
        }

        async function boot() {
          // 若網址沒帶 list，試讀入口寫入的共用檔
          if (!items.length) await pullSharedPlaylist();
          if (!items.length) {
            empty.hidden = false;
            setHud("");
            return;
          }
          rebuildOrder(true);
          next(true);
          // 定期重讀共用清單（入口改了可跟上）
          setInterval(async () => {
            const before = items.map((x) => x.raw).join("\n");
            const ok = await pullSharedPlaylist();
            if (!ok) return;
            const after = items.map((x) => x.raw).join("\n");
            if (after !== before && items.length) {
              stopped = false;
              rebuildOrder(true);
              next(true);
            }
          }, 15000);
        }

        boot();
      })();
    </script>
  </body>
</html>
