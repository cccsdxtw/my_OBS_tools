<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS Viewer Count · TW + YT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: rgba(0, 0, 0, 0.45);
        --fg: rgba(255, 255, 255, 0.85);
        --muted: rgba(255, 255, 255, 0.7);
        --size: 22px;
        --bar-h: calc(var(--size) + 16px);
        --pad-x: 12px;
        --gap: 12px;
        --radius: 0;
        --font-zh: "IBM Plex Sans TC", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
        --font-num: "JetBrains Mono", "Cascadia Mono", "Consolas", "Courier New",
          monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        color: var(--fg);
      }

      #bar {
        display: inline-flex;
        align-items: center;
        gap: var(--gap);
        height: var(--bar-h);
        padding: 0 var(--pad-x);
        background: var(--bg);
        border-radius: var(--radius);
        white-space: nowrap;
        line-height: 1;
        overflow: hidden;
      }

      .plat {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .plat[hidden] {
        display: none !important;
      }

      .icon-slot {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: calc(var(--size) * 0.95);
        height: calc(var(--size) * 0.95);
        flex: 0 0 auto;
      }

      .icon,
      .custom-icon {
        width: 100%;
        height: 100%;
        opacity: 0.95;
        display: block;
        object-fit: contain;
      }

      .value {
        display: flex;
        align-items: center;
        height: var(--size);
        margin: 0;
        padding: 0;
        line-height: 1;
        font-family: var(--font-num);
        font-size: var(--size);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        transform: translateY(0.02em);
      }

      .error {
        color: #ff8f8f;
      }
    </style>
  </head>
  <body>
    <div id="bar" aria-live="polite">
      <section class="plat" id="mod-total" hidden>
        <span class="icon-slot" id="total-icon">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
            />
          </svg>
        </span>
        <span class="value" id="total">—</span>
      </section>

      <section class="plat" id="mod-tw" hidden>
        <span class="icon-slot" id="tw-icon" title="Twitch">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M4.3 2 2 4.3v15.4h4.6V22l2.6-2.3h3.4L20.6 12V2H4.3zm14.8 9.1-3 3h-3l-2.6 2.3v-2.3H6.9V3.7h12.2v7.4zM14.3 6.3h1.7v4.6h-1.7V6.3zm-4.6 0H11v4.6H9.7V6.3z"
            />
          </svg>
        </span>
        <span class="value" id="tw">—</span>
      </section>

      <section class="plat" id="mod-yt" hidden>
        <span class="icon-slot" id="yt-icon" title="YouTube">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.4 3.7 12 3.7 12 3.7s-7.4 0-9.4.4A3 3 0 0 0 .5 6.2 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c2 .4 9.4.4 9.4.4s7.4 0 9.4-.4a3 3 0 0 0 2.1-2.1A31.6 31.6 0 0 0 24 12a31.6 31.6 0 0 0-.5-5.8zM9.8 15.6V8.4L15.7 12l-5.9 3.6z"
            />
          </svg>
        </span>
        <span class="value" id="yt">—</span>
      </section>
    </div>

    <script>
      (() => {
        const TWITCH_GQL = "https://gql.twitch.tv/gql";
        const TWITCH_WEB_CLIENT_ID = "kimne78kx3ncx6brgo4mv6wki5h1ko";
        const DECAPI_VIEWERS = (login) =>
          `https://decapi.me/twitch/viewercount/${encodeURIComponent(login)}`;
        const YT_API = "https://www.googleapis.com/youtube/v3";
        const POLL_MS = 15000;
        const YT_RESOLVE_MS = 5 * 60 * 1000;

        const params = new URLSearchParams(location.search);

        function cssVar(name, value) {
          if (value) document.documentElement.style.setProperty(name, value);
        }

        cssVar("--size", params.get("fontSize") ? `${params.get("fontSize")}px` : "");
        cssVar("--fg", params.get("color"));
        const bgParam = (params.get("bg") || "").trim();
        if (!bgParam || bgParam === "0" || bgParam === "false" || bgParam === "none" || bgParam === "off") {
          cssVar("--bg", "transparent");
        } else {
          cssVar("--bg", bgParam);
        }
        cssVar("--gap", params.get("gap") ? `${params.get("gap")}px` : "");
        cssVar("--radius", params.get("radius") ? `${params.get("radius")}px` : "");

        const twitchLogin = (
          params.get("login") ||
          params.get("twitch") ||
          params.get("channel") ||
          ""
        ).trim();
        const ytChannel = (
          params.get("yt") ||
          params.get("youtube") ||
          params.get("ytChannel") ||
          ""
        ).trim();
        const ytVideoParam = (params.get("ytVideo") || "").trim();
        const ytKey = (params.get("ytKey") || params.get("youtubeKey") || "").trim();
        const twitchSource = (params.get("viewersSource") || "auto").toLowerCase();
        const mode = (params.get("vcMode") || "split").toLowerCase(); // split | total
        const twIconUrl = (params.get("twIcon") || "").trim();
        const ytIconUrl = (params.get("ytIcon") || "").trim();
        const totalIconUrl = (params.get("totalIcon") || params.get("icon") || "").trim();

        const els = {
          modTotal: document.getElementById("mod-total"),
          modTw: document.getElementById("mod-tw"),
          modYt: document.getElementById("mod-yt"),
          total: document.getElementById("total"),
          tw: document.getElementById("tw"),
          yt: document.getElementById("yt"),
          twIcon: document.getElementById("tw-icon"),
          ytIcon: document.getElementById("yt-icon"),
          totalIcon: document.getElementById("total-icon"),
        };

        function applyCustomIcon(slot, url) {
          if (!slot || !url) return;
          slot.innerHTML = "";
          const img = document.createElement("img");
          img.className = "custom-icon";
          img.alt = "";
          img.referrerPolicy = "no-referrer";
          img.src = url;
          slot.appendChild(img);
        }

        applyCustomIcon(els.twIcon, twIconUrl);
        applyCustomIcon(els.ytIcon, ytIconUrl);
        applyCustomIcon(els.totalIcon, totalIconUrl);

        const wantTw = !!twitchLogin;
        const wantYt = !!(ytVideoParam || (ytChannel && ytKey));

        if (mode === "total") {
          els.modTotal.hidden = !(wantTw || wantYt);
        } else {
          els.modTw.hidden = !wantTw;
          els.modYt.hidden = !wantYt;
          // vcOrder=tw,yt | yt,tw
          const bar = document.getElementById("bar");
          const order = (params.get("vcOrder") || "tw,yt")
            .split(",")
            .map((s) => s.trim().toLowerCase())
            .filter((s) => s === "tw" || s === "yt");
          const uniq = [];
          order.forEach((k) => {
            if (!uniq.includes(k)) uniq.push(k);
          });
          if (!uniq.includes("tw")) uniq.push("tw");
          if (!uniq.includes("yt")) uniq.push("yt");
          uniq.forEach((k) => {
            const el = k === "tw" ? els.modTw : els.modYt;
            if (el) bar.appendChild(el);
          });
        }

        if (!wantTw && !wantYt) {
          els.modTotal.hidden = false;
          els.total.classList.add("error");
          els.total.textContent = "NO SRC";
          return;
        }

        let twCount = null; // null=未知, number=值
        let ytCount = null;
        let ytVideoId = ytVideoParam || null;
        let ytChannelId = null;
        let lastYtResolve = 0;

        function render() {
          const twOk = typeof twCount === "number";
          const ytOk = typeof ytCount === "number";
          if (mode === "total") {
            if (!twOk && !ytOk) {
              els.total.textContent = "—";
              return;
            }
            const sum = (twOk ? twCount : 0) + (ytOk ? ytCount : 0);
            els.total.classList.remove("error");
            els.total.textContent = String(sum);
            return;
          }
          if (wantTw) {
            const bad =
              twCount === "ERR" || twCount === "FILE" || twCount === "403";
            els.tw.classList.toggle("error", bad);
            els.tw.textContent = bad ? String(twCount) : twOk ? String(twCount) : "—";
            els.tw.title = bad ? twErrTip || "Twitch 人數抓取失敗" : "";
          }
          if (wantYt) {
            const bad =
              ytCount === "ERR" || ytCount === "FILE" || ytCount === "403";
            els.yt.classList.toggle("error", bad);
            els.yt.textContent = bad ? String(ytCount) : ytOk ? String(ytCount) : "—";
            els.yt.title = bad
              ? ytErrTip || "YouTube 人數抓取失敗（金鑰限制／配額／找不到直播）"
              : "";
          }
        }

        async function fetchTwitchGql() {
          const res = await fetch(TWITCH_GQL, {
            method: "POST",
            headers: {
              "Client-ID": TWITCH_WEB_CLIENT_ID,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              query: `query($login:String!){user(login:$login){stream{viewersCount}}}`,
              variables: { login: twitchLogin },
            }),
          });
          if (!res.ok) throw new Error(`gql ${res.status}`);
          const json = await res.json();
          const stream = json?.data?.user?.stream;
          return stream ? stream.viewersCount ?? 0 : 0;
        }

        async function fetchTwitchDecapi() {
          const text = (
            await fetch(DECAPI_VIEWERS(twitchLogin)).then((r) => r.text())
          ).trim();
          if (/offline/i.test(text)) return 0;
          const n = parseInt(text, 10);
          if (Number.isNaN(n)) throw new Error("decapi");
          return n;
        }

        const isFileOrigin = location.protocol === "file:";
        let twErrTip = "";
        let ytErrTip = "";
        function failLabel(err, which) {
          const msg = String((err && err.message) || err || "");
          console.error(which || "viewers", err);
          const tip = msg
            ? msg
            : isFileOrigin
              ? "本機 file:// 請求失敗"
              : "人數抓取失敗";
          if (which === "yt") ytErrTip = tip;
          else if (which === "tw") twErrTip = tip;
          // Google API Key 若限制「網站參照網址」，OBS／file 常會 403
          if (/403/.test(msg)) {
            if (which === "yt") {
              ytErrTip =
                "YouTube API 403：請到 Google Cloud 把此金鑰的「應用程式限制」先設成「無」(OBS 本機才能用)";
            }
            return "403";
          }
          return "ERR";
        }

        async function refreshTwitch() {
          if (!wantTw) return;
          try {
            if (twitchSource === "decapi") twCount = await fetchTwitchDecapi();
            else {
              try {
                twCount = await fetchTwitchGql();
              } catch (e) {
                console.warn("GQL failed, DecAPI", e);
                twCount = await fetchTwitchDecapi();
              }
            }
          } catch (err) {
            twCount = failLabel(err, "tw");
          }
        }

        function normalizeHandle(input) {
          let s = input.trim();
          if (s.startsWith("https://") || s.startsWith("http://")) {
            try {
              const u = new URL(s);
              const parts = u.pathname.split("/").filter(Boolean);
              if (parts[0] === "channel" && parts[1]) return parts[1];
              if (parts[0] === "c" && parts[1]) return parts[1];
              if (parts[0] === "user" && parts[1]) return parts[1];
              if (parts[0]?.startsWith("@")) return parts[0];
              if (parts[0]) return parts[0];
            } catch (_) {}
          }
          return s;
        }

        async function ytFetchJson(url, label) {
          let res;
          try {
            res = await fetch(url);
          } catch (e) {
            throw new Error(`${label} network (${e && e.message ? e.message : "fetch"})`);
          }
          let json = null;
          try {
            json = await res.json();
          } catch (_) {}
          if (!res.ok) {
            const reason =
              json?.error?.errors?.[0]?.reason ||
              json?.error?.message ||
              res.statusText ||
              "";
            throw new Error(
              `${label} ${res.status}${reason ? " " + String(reason).slice(0, 80) : ""}`
            );
          }
          return json;
        }

        async function resolveYoutubeChannelId() {
          if (ytChannelId) return ytChannelId;
          const raw = normalizeHandle(ytChannel);
          if (/^UC[\w-]{22}$/.test(raw)) {
            ytChannelId = raw;
            return ytChannelId;
          }
          const handle = raw.startsWith("@") ? raw.slice(1) : raw;
          // 1) forHandle（新頻道＠）
          try {
            const url = `${YT_API}/channels?part=id&forHandle=${encodeURIComponent(
              handle
            )}&key=${encodeURIComponent(ytKey)}`;
            const json = await ytFetchJson(url, "yt channels");
            const id = json?.items?.[0]?.id;
            if (id) {
              ytChannelId = id;
              return ytChannelId;
            }
          } catch (e) {
            console.warn(e);
          }
          // 2) 舊版 forUsername（英文 id）
          try {
            const url = `${YT_API}/channels?part=id&forUsername=${encodeURIComponent(
              handle
            )}&key=${encodeURIComponent(ytKey)}`;
            const json = await ytFetchJson(url, "yt username");
            const id = json?.items?.[0]?.id;
            if (id) {
              ytChannelId = id;
              return ytChannelId;
            }
          } catch (e) {
            console.warn(e);
          }
          throw new Error("yt channel not found（可改填 UC… 頻道 ID）");
        }

        async function resolveLiveViaSearch(channelId) {
          const url = `${YT_API}/search?part=snippet&channelId=${encodeURIComponent(
            channelId
          )}&eventType=live&type=video&maxResults=1&key=${encodeURIComponent(ytKey)}`;
          const json = await ytFetchJson(url, "yt search");
          return json?.items?.[0]?.id?.videoId || null;
        }

        async function resolveLiveViaUploads(channelId) {
          // 避開 search.list（配額高、有時被擋）；改抓上傳清單最近幾支再查 live
          const chUrl = `${YT_API}/channels?part=contentDetails&id=${encodeURIComponent(
            channelId
          )}&key=${encodeURIComponent(ytKey)}`;
          const chJson = await ytFetchJson(chUrl, "yt channel details");
          const uploads =
            chJson?.items?.[0]?.contentDetails?.relatedPlaylists?.uploads;
          if (!uploads) return null;
          const plUrl = `${YT_API}/playlistItems?part=contentDetails&playlistId=${encodeURIComponent(
            uploads
          )}&maxResults=8&key=${encodeURIComponent(ytKey)}`;
          const plJson = await ytFetchJson(plUrl, "yt uploads");
          const ids = (plJson?.items || [])
            .map((it) => it?.contentDetails?.videoId)
            .filter(Boolean);
          if (!ids.length) return null;
          const vUrl = `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
            ids.join(",")
          )}&key=${encodeURIComponent(ytKey)}`;
          const vJson = await ytFetchJson(vUrl, "yt recent videos");
          const live = (vJson?.items || []).find((it) => {
            const d = it?.liveStreamingDetails;
            return d && d.actualStartTime && !d.actualEndTime;
          });
          return live?.id || null;
        }

        async function resolveYoutubeLiveVideoId(force = false) {
          if (ytVideoParam) {
            ytVideoId = ytVideoParam;
            return ytVideoId;
          }
          const now = Date.now();
          if (ytVideoId && !force && now - lastYtResolve < YT_RESOLVE_MS) {
            return ytVideoId;
          }
          const channelId = await resolveYoutubeChannelId();
          let id = null;
          let lastErr = null;
          try {
            id = await resolveLiveViaSearch(channelId);
          } catch (e) {
            lastErr = e;
            console.warn("yt search failed, try uploads", e);
          }
          if (!id) {
            try {
              id = await resolveLiveViaUploads(channelId);
            } catch (e) {
              lastErr = e;
              console.warn(e);
            }
          }
          if (!id && lastErr) throw lastErr;
          ytVideoId = id;
          lastYtResolve = now;
          return ytVideoId;
        }

        async function fetchYoutubeViewers() {
          const videoId = await resolveYoutubeLiveVideoId(false);
          if (!videoId) return 0;
          const url = `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
            videoId
          )}&key=${encodeURIComponent(ytKey)}`;
          const json = await ytFetchJson(url, "yt videos");
          const details = json?.items?.[0]?.liveStreamingDetails;
          if (!details) {
            // 可能已下播，強制重找 live
            ytVideoId = null;
            lastYtResolve = 0;
            return 0;
          }
          const n = parseInt(details.concurrentViewers || "0", 10);
          return Number.isNaN(n) ? 0 : n;
        }

        async function refreshYoutube() {
          if (!wantYt) return;
          try {
            ytCount = await fetchYoutubeViewers();
            ytErrTip = "";
          } catch (err) {
            ytCount = failLabel(err, "yt");
          }
        }

        async function refresh() {
          await Promise.all([refreshTwitch(), refreshYoutube()]);
          render();
        }

        render();
        refresh();
        setInterval(refresh, POLL_MS);
      })();
    </script>
  </body>
</html>
