<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>拉基的OBS工具箱 · 聊天室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style id="base-style">
      :root {
        --bg: rgba(0, 0, 0, 0.45);
        --fg: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.55);
        --tw: #bf94ff;
        --yt: #ff6b6b;
        --size: 18px;
        --pad: 10px;
        --panel-inset: var(--pad);
        --panel-fit: 100% 100%;
        --msg-bg: transparent;
        --msg-inset: 0px;
        --msg-fit: 100% 100%;
        --radius: 0;
        --gap: 6px;
        --font-zh: "IBM Plex Sans TC", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        color: var(--fg);
        font-family: var(--font-zh);
      }

      #wrap {
        width: 100%;
        height: 100%;
        padding: var(--panel-inset);
        background-color: var(--bg);
        background-image: var(--panel-img, none);
        background-size: var(--panel-fit);
        background-repeat: no-repeat;
        background-position: center;
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      #wrap.stack-bottom {
        justify-content: flex-end;
      }

      #wrap.stack-top {
        justify-content: flex-start;
      }

      #feed {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        overflow: hidden;
        min-height: 0;
        width: 100%;
      }

      #wrap.stack-bottom #feed {
        justify-content: flex-end;
      }

      #wrap.stack-top #feed {
        justify-content: flex-start;
      }

      .msg {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        line-height: 1.35;
        font-size: var(--size);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        animation: in 0.2s ease-out;
        word-break: break-word;
        transition: opacity 0.35s ease, transform 0.35s ease;
        background-color: var(--msg-bg);
        background-image: var(--msg-img, none);
        background-size: var(--msg-fit);
        background-repeat: no-repeat;
        background-position: center;
        padding: var(--msg-inset);
      }

      .msg.fade-out {
        opacity: 0;
        transform: translateY(-4px);
      }

      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #wrap.stack-top .msg {
        animation-name: in-top;
      }

      @keyframes in-top {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .plat {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 0.25em;
        margin-top: 0.15em;
        opacity: 0.95;
        max-width: 7.5em;
      }

      .plat .plat-icon {
        width: 0.95em;
        height: 0.95em;
        display: block;
        object-fit: contain;
        flex: 0 0 auto;
      }

      .plat .plat-icon.svg {
        fill: currentColor;
        color: inherit;
      }

      .plat.tw {
        color: var(--tw);
      }

      .plat.yt {
        color: var(--yt);
      }

      .plat .plat-chan {
        font-size: 0.72em;
        font-weight: 700;
        letter-spacing: 0.02em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      body.hide-source .plat {
        display: none;
      }

      .user {
        flex: 0 0 auto;
        font-weight: 700;
        color: var(--muted);
        margin-top: 0.05em;
      }

      .user::after {
        content: ":";
        margin-left: 1px;
      }

      .text {
        min-width: 0;
        font-weight: 500;
      }

      #status {
        position: absolute;
        left: 8px;
        top: 6px;
        font-size: 12px;
        color: var(--muted);
        opacity: 0.7;
        pointer-events: none;
        z-index: 2;
      }

      body.hide-status #status {
        display: none;
      }
    </style>
    <style id="custom-style"></style>
  </head>
  <body>
    <div id="status">connecting…</div>
    <div id="wrap" class="stack-bottom">
      <div id="feed" aria-live="polite"></div>
    </div>

    <script>
      (() => {
        const YT_API = "https://www.googleapis.com/youtube/v3";
        const params = new URLSearchParams(location.search);
        const wrap = document.getElementById("wrap");

        function cssVar(name, value) {
          if (value) document.documentElement.style.setProperty(name, value);
        }

        cssVar("--size", params.get("fontSize") ? `${params.get("fontSize")}px` : "");
        cssVar("--fg", params.get("color"));
        cssVar("--pad", params.get("pad") ? `${params.get("pad")}px` : "");
        cssVar("--gap", params.get("gap") ? `${params.get("gap")}px` : "");
        cssVar("--radius", params.get("radius") ? `${params.get("radius")}px` : "");
        // 來源圖示色：空白＝內建紫／紅
        cssVar("--tw", params.get("twColor") || params.get("srcTwColor") || "");
        cssVar("--yt", params.get("ytColor") || params.get("srcYtColor") || "");
        const bgParam = (params.get("bg") || "").trim();
        if (!bgParam || bgParam === "0" || bgParam === "false" || bgParam === "none" || bgParam === "off") {
          cssVar("--bg", "transparent");
        } else {
          cssVar("--bg", bgParam);
        }

        function cssUrl(raw) {
          const s = String(raw || "").trim();
          if (!s) return "";
          // 避開 CSS url() 斷字元
          const safe = s.replace(/["'\\)]/g, "");
          return `url("${safe}")`;
        }

        function insetToCss(raw, fallbackPx) {
          const parts = String(raw || "")
            .trim()
            .split(/[\s,，]+/)
            .filter(Boolean)
            .map((n) => Math.max(0, Math.min(200, parseInt(n, 10) || 0)));
          if (!parts.length) {
            return fallbackPx == null ? "" : `${fallbackPx}px`;
          }
          return parts
            .slice(0, 4)
            .map((n) => `${n}px`)
            .join(" ");
        }

        function bgFitToCss(raw) {
          const s = String(raw || "")
            .trim()
            .toLowerCase();
          if (s === "contain" || s === "full" || s === "fit") return "contain";
          if (s === "cover" || s === "crop") return "cover";
          // stretch / fill / 空白 = 拉滿（舊行為）
          return "100% 100%";
        }

        const panelImg = (params.get("panelImg") || "").trim();
        if (panelImg) {
          cssVar("--panel-img", cssUrl(panelImg));
        }
        const panelInsetCss = insetToCss(
          params.get("panelInset"),
          panelImg ? 16 : null
        );
        if (panelInsetCss) cssVar("--panel-inset", panelInsetCss);
        if (panelImg || params.get("panelFit")) {
          cssVar("--panel-fit", bgFitToCss(params.get("panelFit")));
        }

        const msgImg = (params.get("msgImg") || "").trim();
        const msgBg = (params.get("msgBg") || "").trim();
        if (msgImg) cssVar("--msg-img", cssUrl(msgImg));
        if (msgBg && msgBg !== "0" && msgBg !== "none" && msgBg !== "off") {
          cssVar("--msg-bg", msgBg);
        } else if (msgImg) {
          cssVar("--msg-bg", "transparent");
        }
        const msgInsetCss = insetToCss(
          params.get("msgInset"),
          msgImg || msgBg ? 8 : null
        );
        if (msgInsetCss) cssVar("--msg-inset", msgInsetCss);
        if (msgImg || params.get("msgFit")) {
          cssVar("--msg-fit", bgFitToCss(params.get("msgFit")));
        }

        const maxMsgs = Math.max(5, Math.min(100, parseInt(params.get("max") || "30", 10) || 30));
        const ttlSec = Math.max(0, parseInt(params.get("ttl") || "0", 10) || 0);
        const stack = (params.get("stack") || "bottom").toLowerCase() === "top" ? "top" : "bottom";
        const showSource = params.get("showSource") !== "0";
        const demo = params.get("demo") === "1";
        if (params.get("hideStatus") === "1") document.body.classList.add("hide-status");
        if (!showSource) document.body.classList.add("hide-source");
        wrap.className = `stack-${stack}`;

        const customCss = params.get("css") || "";
        if (customCss) {
          try {
            document.getElementById("custom-style").textContent = customCss;
          } catch (_) {}
        }

        function splitParamList(raw) {
          return String(raw || "")
            .split(/[\s,，、;；]+/)
            .map((s) => s.trim())
            .filter(Boolean);
        }

        function uniqueKeepOrder(list, { lower } = {}) {
          const seen = new Set();
          const out = [];
          list.forEach((item) => {
            const key = lower ? String(item).toLowerCase() : String(item);
            if (seen.has(key)) return;
            seen.add(key);
            out.push(lower ? String(item).toLowerCase() : item);
          });
          return out;
        }

        const twitchLogins = uniqueKeepOrder(
          splitParamList(
            params.get("login") || params.get("twitch") || params.get("channel") || ""
          ),
          { lower: true }
        );
        const ytChannels = uniqueKeepOrder(
          splitParamList(
            params.get("yt") || params.get("youtube") || params.get("ytChannel") || ""
          )
        );
        function extractYoutubeVideoId(raw) {
          const s = String(raw || "").trim();
          if (!s) return "";
          if (/^[\w-]{11}$/.test(s)) return s;
          try {
            const u = new URL(s);
            const host = u.hostname.replace(/^www\./, "");
            if (host === "youtu.be") {
              const id = u.pathname.split("/").filter(Boolean)[0] || "";
              return /^[\w-]{11}$/.test(id) ? id : "";
            }
            if (
              host === "youtube.com" ||
              host === "m.youtube.com" ||
              host === "music.youtube.com"
            ) {
              const v = u.searchParams.get("v");
              if (v && /^[\w-]{11}$/.test(v)) return v;
              const parts = u.pathname.split("/").filter(Boolean);
              if (
                (parts[0] === "live" || parts[0] === "embed" || parts[0] === "shorts") &&
                parts[1] &&
                /^[\w-]{11}$/.test(parts[1])
              ) {
                return parts[1];
              }
            }
          } catch (_) {}
          const m = s.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/);
          return m ? m[1] : s;
        }

        const ytVideoIds = uniqueKeepOrder(
          splitParamList(params.get("ytVideo") || "").map(extractYoutubeVideoId)
        );
        const ytKey = (params.get("ytKey") || params.get("youtubeKey") || "").trim();
        // auto|twitch|youtube|both（分開兩頁時各傳 twitch / youtube）
        const sources = (params.get("chatSource") || "auto").toLowerCase();

        const feed = document.getElementById("feed");
        const statusEl = document.getElementById("status");
        const twConnected = new Set();
        const ytConnected = new Set();

        const wantTw =
          twitchLogins.length > 0 &&
          (sources === "auto" || sources === "twitch" || sources === "both");
        const wantYt =
          (ytVideoIds.length > 0 || (ytChannels.length > 0 && !!ytKey)) &&
          (sources === "auto" || sources === "youtube" || sources === "both");
        const multiTw = twitchLogins.length > 1;
        const multiYt = ytChannels.length + ytVideoIds.length > 1;
        // demo 時依 chatSource 決定要播哪些示範平台
        const demoTw = demo && (sources === "auto" || sources === "twitch" || sources === "both");
        const demoYt = demo && (sources === "auto" || sources === "youtube" || sources === "both");

        function refreshStatus() {
          if (demo && !wantTw && !wantYt) {
            statusEl.textContent = "DEMO";
            return;
          }
          const parts = [];
          if (wantTw) {
            const n = twitchLogins.length;
            const ok = twConnected.size;
            parts.push(ok ? `TW ${ok}/${n}●` : `TW 0/${n}○`);
          }
          if (wantYt) {
            const n = Math.max(1, ytChannels.length + ytVideoIds.length);
            const ok = ytConnected.size;
            parts.push(ok ? `YT ${ok}/${n}●` : `YT 0/${n}○`);
          }
          if (demo) parts.push("DEMO");
          statusEl.textContent = parts.length ? parts.join(" ") : "NO SRC";
        }

        function trimFeed() {
          while (feed.children.length > maxMsgs) {
            if (stack === "top") feed.removeChild(feed.lastChild);
            else feed.removeChild(feed.firstChild);
          }
        }

        // 與人數覆蓋頁相同的預設 Twitch／YouTube 圖示
        const TW_SVG_PATH =
          "M4.3 2 2 4.3v15.4h4.6V22l2.6-2.3h3.4L20.6 12V2H4.3zm14.8 9.1-3 3h-3l-2.6 2.3v-2.3H6.9V3.7h12.2v7.4zM14.3 6.3h1.7v4.6h-1.7V6.3zm-4.6 0H11v4.6H9.7V6.3z";
        const YT_SVG_PATH =
          "M23.5 6.2a3 3 0 0 0-2.1-2.1C19.4 3.7 12 3.7 12 3.7s-7.4 0-9.4.4A3 3 0 0 0 .5 6.2 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c2 .4 9.4.4 9.4.4s7.4 0 9.4-.4a3 3 0 0 0 2.1-2.1A31.6 31.6 0 0 0 24 12a31.6 31.6 0 0 0-.5-5.8zM9.8 15.6V8.4L15.7 12l-5.9 3.6z";

        function isHiddenIcon(url) {
          const s = String(url || "")
            .trim()
            .toLowerCase();
          return (
            s === "0" ||
            s === "none" ||
            s === "off" ||
            s === "false" ||
            s === "hide"
          );
        }

        function isUrlIcon(raw) {
          const s = String(raw || "").trim();
          return (
            /^https?:\/\//i.test(s) ||
            /\.(png|svg|webp|gif|jpe?g)(\?|#|$)/i.test(s)
          );
        }

        const twIconUrl = (
          params.get("twIcon") ||
          params.get("srcTwIcon") ||
          ""
        ).trim();
        const ytIconUrl = (
          params.get("ytIcon") ||
          params.get("srcYtIcon") ||
          ""
        ).trim();

        function makePlatformIcon(platform) {
          const wrap = document.createElement("span");
          wrap.className = "plat-icon-wrap";
          const custom = platform === "tw" ? twIconUrl : ytIconUrl;
          if (isHiddenIcon(custom)) {
            wrap.hidden = true;
            return wrap;
          }
          if (custom && isUrlIcon(custom)) {
            const img = document.createElement("img");
            img.className = "plat-icon";
            img.alt = platform === "tw" ? "Twitch" : "YouTube";
            img.referrerPolicy = "no-referrer";
            img.src = custom;
            wrap.appendChild(img);
            return wrap;
          }
          const svg = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
          );
          svg.setAttribute("class", "plat-icon svg");
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("aria-hidden", "true");
          const path = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
          );
          path.setAttribute("fill", "currentColor");
          path.setAttribute(
            "d",
            platform === "tw" ? TW_SVG_PATH : YT_SVG_PATH
          );
          svg.appendChild(path);
          wrap.appendChild(svg);
          return wrap;
        }

        function addMessage({ platform, user, text, born, channel }) {
          const row = document.createElement("div");
          row.className = "msg";
          row.dataset.born = String(born || Date.now());
          row.dataset.platform = platform;
          if (channel) row.dataset.channel = channel;
          const plat = document.createElement("span");
          plat.className = `plat ${platform}`;
          plat.appendChild(makePlatformIcon(platform));
          const showChan =
            channel &&
            ((platform === "tw" && multiTw) || (platform === "yt" && multiYt));
          if (showChan) {
            const short =
              channel.length > 10 ? channel.slice(0, 8) + "…" : channel;
            const chan = document.createElement("span");
            chan.className = "plat-chan";
            chan.textContent = short;
            plat.title = channel;
            plat.appendChild(chan);
          } else {
            plat.title = platform === "tw" ? "Twitch" : "YouTube";
          }
          const u = document.createElement("span");
          u.className = "user";
          u.textContent = user || "anon";
          const t = document.createElement("span");
          t.className = "text";
          t.textContent = text || "";
          row.append(plat, u, t);
          if (stack === "top") feed.insertBefore(row, feed.firstChild);
          else feed.appendChild(row);
          trimFeed();
        }

        function expireTick() {
          if (!ttlSec) return;
          const cutoff = Date.now() - ttlSec * 1000;
          document.querySelectorAll(".msg").forEach((el) => {
            const born = parseInt(el.dataset.born || "0", 10) || 0;
            if (born && born < cutoff && !el.classList.contains("fade-out")) {
              el.classList.add("fade-out");
              setTimeout(() => {
                try {
                  el.remove();
                } catch (_) {}
              }, 380);
            }
          });
        }
        if (ttlSec > 0) setInterval(expireTick, 500);

        function startDemo() {
          const all = [
            { platform: "tw", user: "拉基粉絲A", text: "哈哈哈這招好強" },
            { platform: "yt", user: "YT觀眾1", text: "剛進來～晚安" },
            { platform: "tw", user: "NightOwl", text: "KKK 太好笑了" },
            { platform: "yt", user: "貓奴", text: "求歌單！" },
            { platform: "tw", user: "BoxBox", text: "POG" },
            { platform: "yt", user: "小白", text: "訂閱了～" },
            { platform: "tw", user: "Tea", text: "今天氣氛很好" },
            { platform: "yt", user: "StreamerFan", text: "加油加油" },
          ];
          const samples = all.filter((m) => (m.platform === "tw" ? demoTw : demoYt));
          if (!samples.length) return;
          const now = Date.now();
          samples.slice(0, Math.min(6, samples.length)).forEach((m, i) => {
            addMessage({ ...m, born: now - (6 - i) * 2500 });
          });
          let i = 0;
          setInterval(() => {
            addMessage(samples[i % samples.length]);
            i += 1;
          }, 2200);
        }

        if (!wantTw && !wantYt && !demo) {
          statusEl.textContent = "NO SRC";
          return;
        }
        refreshStatus();

        function connectTwitch() {
          if (!wantTw || !twitchLogins.length) return;
          const nick = `justinfan${Math.floor(10000 + Math.random() * 80000)}`;
          let ws;
          let closed = false;
          let retry = 0;

          function connect() {
            ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
            ws.addEventListener("open", () => {
              ws.send("PASS SCHMOOPIIE");
              ws.send(`NICK ${nick}`);
              ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
              twitchLogins.forEach((login) => {
                ws.send(`JOIN #${login}`);
              });
            });
            ws.addEventListener("message", (ev) => {
              const raw = String(ev.data || "");
              raw.split("\r\n").forEach((line) => {
                if (!line) return;
                if (line.startsWith("PING")) {
                  ws.send("PONG :tmi.twitch.tv");
                  return;
                }
                const joinM = line.match(/ JOIN #([^\s]+)/i);
                if (joinM) {
                  twConnected.add(joinM[1].toLowerCase());
                  refreshStatus();
                }
                const m = line.match(
                  /^(?:@([^ ]+) )?(?::([^ ]+) )?PRIVMSG #([^ ]+) :(.*)$/
                );
                if (!m) return;
                const tags = {};
                if (m[1]) {
                  m[1].split(";").forEach((kv) => {
                    const i = kv.indexOf("=");
                    if (i > -1) tags[kv.slice(0, i)] = kv.slice(i + 1);
                  });
                }
                const room = (m[3] || "").toLowerCase();
                const user =
                  decodeURIComponent((tags["display-name"] || "").replace(/\\s/g, " ")) ||
                  (m[2] || "").split("!")[0] ||
                  "twitch";
                addMessage({
                  platform: "tw",
                  user,
                  text: m[4],
                  channel: room,
                });
              });
            });
            ws.addEventListener("close", () => {
              twConnected.clear();
              refreshStatus();
              if (closed) return;
              retry = Math.min(retry + 1, 6);
              setTimeout(connect, 1000 * retry);
            });
            ws.addEventListener("error", () => {
              try {
                ws.close();
              } catch (_) {}
            });
          }
          connect();
          window.addEventListener("beforeunload", () => {
            closed = true;
            try {
              ws && ws.close();
            } catch (_) {}
          });
        }

        function normalizeHandle(input) {
          let s = String(input || "").trim();
          if (s.startsWith("http://") || s.startsWith("https://")) {
            try {
              const u = new URL(s);
              const parts = u.pathname.split("/").filter(Boolean);
              if (parts[0] === "channel" && parts[1]) return parts[1];
              if (parts[0]?.startsWith("@")) return parts[0];
              if (parts[0]) return parts[0];
            } catch (_) {}
          }
          return s;
        }

        async function ytFetchJson(url, label) {
          let res;
          try {
            res = await fetch(url);
          } catch (e) {
            throw new Error(`${label} network (${e && e.message ? e.message : "fetch"})`);
          }
          let json = null;
          try {
            json = await res.json();
          } catch (_) {}
          if (!res.ok) {
            const reason =
              json?.error?.errors?.[0]?.reason ||
              json?.error?.message ||
              res.statusText ||
              "";
            throw new Error(
              `${label} ${res.status}${reason ? " " + String(reason).slice(0, 80) : ""}`
            );
          }
          return json;
        }

        function ytLiveCacheKey(channelRaw) {
          return `laji_obs_yt_live_cache:${String(channelRaw || "")
            .trim()
            .toLowerCase()}`;
        }
        function readYtLiveCache(channelRaw) {
          try {
            return JSON.parse(localStorage.getItem(ytLiveCacheKey(channelRaw)) || "null");
          } catch (_) {
            return null;
          }
        }
        function writeYtLiveCache(channelRaw, data) {
          try {
            localStorage.setItem(ytLiveCacheKey(channelRaw), JSON.stringify(data));
          } catch (_) {}
        }
        function clearYtLiveCache(channelRaw) {
          try {
            localStorage.removeItem(ytLiveCacheKey(channelRaw));
          } catch (_) {}
        }

        async function resolveYtChannelId(channelRaw) {
          const raw = normalizeHandle(channelRaw);
          if (/^UC[\w-]{22}$/.test(raw)) return raw;
          const cache = readYtLiveCache(channelRaw);
          if (cache?.channelId && /^UC[\w-]{22}$/.test(cache.channelId)) {
            return cache.channelId;
          }
          const handle = raw.startsWith("@") ? raw.slice(1) : raw;
          try {
            const url = `${YT_API}/channels?part=id&forHandle=${encodeURIComponent(
              handle
            )}&key=${encodeURIComponent(ytKey)}`;
            const json = await ytFetchJson(url, "yt channel");
            const id = json?.items?.[0]?.id;
            if (id) return id;
          } catch (e) {
            console.warn(e);
          }
          try {
            const url = `${YT_API}/channels?part=id&forUsername=${encodeURIComponent(
              handle
            )}&key=${encodeURIComponent(ytKey)}`;
            const json = await ytFetchJson(url, "yt username");
            const id = json?.items?.[0]?.id;
            if (id) return id;
          } catch (e) {
            console.warn(e);
          }
          throw new Error("yt channel not found " + channelRaw);
        }

        async function resolveLiveViaUploads(channelId) {
          const chUrl = `${YT_API}/channels?part=contentDetails&id=${encodeURIComponent(
            channelId
          )}&key=${encodeURIComponent(ytKey)}`;
          const chJson = await ytFetchJson(chUrl, "yt channel details");
          const uploads =
            chJson?.items?.[0]?.contentDetails?.relatedPlaylists?.uploads;
          if (!uploads) return null;
          const plUrl = `${YT_API}/playlistItems?part=contentDetails&playlistId=${encodeURIComponent(
            uploads
          )}&maxResults=15&key=${encodeURIComponent(ytKey)}`;
          const plJson = await ytFetchJson(plUrl, "yt uploads");
          const ids = (plJson?.items || [])
            .map((it) => it?.contentDetails?.videoId)
            .filter(Boolean);
          if (!ids.length) return null;
          const vUrl = `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
            ids.join(",")
          )}&key=${encodeURIComponent(ytKey)}`;
          const vJson = await ytFetchJson(vUrl, "yt recent videos");
          const live = (vJson?.items || []).find((it) => {
            const d = it?.liveStreamingDetails;
            return d && d.actualStartTime && !d.actualEndTime;
          });
          return live?.id || null;
        }

        async function resolveLiveViaSearch(channelId) {
          const url = `${YT_API}/search?part=snippet&channelId=${encodeURIComponent(
            channelId
          )}&eventType=live&type=video&maxResults=1&key=${encodeURIComponent(ytKey)}`;
          const json = await ytFetchJson(url, "yt search");
          return json?.items?.[0]?.id?.videoId || null;
        }

        async function videoStillLive(videoId) {
          if (!videoId) return false;
          const url = `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
            videoId
          )}&key=${encodeURIComponent(ytKey)}`;
          const json = await ytFetchJson(url, "yt videos");
          const details = json?.items?.[0]?.liveStreamingDetails;
          return !!(details && details.actualStartTime && !details.actualEndTime);
        }

        async function resolveLiveVideoId(channelRaw) {
          const cache = readYtLiveCache(channelRaw);
          if (cache?.videoId) {
            try {
              if (await videoStillLive(cache.videoId)) return cache.videoId;
            } catch (e) {
              console.warn(e);
            }
            clearYtLiveCache(channelRaw);
          }
          const channelId = await resolveYtChannelId(channelRaw);
          let id = null;
          let lastErr = null;
          try {
            id = await resolveLiveViaUploads(channelId);
          } catch (e) {
            lastErr = e;
            console.warn(e);
          }
          if (!id) {
            try {
              id = await resolveLiveViaSearch(channelId);
            } catch (e) {
              lastErr = e;
              console.warn(e);
            }
          }
          if (!id && lastErr) throw lastErr;
          if (id) {
            writeYtLiveCache(channelRaw, {
              channelId,
              videoId: id,
              ts: Date.now(),
            });
          }
          return id;
        }

        async function resolveLiveChatId(videoId) {
          const url = `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
            videoId
          )}&key=${encodeURIComponent(ytKey)}`;
          const json = await ytFetchJson(url, "yt videos");
          const details = json?.items?.[0]?.liveStreamingDetails;
          if (!details || details.actualEndTime) return null;
          return details.activeLiveChatId || null;
        }

        function pollOneYoutube({ key, label, getVideoId, cacheRaw }) {
          let videoId = null;
          let chatId = null;
          let pageToken = "";
          let seen = new Set();
          let fail = 0;

          async function ensureChat() {
            videoId = await getVideoId();
            if (!videoId) throw new Error("yt offline " + label);
            chatId = await resolveLiveChatId(videoId);
            if (!chatId) {
              if (cacheRaw) clearYtLiveCache(cacheRaw);
              throw new Error("yt no live chat " + label);
            }
            ytConnected.add(key);
            refreshStatus();
            fail = 0;
          }

          async function tick() {
            try {
              if (!chatId) await ensureChat();
              const url = new URL(`${YT_API}/liveChat/messages`);
              url.searchParams.set("liveChatId", chatId);
              url.searchParams.set("part", "snippet,authorDetails");
              url.searchParams.set("maxResults", "20");
              url.searchParams.set("key", ytKey);
              if (pageToken) url.searchParams.set("pageToken", pageToken);
              const res = await fetch(url);
              if (!res.ok) {
                let reason = "";
                try {
                  const errJson = await res.json();
                  reason =
                    errJson?.error?.errors?.[0]?.reason ||
                    errJson?.error?.message ||
                    "";
                } catch (_) {}
                if (res.status === 403 || res.status === 404) {
                  chatId = null;
                  pageToken = "";
                  ytConnected.delete(key);
                  refreshStatus();
                  if (cacheRaw) clearYtLiveCache(cacheRaw);
                }
                throw new Error(
                  `yt chat ${res.status}${reason ? " " + String(reason).slice(0, 60) : ""}`
                );
              }
              const json = await res.json();
              pageToken = json.nextPageToken || pageToken;
              const wait = Math.max(2500, Number(json.pollingIntervalMillis || 5000));
              (json.items || []).forEach((item) => {
                const id = item.id;
                if (!id || seen.has(id)) return;
                seen.add(id);
                if (seen.size > 500) {
                  seen = new Set(Array.from(seen).slice(-200));
                }
                const text =
                  item.snippet?.displayMessage ||
                  item.snippet?.textMessageDetails?.messageText ||
                  "";
                const user = item.authorDetails?.displayName || "youtube";
                if (text) addMessage({ platform: "yt", user, text, channel: label });
              });
              setTimeout(tick, wait);
            } catch (err) {
              console.warn(err);
              ytConnected.delete(key);
              refreshStatus();
              fail += 1;
              chatId = fail >= 3 ? null : chatId;
              setTimeout(tick, Math.min(15000, 3000 * fail));
            }
          }

          tick();
        }

        function pollYoutube() {
          if (!wantYt) return;
          if (!ytKey && !ytVideoIds.length) return;

          // 有明確影片 ID 的各自輪詢；其餘依頻道自動找 live
          const jobs = [];
          ytVideoIds.forEach((vid) => {
            jobs.push({
              key: "vid:" + vid,
              label: vid,
              cacheRaw: "vid:" + vid,
              getVideoId: async () => vid,
            });
          });
          ytChannels.forEach((ch) => {
            jobs.push({
              key: "ch:" + ch.toLowerCase(),
              label: ch,
              cacheRaw: ch,
              getVideoId: async () => resolveLiveVideoId(ch),
            });
          });

          // 去重：若只有影片、沒頻道也可以
          const seenJob = new Set();
          jobs.forEach((job) => {
            if (seenJob.has(job.key)) return;
            seenJob.add(job.key);
            pollOneYoutube(job);
          });
        }

        if (demo) startDemo();
        else {
          connectTwitch();
          pollYoutube();
        }
        refreshStatus();
      })();
    </script>
