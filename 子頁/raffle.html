<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>拉基的OBS工具箱 · 抽籤</title>
    <script src="../font-style.js"></script>
    <script src="../chat-emote.js"></script>
    <script src="../yt-chat-web.js"></script>
    <script src="../yt-live-sync.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@500;600;700&family=Staatliches&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --fg: #1a1a1a;
        --muted: rgba(26, 26, 26, 0.72);
        --accent: #f0b429;
        --accent-2: #ff6b35;
        --panel: rgba(12, 14, 18, 0.72);
        --line: color-mix(in srgb, var(--accent) 45%, transparent);
        --accent-glow: color-mix(in srgb, var(--accent) 28%, transparent);
        --accent-glow-soft: color-mix(in srgb, var(--accent) 14%, transparent);
        --reel-fg: #fff8e7;
        --size: 28px;
        --font-zh: "IBM Plex Sans TC", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
        --font-display: "Staatliches", "IBM Plex Sans TC", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--fg);
        font-family: var(--font-zh);
      }
      #app {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 16px 16px 20px;
        gap: 10px;
        overflow-x: hidden;
        overflow-y: auto;
      }
      @media (min-height: 720px) {
        #app {
          justify-content: center;
          padding: 24px;
          gap: 14px;
        }
      }
      .title {
        font-family: var(--font-display);
        font-size: calc(var(--size) * 1.35);
        letter-spacing: 0.08em;
        color: var(--accent);
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
        margin: 0;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        justify-content: center;
        font-size: 14px;
        color: var(--muted);
      }
      .meta b {
        color: var(--fg);
        font-weight: 700;
      }
      .reel-shell {
        position: relative;
        width: min(560px, 100%);
        height: clamp(160px, 42vh, 420px);
        flex: 0 0 auto;
        border: 2px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      .reel-shell::before,
      .reel-shell::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 28%;
        z-index: 2;
        pointer-events: none;
      }
      .reel-shell::before {
        top: 0;
        background: linear-gradient(
          to bottom,
          rgba(8, 10, 14, 0.92),
          transparent
        );
      }
      .reel-shell::after {
        bottom: 0;
        background: linear-gradient(to top, rgba(8, 10, 14, 0.92), transparent);
      }
      .pointer {
        position: absolute;
        left: 10px;
        right: 10px;
        top: 50%;
        height: calc(var(--size) * 1.55);
        transform: translateY(-50%);
        border: 2px solid var(--accent);
        border-radius: 12px;
        box-shadow: 0 0 0 1px var(--accent-glow),
          inset 0 0 18px var(--accent-glow-soft);
        z-index: 3;
        pointer-events: none;
      }
      #reel {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        will-change: transform;
      }
      .item {
        height: calc(var(--size) * 1.55);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45em;
        padding: 0 18px;
        font-size: var(--size);
        font-weight: 700;
        color: var(--reel-fg);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item .plat {
        font-size: 0.55em;
        opacity: 0.75;
        min-width: 1.6em;
      }
      .item .badges {
        font-size: 0.45em;
        letter-spacing: 0.04em;
        color: var(--accent);
        opacity: 0.9;
      }
      .winner-banner {
        min-height: 1.4em;
        font-family: var(--font-display);
        font-size: clamp(22px, 3.6vw, 36px);
        letter-spacing: 0.06em;
        color: var(--accent-2);
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      .winner-banner.show {
        opacity: 1;
        transform: translateY(0);
      }
      .controls {
        width: min(560px, 100%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
        pointer-events: auto;
        flex: 0 0 auto;
      }
      .controls-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        align-items: center;
      }
      .controls .time-set {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(26, 26, 26, 0.18);
        color: var(--fg);
        font: 700 13px/1 var(--font-zh);
        box-sizing: border-box;
        flex: 1 1 180px;
        min-width: 0;
      }
      .controls .time-set input[type="number"],
      .controls .time-set input[type="datetime-local"] {
        height: 28px;
        margin: 0;
        border: 1px solid rgba(26, 26, 26, 0.16);
        border-radius: 8px;
        padding: 0 8px;
        font: 700 13px/28px var(--font-zh);
        color: #1a1a1a;
        background: #fff;
        box-sizing: border-box;
        flex: 1 1 auto;
        min-width: 0;
        width: auto;
      }
      .controls .time-set input[type="number"] {
        flex: 0 0 72px;
        width: 72px;
      }
      .controls button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        height: 44px;
        padding: 0 22px;
        font: 700 15px/1 var(--font-zh);
        cursor: pointer;
        color: #1a1208;
        background: linear-gradient(180deg, #ffd56a, #f0b429);
        box-shadow: 0 4px 0 #b07a12;
        box-sizing: border-box;
      }
      .controls button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #b07a12;
      }
      .controls button.secondary {
        color: #1a1a1a;
        background: #fff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(26, 26, 26, 0.18);
      }
      .controls button.secondary:active {
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
      }
      .controls button:disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }
      #status {
        position: absolute;
        left: 10px;
        top: 8px;
        font-size: 12px;
        color: var(--muted);
        opacity: 0.85;
      }
      body.hide-status #status {
        display: none;
      }
      body.hide-controls .controls {
        display: none;
      }
    </style>
    <style id="custom-style"></style>
  </head>
  <body>
    <div id="status">connecting…</div>
    <div id="app">
      <h1 class="title" id="heading">抽籤</h1>
      <div class="meta">
        <span>狀態 <b id="phaseLabel">收件中</b></span>
        <span>名單 <b id="countLabel">0</b></span>
        <span id="timerWrap">倒數 <b id="timerLabel">—</b></span>
        <span id="filterLabel"></span>
      </div>
      <div class="reel-shell" aria-live="polite">
        <div class="pointer" aria-hidden="true"></div>
        <div id="reel"></div>
      </div>
      <div class="winner-banner" id="winnerBanner"></div>
      <div class="controls">
        <div class="controls-row">
          <label class="time-set" for="startInput"
            >開始
            <input id="startInput" type="datetime-local" step="1" />
          </label>
          <label class="time-set" for="endInput"
            >結束
            <input id="endInput" type="datetime-local" step="1" />
          </label>
          <label class="time-set" for="collectInput" title="開始與結束都空白時才用"
            >備援秒數
            <input id="collectInput" type="number" min="5" max="600" step="1" />
          </label>
        </div>
        <div class="controls-row">
          <button type="button" class="secondary" id="btnClose">截止收件</button>
          <button type="button" id="btnStart" disabled>開始</button>
          <button type="button" id="btnStop" disabled>停止</button>
          <button type="button" class="secondary" id="btnReset">重來</button>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const YT_API = "https://www.googleapis.com/youtube/v3";
        const params = new URLSearchParams(location.search);

        function cssVar(name, value) {
          if (value) document.documentElement.style.setProperty(name, value);
        }
        const baseFontSize = (() => {
          const n = parseInt(params.get("fontSize") || "28", 10);
          return Number.isFinite(n) ? Math.max(14, Math.min(72, n)) : 28;
        })();
        cssVar("--size", `${baseFontSize}px`);
        if (window.ObsFontStyle) ObsFontStyle.applyFromParams(params, { cssVar });
        // 再寫一次，避免字形套用把字級蓋掉
        cssVar("--size", `${baseFontSize}px`);
        const fg = (params.get("color") || "").trim() || "#1a1a1a";
        cssVar("--fg", fg);
        // muted 跟著文字色走，避免預覽白底上看不見
        try {
          const hex = fg.replace("#", "");
          const full =
            hex.length === 3
              ? hex
                  .split("")
                  .map((c) => c + c)
                  .join("")
              : hex;
          if (/^[0-9a-fA-F]{6}$/.test(full)) {
            const r = parseInt(full.slice(0, 2), 16);
            const g = parseInt(full.slice(2, 4), 16);
            const b = parseInt(full.slice(4, 6), 16);
            cssVar("--muted", `rgba(${r}, ${g}, ${b}, 0.72)`);
          }
        } catch (_) {}
        const accent = (params.get("accent") || "").trim() || "#f0b429";
        cssVar("--accent", accent);
        // 外框／瞄準框光暈都跟強調色
        try {
          const hex = accent.replace("#", "");
          const full =
            hex.length === 3
              ? hex
                  .split("")
                  .map((c) => c + c)
                  .join("")
              : hex;
          if (/^[0-9a-fA-F]{6}$/.test(full)) {
            const r = parseInt(full.slice(0, 2), 16);
            const g = parseInt(full.slice(2, 4), 16);
            const b = parseInt(full.slice(4, 6), 16);
            cssVar("--line", `rgba(${r}, ${g}, ${b}, 0.45)`);
            cssVar("--accent-glow", `rgba(${r}, ${g}, ${b}, 0.28)`);
            cssVar("--accent-glow-soft", `rgba(${r}, ${g}, ${b}, 0.14)`);
          }
        } catch (_) {}
        const css = (params.get("css") || "").trim();
        if (css) {
          try {
            document.getElementById("custom-style").textContent = decodeURIComponent(css);
          } catch (_) {
            document.getElementById("custom-style").textContent = css;
          }
        }
        if (params.get("hideStatus") === "1") document.body.classList.add("hide-status");
        if (params.get("hideControls") === "1") document.body.classList.add("hide-controls");

        const heading = document.getElementById("heading");
        const title = (params.get("title") || "抽籤").trim();
        heading.textContent = title || "抽籤";

        let collectSec = Math.max(
          5,
          Math.min(600, parseInt(params.get("collect") || params.get("secs") || "60", 10) || 60)
        );
        function parseTimeParam(raw) {
          const s = String(raw || "").trim();
          if (!s) return null;
          const d = new Date(s);
          return Number.isNaN(d.getTime()) ? null : d;
        }
        function toLocalInputValue(d) {
          if (!d || Number.isNaN(d.getTime())) return "";
          const pad = (n) => String(n).padStart(2, "0");
          return (
            d.getFullYear() +
            "-" +
            pad(d.getMonth() + 1) +
            "-" +
            pad(d.getDate()) +
            "T" +
            pad(d.getHours()) +
            ":" +
            pad(d.getMinutes()) +
            ":" +
            pad(d.getSeconds())
          );
        }
        function formatRemain(ms) {
          const total = Math.max(0, Math.ceil(ms / 1000));
          const h = Math.floor(total / 3600);
          const m = Math.floor((total % 3600) / 60);
          const s = total % 60;
          const pad = (n) => String(n).padStart(2, "0");
          if (h > 0) return h + ":" + pad(m) + ":" + pad(s);
          return pad(m) + ":" + pad(s);
        }
        let windowStart = parseTimeParam(params.get("start") || params.get("from"));
        let windowEnd = parseTimeParam(params.get("end") || params.get("to"));
        const keyword = (params.get("keyword") || params.get("kw") || "").trim();
        function parseAllowRoles() {
          const raw = (params.get("roles") || "").trim().toLowerCase();
          const all = {
            vip: true,
            mod: true,
            paid: true,
            follow: true,
            ytsub: true,
            other: true,
          };
          if (!raw) {
            // 舊版 vip/mod/sub=yes|no|any → 盡量對應
            const vip = (params.get("vip") || "any").toLowerCase();
            const mod = (params.get("mod") || "any").toLowerCase();
            const sub = (params.get("sub") || "any").toLowerCase();
            if (vip === "any" && mod === "any" && sub === "any") return all;
            const allow = {
              vip: false,
              mod: false,
              paid: false,
              follow: false,
              ytsub: false,
              other: false,
            };
            if (vip === "yes") allow.vip = true;
            if (mod === "yes") allow.mod = true;
            if (sub === "yes") allow.paid = true;
            if (vip !== "yes" && mod !== "yes" && sub !== "yes") {
              allow.other = true;
              allow.follow = true;
              allow.ytsub = true;
              if (vip !== "no") allow.vip = true;
              if (mod !== "no") allow.mod = true;
              if (sub !== "no") allow.paid = true;
            }
            if (vip === "no") allow.vip = false;
            if (mod === "no") allow.mod = false;
            if (sub === "no") allow.paid = false;
            return allow;
          }
          if (raw === "none") {
            return {
              vip: false,
              mod: false,
              paid: false,
              follow: false,
              ytsub: false,
              other: false,
            };
          }
          const set = new Set(
            raw.split(/[\s,，、]+/).map((s) => s.trim()).filter(Boolean)
          );
          return {
            vip: set.has("vip"),
            mod: set.has("mod"),
            paid: set.has("paid") || set.has("sub"),
            follow: set.has("follow") || set.has("follower"),
            ytsub:
              set.has("ytsub") ||
              set.has("ytfree") ||
              set.has("subscribe") ||
              set.has("ytfollow"),
            other: set.has("other") || set.has("viewer"),
          };
        }
        const allowRoles = parseAllowRoles();
        function readWeightParam(keys, fallback) {
          for (const k of keys) {
            const raw = params.get(k);
            if (raw == null || raw === "") continue;
            const n = parseInt(raw, 10);
            if (Number.isFinite(n)) return Math.max(1, Math.min(20, n));
          }
          return fallback;
        }
        const roleWeights = {
          vip: readWeightParam(["wVip", "weightVip", "vipW"], 1),
          mod: readWeightParam(["wMod", "weightMod", "modW"], 1),
          paid: readWeightParam(["wPaid", "weightPaid", "paidW", "wSub"], 1),
          follow: readWeightParam(["wFollow", "weightFollow", "followW"], 1),
          ytsub: readWeightParam(["wYtSub", "weightYtSub", "ytSubW"], 1),
          other: readWeightParam(["wOther", "weightOther", "otherW"], 1),
        };
        const demo = params.get("demo") === "1";
        const ytChatMode = (params.get("ytChat") || params.get("ytChatEmotes") || "api").toLowerCase();
        const ytChatWeb = ytChatMode === "web";
        const TWITCH_FOLLOW_CLIENT_ID =
          params.get("twClientId") || "e4xrdv8q0d7ij7k7h5ce7os0u0rd5v";
        let twAccessToken = (params.get("twToken") || params.get("twAccess") || "").trim();
        let twRefreshToken = (params.get("twRefresh") || "").trim();
        let twTokenExpiresAt = 0;
        const twUserIdCache = new Map(); // login -> id | ""
        const twFollowCache = new Map(); // `${broadcasterId}:${userId}` -> boolean
        const twFollowPending = new Map(); // same key -> Promise<boolean>

        function splitParamList(raw) {
          return String(raw || "")
            .split(/[\s,，、]+/)
            .map((s) => s.trim())
            .filter(Boolean);
        }
        function uniqueKeepOrder(arr) {
          const seen = new Set();
          const out = [];
          arr.forEach((x) => {
            const k = String(x || "").toLowerCase();
            if (!k || seen.has(k)) return;
            seen.add(k);
            out.push(x);
          });
          return out;
        }
        function extractYoutubeVideoId(raw) {
          const s = String(raw || "").trim();
          if (!s) return "";
          if (/^[\w-]{11}$/.test(s)) return s;
          try {
            const u = new URL(s);
            const host = u.hostname.replace(/^www\./, "");
            if (host === "youtu.be") return u.pathname.slice(1, 12);
            if (
              host === "youtube.com" ||
              host === "m.youtube.com" ||
              host === "music.youtube.com"
            ) {
              return u.searchParams.get("v") || "";
            }
          } catch (_) {}
          const m = s.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/);
          return m ? m[1] : s;
        }

        const twitchLogins = uniqueKeepOrder(
          splitParamList(params.get("login") || params.get("twitch") || "").map((s) =>
            s.toLowerCase()
          )
        );
        const ytChannels = uniqueKeepOrder(
          splitParamList(params.get("yt") || params.get("youtube") || params.get("ytChannel") || "")
        );
        const ytVideoIds = uniqueKeepOrder(
          splitParamList(params.get("ytVideo") || "").map(extractYoutubeVideoId)
        );
        const ytKey = (params.get("ytKey") || params.get("youtubeKey") || "").trim();
        const sources = (params.get("chatSource") || "auto").toLowerCase();
        const wantTw =
          twitchLogins.length > 0 &&
          (sources === "auto" || sources === "twitch" || sources === "both");
        const wantYt =
          (ytVideoIds.length > 0 ||
            (ytChannels.length > 0 && (ytChatWeb || !!ytKey))) &&
          (sources === "auto" || sources === "youtube" || sources === "both");

        const statusEl = document.getElementById("status");
        const phaseLabel = document.getElementById("phaseLabel");
        const countLabel = document.getElementById("countLabel");
        const timerLabel = document.getElementById("timerLabel");
        const filterLabel = document.getElementById("filterLabel");
        const reel = document.getElementById("reel");
        const winnerBanner = document.getElementById("winnerBanner");
        const startInput = document.getElementById("startInput");
        const endInput = document.getElementById("endInput");
        const collectInput = document.getElementById("collectInput");
        const btnClose = document.getElementById("btnClose");
        const btnStart = document.getElementById("btnStart");
        const btnStop = document.getElementById("btnStop");
        const btnReset = document.getElementById("btnReset");
        if (collectInput) collectInput.value = String(collectSec);
        if (startInput) startInput.value = toLocalInputValue(windowStart);
        if (endInput) endInput.value = toLocalInputValue(windowEnd);

        function readCollectSecFromInput() {
          const n = parseInt(collectInput && collectInput.value, 10);
          return Math.max(5, Math.min(600, Number.isFinite(n) ? n : collectSec));
        }

        function readWindowFromInputs() {
          const sRaw = startInput && startInput.value;
          const eRaw = endInput && endInput.value;
          windowStart = sRaw ? parseTimeParam(sRaw) : null;
          windowEnd = eRaw ? parseTimeParam(eRaw) : null;
          if (
            windowStart &&
            windowEnd &&
            windowEnd.getTime() < windowStart.getTime()
          ) {
            const tmp = windowStart;
            windowStart = windowEnd;
            windowEnd = tmp;
            if (startInput) startInput.value = toLocalInputValue(windowStart);
            if (endInput) endInput.value = toLocalInputValue(windowEnd);
          }
          collectSec = readCollectSecFromInput();
          if (collectInput) collectInput.value = String(collectSec);
        }

        function usesAbsoluteWindow() {
          return !!(windowStart || windowEnd);
        }

        function syncScheduleFromInputs(opts) {
          const forcePhase = opts && opts.forcePhase;
          readWindowFromInputs();
          const now = Date.now();
          if (usesAbsoluteWindow()) {
            const startMs = windowStart ? windowStart.getTime() : now;
            const endMs = windowEnd ? windowEnd.getTime() : null;
            collectEndsAt = endMs;
            if (forcePhase || phase === "wait" || phase === "collect") {
              if (now < startMs) setPhase("wait");
              else if (endMs != null && now >= endMs) {
                setPhase("ready");
                timerLabel.textContent = "0";
              } else setPhase("collect");
            }
            return;
          }
          // 無起訖：用備援秒數
          collectEndsAt = now + collectSec * 1000;
          if (forcePhase || phase === "wait" || phase === "collect") {
            setPhase("collect");
          }
        }

        const filterBits = [];
        if (keyword) filterBits.push("關鍵字「" + keyword + "」");
        const roleBits = [];
        if (allowRoles.mod) roleBits.push("MOD");
        if (allowRoles.vip) roleBits.push("VIP");
        if (allowRoles.paid) roleBits.push("付費訂閱／會員");
        if (allowRoles.follow) roleBits.push("TW追隨");
        if (allowRoles.ytsub) roleBits.push("YT免費訂閱");
        if (allowRoles.other) roleBits.push("其他觀眾");
        if (roleBits.length === 6) filterBits.push("身分 全部可抽");
        else if (!roleBits.length) filterBits.push("身分 全關（沒人可抽）");
        else filterBits.push("身分 " + roleBits.join("／"));
        if (allowRoles.follow) {
          filterBits.push(
            twAccessToken ? "TW追隨已授權" : "TW追隨未授權（聊天抓不到）"
          );
        }
        if (allowRoles.ytsub) {
          filterBits.push(
            ytKey ? "YT訂閱盡力查（公開清單）" : "YT訂閱未填 API Key"
          );
        }
        const weightBits = [];
        if (roleWeights.mod !== 1) weightBits.push("MOD×" + roleWeights.mod);
        if (roleWeights.vip !== 1) weightBits.push("VIP×" + roleWeights.vip);
        if (roleWeights.paid !== 1) weightBits.push("付費×" + roleWeights.paid);
        if (roleWeights.follow !== 1) weightBits.push("TW追隨×" + roleWeights.follow);
        if (roleWeights.ytsub !== 1) weightBits.push("YT訂閱×" + roleWeights.ytsub);
        if (roleWeights.other !== 1) weightBits.push("其他×" + roleWeights.other);
        if (weightBits.length) filterBits.push("比重 " + weightBits.join(" "));
        filterLabel.textContent = filterBits.length
          ? "條件 " + filterBits.join(" · ")
          : "條件 全部留言";

        function needTwitchFollowLookup() {
          return allowRoles.follow && !!twAccessToken;
        }

        function needYtFreeSubLookup() {
          return allowRoles.ytsub && !!ytKey;
        }

        const ytTargetChannelIds = [];
        const ytChannelIdCache = new Map();
        const ytSubCache = new Map(); // authorId|targetId -> boolean
        const ytSubPending = new Map();

        async function resolveYtChannelId(raw) {
          const s = String(raw || "").trim();
          if (!s || !ytKey) return "";
          if (/^UC[\w-]{20,}$/i.test(s)) return s;
          const key = s.toLowerCase();
          if (ytChannelIdCache.has(key)) return ytChannelIdCache.get(key);
          try {
            let channelId = "";
            if (s.startsWith("@")) {
              const url = `${YT_API}/channels?part=id&forHandle=${encodeURIComponent(
                s.slice(1)
              )}&key=${encodeURIComponent(ytKey)}`;
              const json = await ytFetchJson(url, "yt handle");
              channelId = json?.items?.[0]?.id || "";
            } else {
              const url = `${YT_API}/search?part=snippet&type=channel&maxResults=1&q=${encodeURIComponent(
                s
              )}&key=${encodeURIComponent(ytKey)}`;
              const json = await ytFetchJson(url, "yt search ch");
              channelId = json?.items?.[0]?.snippet?.channelId || "";
            }
            ytChannelIdCache.set(key, channelId);
            return channelId;
          } catch (_) {
            ytChannelIdCache.set(key, "");
            return "";
          }
        }

        async function ensureYtTargetChannelIds() {
          if (ytTargetChannelIds.length) return ytTargetChannelIds;
          const found = [];
          for (const ch of ytChannels) {
            const id = await resolveYtChannelId(ch);
            if (id) found.push(id);
          }
          for (const vid of ytVideoIds) {
            if (!vid || !ytKey) continue;
            try {
              const url = `${YT_API}/videos?part=snippet&id=${encodeURIComponent(
                vid
              )}&key=${encodeURIComponent(ytKey)}`;
              const json = await ytFetchJson(url, "yt video ch");
              const id = json?.items?.[0]?.snippet?.channelId || "";
              if (id) found.push(id);
            } catch (_) {}
          }
          uniqueKeepOrder(found).forEach((id) => ytTargetChannelIds.push(id));
          return ytTargetChannelIds;
        }

        async function checkYtFreeSub(authorChannelId) {
          const author = String(authorChannelId || "").trim();
          if (!author || !ytKey) return false;
          const targets = await ensureYtTargetChannelIds();
          if (!targets.length) return false;
          for (const target of targets) {
            const cacheKey = author + ">" + target;
            if (ytSubCache.has(cacheKey)) {
              if (ytSubCache.get(cacheKey)) return true;
              continue;
            }
            if (ytSubPending.has(cacheKey)) {
              if (await ytSubPending.get(cacheKey)) return true;
              continue;
            }
            const job = (async () => {
              try {
                const url =
                  `${YT_API}/subscriptions?part=id` +
                  `&channelId=${encodeURIComponent(author)}` +
                  `&forChannelId=${encodeURIComponent(target)}` +
                  `&key=${encodeURIComponent(ytKey)}`;
                const res = await fetch(url);
                if (!res.ok) {
                  // 403 常見於訂閱清單未公開
                  ytSubCache.set(cacheKey, false);
                  return false;
                }
                const json = await res.json();
                const ok = !!(json.items && json.items.length);
                ytSubCache.set(cacheKey, ok);
                return ok;
              } catch (_) {
                ytSubCache.set(cacheKey, false);
                return false;
              } finally {
                ytSubPending.delete(cacheKey);
              }
            })();
            ytSubPending.set(cacheKey, job);
            if (await job) return true;
          }
          return false;
        }

        async function refreshTwitchAccessToken() {
          if (!twRefreshToken) return false;
          const body = new URLSearchParams({
            client_id: TWITCH_FOLLOW_CLIENT_ID,
            grant_type: "refresh_token",
            refresh_token: twRefreshToken,
          });
          const res = await fetch("https://id.twitch.tv/oauth2/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body,
          });
          if (!res.ok) return false;
          const json = await res.json();
          if (!json.access_token) return false;
          twAccessToken = json.access_token;
          if (json.refresh_token) twRefreshToken = json.refresh_token;
          twTokenExpiresAt = Date.now() + Number(json.expires_in || 3600) * 1000;
          return true;
        }

        async function ensureTwitchAccessToken() {
          if (!twAccessToken) return "";
          if (twTokenExpiresAt && Date.now() > twTokenExpiresAt - 60 * 1000) {
            const ok = await refreshTwitchAccessToken();
            if (!ok) return twAccessToken;
          }
          return twAccessToken;
        }

        async function helixGet(pathAndQuery) {
          const token = await ensureTwitchAccessToken();
          if (!token) throw new Error("no tw token");
          const res = await fetch("https://api.twitch.tv/helix/" + pathAndQuery, {
            headers: {
              Authorization: "Bearer " + token,
              "Client-Id": TWITCH_FOLLOW_CLIENT_ID,
            },
          });
          if (res.status === 401) {
            const ok = await refreshTwitchAccessToken();
            if (!ok) throw new Error("twitch 401");
            return helixGet(pathAndQuery);
          }
          if (!res.ok) throw new Error("helix " + res.status);
          return res.json();
        }

        async function resolveTwitchUserId(login) {
          const key = String(login || "")
            .trim()
            .toLowerCase();
          if (!key) return "";
          if (twUserIdCache.has(key)) return twUserIdCache.get(key);
          try {
            const json = await helixGet("users?login=" + encodeURIComponent(key));
            const id = (json.data && json.data[0] && json.data[0].id) || "";
            twUserIdCache.set(key, id);
            return id;
          } catch (_) {
            twUserIdCache.set(key, "");
            return "";
          }
        }

        async function checkTwitchFollow(broadcasterLogin, userLogin) {
          const bLogin = String(broadcasterLogin || "")
            .trim()
            .toLowerCase();
          const uLogin = String(userLogin || "")
            .trim()
            .toLowerCase();
          if (!bLogin || !uLogin) return false;
          const cacheKey = bLogin + ">" + uLogin;
          if (twFollowCache.has(cacheKey)) return twFollowCache.get(cacheKey);
          if (twFollowPending.has(cacheKey)) return twFollowPending.get(cacheKey);
          const job = (async () => {
            try {
              const [broadcasterId, userId] = await Promise.all([
                resolveTwitchUserId(bLogin),
                resolveTwitchUserId(uLogin),
              ]);
              if (!broadcasterId || !userId) {
                twFollowCache.set(cacheKey, false);
                return false;
              }
              const json = await helixGet(
                "channels/followers?broadcaster_id=" +
                  encodeURIComponent(broadcasterId) +
                  "&user_id=" +
                  encodeURIComponent(userId)
              );
              const ok = !!(json.data && json.data.length);
              twFollowCache.set(cacheKey, ok);
              return ok;
            } catch (_) {
              twFollowCache.set(cacheKey, false);
              return false;
            } finally {
              twFollowPending.delete(cacheKey);
            }
          })();
          twFollowPending.set(cacheKey, job);
          return job;
        }

        /** @type {Map<string, object>} */
        const entries = new Map();
        let phase = "collect"; // wait | collect | ready | spin | stop | win
        let collectEndsAt = null; // number | null（null＝不自動截止）
        let sharedOverrideVideoId = "";
        let twConnected = new Set();
        let ytConnected = new Set();

        const itemH = () => {
          const v = getComputedStyle(document.documentElement).getPropertyValue("--size");
          const px = parseFloat(v) || 28;
          return px * 1.55;
        };

        function entryKey(msg) {
          if (msg.platform === "tw") {
            return "tw:" + String(msg.login || msg.user || "").toLowerCase();
          }
          return (
            "yt:" +
            String(msg.channelId || msg.login || msg.user || "")
              .toLowerCase()
              .trim()
          );
        }

        function roleFlags(msg) {
          const vip = !!msg.isVip;
          const mod = !!(msg.isMod || msg.isOwner);
          const paid = !!msg.isSub;
          const follow = !!msg.isFollow;
          const ytsub = !!msg.isYtSub;
          // 互斥：有 VIP／MOD／付費／TW追隨／YT免費訂閱 → 不算「其他觀眾」
          const other = !vip && !mod && !paid && !follow && !ytsub;
          return { vip, mod, paid, follow, ytsub, other };
        }

        /** 多重身分：在他擁有的身分裡取比重最高的（例如 VIP×3、付費×2 → 用 3） */
        function weightForEntry(msg) {
          const f = roleFlags(msg);
          let w = 1;
          if (f.mod) w = Math.max(w, Number(roleWeights.mod) || 1);
          if (f.vip) w = Math.max(w, Number(roleWeights.vip) || 1);
          if (f.paid) w = Math.max(w, Number(roleWeights.paid) || 1);
          if (f.follow) w = Math.max(w, Number(roleWeights.follow) || 1);
          if (f.ytsub) w = Math.max(w, Number(roleWeights.ytsub) || 1);
          if (f.other) w = Math.max(w, Number(roleWeights.other) || 1);
          return Math.max(1, Math.min(20, w));
        }

        function shuffleInPlace(arr) {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = arr[i];
            arr[i] = arr[j];
            arr[j] = tmp;
          }
          return arr;
        }

        function buildWeightedShuffledList() {
          const people = listEntries();
          const out = [];
          people.forEach((e) => {
            const w = weightForEntry(e);
            for (let i = 0; i < w; i++) out.push(e);
          });
          return shuffleInPlace(out);
        }

        function matchesFilters(msg) {
          if (!msg || !String(msg.text || "").trim()) return false;
          if (keyword) {
            const hay = String(msg.text || "");
            if (!hay.toLowerCase().includes(keyword.toLowerCase())) return false;
          }
          const f = roleFlags(msg);
          return (
            (allowRoles.vip && f.vip) ||
            (allowRoles.mod && f.mod) ||
            (allowRoles.paid && f.paid) ||
            (allowRoles.follow && f.follow) ||
            (allowRoles.ytsub && f.ytsub) ||
            (allowRoles.other && f.other)
          );
        }

        function parseTwitchBadges(tag) {
          const out = { isVip: false, isMod: false, isSub: false, isOwner: false };
          String(tag || "")
            .split(",")
            .forEach((part) => {
              const id = part.split("/")[0];
              if (id === "vip") out.isVip = true;
              if (id === "moderator") out.isMod = true;
              if (id === "broadcaster") {
                out.isOwner = true;
                out.isMod = true;
              }
              if (id === "subscriber" || id === "founder") out.isSub = true;
            });
          return out;
        }

        function refreshStatus() {
          if (demo) {
            statusEl.textContent = "DEMO";
            return;
          }
          const parts = [];
          if (wantTw) {
            parts.push(
              twConnected.size
                ? `TW ${twConnected.size}/${twitchLogins.length}●`
                : `TW 0/${twitchLogins.length}○`
            );
          }
          if (wantYt) {
            const n = Math.max(1, ytChannels.length + ytVideoIds.length);
            parts.push(
              ytConnected.size ? `YT ${ytConnected.size}/${n}●` : `YT 0/${n}○`
            );
          }
          statusEl.textContent = parts.length ? parts.join(" ") : "NO SRC";
        }

        function setPhase(next) {
          phase = next;
          const map = {
            wait: "尚未開始",
            collect: "收件中",
            ready: "就緒",
            spin: "拉霸中",
            stop: "減速中",
            win: "抽中",
          };
          phaseLabel.textContent = map[next] || next;
          btnClose.disabled = next !== "collect";
          btnStart.disabled = !(next === "ready" || next === "win") || entries.size < 1;
          btnStop.disabled = next !== "spin";
          if (next === "win") btnStart.textContent = "再抽一次";
          else btnStart.textContent = "開始";
        }

        function listEntries() {
          return Array.from(entries.values());
        }

        function renderReel(list, repeats) {
          const rows = [];
          const times = Math.max(1, repeats || 1);
          for (let r = 0; r < times; r++) {
            list.forEach((e) => {
              const badges = [];
              if (e.isVip) badges.push("VIP");
              if (e.isMod) badges.push("MOD");
              if (e.isSub) badges.push(e.platform === "yt" ? "會員" : "付費訂閱");
              if (e.isFollow) badges.push("TW追隨");
              if (e.isYtSub) badges.push("YT訂閱");
              rows.push(
                `<div class="item" data-key="${e.key}">` +
                  `<span class="plat">${e.platform === "tw" ? "TW" : "YT"}</span>` +
                  `<span class="name"></span>` +
                  (badges.length
                    ? `<span class="badges">${badges.join(" ")}</span>`
                    : "") +
                  `</div>`
              );
            });
          }
          reel.innerHTML =
            rows.join("") ||
            `<div class="item"><span class="name">等待符合條件的人…</span></div>`;
          Array.from(reel.querySelectorAll(".item")).forEach((el, i) => {
            const nameEl = el.querySelector(".name");
            if (!nameEl) return;
            if (!list.length) return;
            const e = list[i % list.length];
            nameEl.textContent = e.user || e.login || "anon";
          });
        }

        let offsetY = 0;
        let velocity = 0; // px per ms
        let animMode = "idle"; // idle | spin | ease | hold
        let targetY = 0;
        let easeStartedAt = 0;
        let winner = null;
        let lastTs = 0;
        let reelList = [];
        let reelRepeats = 8;

        function centerOffsetForIndex(indexInFull) {
          const h = itemH();
          const shell = document.querySelector(".reel-shell");
          const mid = (shell?.clientHeight || 420) / 2 - h / 2;
          return mid - indexInFull * h;
        }

        function rebuildReelVisual() {
          const uniqueCount = entries.size;
          countLabel.textContent = String(uniqueCount);
          reelList = buildWeightedShuffledList();
          const reps = Math.max(6, Math.ceil(40 / Math.max(1, reelList.length)));
          reelRepeats = reps;
          renderReel(reelList, reps);
          if (!reelList.length) {
            offsetY = 0;
            reel.style.transform = `translateY(0px)`;
            return;
          }
          // keep offset roughly in middle copy
          const h = itemH();
          const cycle = reelList.length * h;
          if (cycle > 0) {
            while (offsetY > 0) offsetY -= cycle;
            while (offsetY < -cycle * (reps - 2)) offsetY += cycle;
          }
          reel.style.transform = `translateY(${offsetY}px)`;
        }

        function tickAnim(ts) {
          if (!lastTs) lastTs = ts;
          const dt = Math.min(48, ts - lastTs);
          lastTs = ts;
          const h = itemH();
          const list = reelList;
          const cycle = Math.max(h, (list.length || 1) * h);

          if (animMode === "idle") {
            velocity = list.length ? 0.035 : 0; // slow px/ms
            offsetY -= velocity * dt;
            if (offsetY < -cycle * (reelRepeats - 2)) offsetY += cycle;
          } else if (animMode === "spin") {
            velocity = Math.min(2.4, velocity + 0.004 * dt);
            offsetY -= velocity * dt;
            if (offsetY < -cycle * (reelRepeats - 2)) offsetY += cycle;
          } else if (animMode === "ease") {
            const dist = targetY - offsetY;
            // 目標應在更上方（offset 更負）；用平滑插值 + 逾時鎖死
            const step = Math.max(0.08, Math.min(0.22, 0.12 + Math.abs(dist) / 8000));
            offsetY += dist * step;
            velocity = dist * step;
            const timedOut = easeStartedAt && ts - easeStartedAt > 2800;
            if (Math.abs(dist) < 1.5 || timedOut) {
              offsetY = targetY;
              animMode = "hold";
              velocity = 0;
              setPhase("win");
              if (winner) {
                winnerBanner.textContent = "抽中　" + (winner.user || winner.login);
                winnerBanner.classList.add("show");
              }
            }
          }
          reel.style.transform = `translateY(${offsetY}px)`;
          requestAnimationFrame(tickAnim);
        }
        requestAnimationFrame(tickAnim);

        function addEntry(msg) {
          if (phase !== "collect") return;
          if (!matchesFilters(msg)) return;
          const key = entryKey(msg);
          if (!key || key.endsWith(":")) return;
          const prev = entries.get(key);
          const next = {
            key,
            platform: msg.platform,
            user: msg.user || msg.login || "anon",
            login: msg.login || "",
            channelId: msg.channelId || "",
            channelLogin: msg.channelLogin || (prev && prev.channelLogin) || "",
            isVip: !!(prev && prev.isVip) || !!msg.isVip,
            isMod: !!(prev && prev.isMod) || !!msg.isMod || !!msg.isOwner,
            isSub: !!(prev && prev.isSub) || !!msg.isSub,
            isFollow: !!(prev && prev.isFollow) || !!msg.isFollow,
            isYtSub: !!(prev && prev.isYtSub) || !!msg.isYtSub,
            isOwner: !!(prev && prev.isOwner) || !!msg.isOwner,
            text: msg.text || "",
          };
          const isNew = !prev;
          entries.set(key, next);
          if (isNew) rebuildReelVisual();
          else countLabel.textContent = String(entries.size);
        }

        async function ingestChatMessage(msg) {
          if (phase !== "collect") return;
          if (!msg || !String(msg.text || "").trim()) return;
          if (
            needTwitchFollowLookup() &&
            msg.platform === "tw" &&
            msg.login &&
            msg.isFollow == null
          ) {
            const channelLogin =
              msg.channelLogin ||
              (twitchLogins && twitchLogins[0]) ||
              "";
            msg.isFollow = await checkTwitchFollow(channelLogin, msg.login);
          } else if (msg.isFollow == null) {
            msg.isFollow = false;
          }
          if (
            needYtFreeSubLookup() &&
            msg.platform === "yt" &&
            msg.channelId &&
            msg.isYtSub == null
          ) {
            msg.isYtSub = await checkYtFreeSub(msg.channelId);
          } else if (msg.isYtSub == null) {
            msg.isYtSub = false;
          }
          addEntry(msg);
        }

        function closeCollect() {
          if (phase !== "collect" && phase !== "wait") return;
          setPhase("ready");
          timerLabel.textContent = "0";
          rebuildReelVisual();
        }

        function startSpin() {
          if (entries.size < 1) return;
          if (phase !== "ready" && phase !== "win") return;
          winnerBanner.classList.remove("show");
          winnerBanner.textContent = "";
          winner = null;
          rebuildReelVisual();
          animMode = "spin";
          velocity = 0.8;
          setPhase("spin");
        }

        function stopSpin() {
          if (phase !== "spin") return;
          // 用加權後的拉霸名單抽（比重越高出現越多、中獎機率也越高）
          const list = reelList.length ? reelList : buildWeightedShuffledList();
          if (!list.length) return;
          const idx = Math.floor(Math.random() * list.length);
          winner = list[idx];
          const h = itemH();
          const shell = document.querySelector(".reel-shell");
          const mid = (shell?.clientHeight || 420) / 2 - h / 2;
          // offsetY = mid - index*h  → 目前大約停在哪個 index
          let currentIndex = (mid - offsetY) / h;
          if (!Number.isFinite(currentIndex)) currentIndex = 0;
          // 至少再滾兩圈，並對齊到抽中的那一格（加權複本）
          let targetIndex = Math.ceil(currentIndex + list.length * 2 + 1);
          const rem =
            ((Math.round(targetIndex) % list.length) + list.length) % list.length;
          let delta = idx - rem;
          if (delta < 0) delta += list.length;
          targetIndex = Math.round(targetIndex) + delta;
          targetY = mid - targetIndex * h;
          // 確保目標在「繼續往負 offset」方向
          while (targetY > offsetY - list.length * h) {
            targetY -= list.length * h;
          }
          easeStartedAt = performance.now();
          animMode = "ease";
          setPhase("stop");
        }

        function resetAll() {
          entries.clear();
          winner = null;
          winnerBanner.classList.remove("show");
          winnerBanner.textContent = "";
          animMode = "idle";
          velocity = 0;
          offsetY = 0;
          syncScheduleFromInputs({ forcePhase: true });
          rebuildReelVisual();
        }

        btnClose.addEventListener("click", closeCollect);
        btnStart.addEventListener("click", startSpin);
        btnStop.addEventListener("click", stopSpin);
        btnReset.addEventListener("click", resetAll);
        [startInput, endInput, collectInput].forEach((el) => {
          if (!el) return;
          el.addEventListener("change", () => {
            if (phase === "spin" || phase === "stop" || phase === "win") return;
            syncScheduleFromInputs({ forcePhase: true });
          });
        });

        function timerTick() {
          const now = Date.now();
          if (phase === "wait") {
            const startMs = windowStart ? windowStart.getTime() : now;
            const left = startMs - now;
            timerLabel.textContent = left > 0 ? formatRemain(left) : "0";
            if (left <= 0) {
              if (windowEnd && now >= windowEnd.getTime()) {
                setPhase("ready");
                timerLabel.textContent = "0";
              } else {
                setPhase("collect");
                collectEndsAt = windowEnd ? windowEnd.getTime() : null;
              }
            }
            return;
          }
          if (phase !== "collect") return;
          if (collectEndsAt == null) {
            timerLabel.textContent = "—";
            return;
          }
          const left = collectEndsAt - now;
          timerLabel.textContent = left > 0 ? formatRemain(left) : "0";
          if (left <= 0) closeCollect();
        }
        setInterval(timerTick, 200);
        syncScheduleFromInputs({ forcePhase: true });
        timerTick();
        rebuildReelVisual();

        async function refreshSharedLiveOverride() {
          if (!window.MyObsYtLiveSync) return;
          try {
            const cur = await MyObsYtLiveSync.fetchSharedYtLive();
            const id = cur && cur.videoId;
            if (id && /^[\w-]{11}$/.test(id)) sharedOverrideVideoId = id;
          } catch (_) {}
        }

        function connectTwitch() {
          if (!wantTw || !twitchLogins.length) return;
          const nick = `justinfan${Math.floor(10000 + Math.random() * 80000)}`;
          let ws;
          let retry = 0;
          function connect() {
            ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
            ws.addEventListener("open", () => {
              ws.send("PASS SCHMOOPIIE");
              ws.send(`NICK ${nick}`);
              ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
              twitchLogins.forEach((login) => ws.send(`JOIN #${login}`));
            });
            ws.addEventListener("message", (ev) => {
              String(ev.data || "")
                .split("\r\n")
                .forEach((line) => {
                  if (!line) return;
                  if (line.startsWith("PING")) {
                    ws.send("PONG :tmi.twitch.tv");
                    return;
                  }
                  const joinM = line.match(/ JOIN #([^\s]+)/i);
                  if (joinM) {
                    twConnected.add(joinM[1].toLowerCase());
                    refreshStatus();
                  }
                  const m = line.match(
                    /^(?:@([^ ]+) )?(?::([^ ]+) )?PRIVMSG #([^ ]+) :(.*)$/
                  );
                  if (!m) return;
                  const tags =
                    window.ObsChatEmote && ObsChatEmote.parseIrcTags
                      ? ObsChatEmote.parseIrcTags(m[1] || "")
                      : {};
                  const badges = parseTwitchBadges(tags.badges || "");
                  const login = (
                    tags.login ||
                    (m[2] || "").split("!")[0] ||
                    ""
                  ).toLowerCase();
                  const user =
                    decodeURIComponent(
                      (tags["display-name"] || "").replace(/\\s/g, " ")
                    ) ||
                    login ||
                    "twitch";
                  const channelLogin = String(m[3] || "")
                    .replace(/^#/, "")
                    .toLowerCase();
                  ingestChatMessage({
                    platform: "tw",
                    user,
                    login,
                    channelLogin,
                    text: m[4],
                    isVip: badges.isVip,
                    isMod: badges.isMod,
                    isSub: badges.isSub,
                    isOwner: badges.isOwner,
                  });
                });
            });
            ws.addEventListener("close", () => {
              twConnected.clear();
              refreshStatus();
              retry = Math.min(retry + 1, 6);
              setTimeout(connect, 1000 * retry);
            });
            ws.addEventListener("error", () => {
              try {
                ws.close();
              } catch (_) {}
            });
          }
          connect();
        }

        async function ytFetchJson(url, label) {
          const res = await fetch(url);
          if (!res.ok) throw new Error((label || "yt") + " " + res.status);
          return res.json();
        }

        async function resolveLiveVideoId(channelRaw) {
          await refreshSharedLiveOverride();
          if (sharedOverrideVideoId) return sharedOverrideVideoId;
          const raw = String(channelRaw || "").trim();
          if (!raw || !ytKey) return "";
          let channelId = raw;
          if (!/^UC[\w-]{20,}$/i.test(raw)) {
            if (raw.startsWith("@")) {
              const url = `${YT_API}/channels?part=id&forHandle=${encodeURIComponent(
                raw.slice(1)
              )}&key=${encodeURIComponent(ytKey)}`;
              const json = await ytFetchJson(url, "yt handle");
              channelId = json?.items?.[0]?.id || "";
            } else {
              const url = `${YT_API}/search?part=snippet&type=channel&maxResults=1&q=${encodeURIComponent(
                raw
              )}&key=${encodeURIComponent(ytKey)}`;
              const json = await ytFetchJson(url, "yt search ch");
              channelId = json?.items?.[0]?.snippet?.channelId || "";
            }
          }
          if (!channelId) return "";
          const liveUrl = `${YT_API}/search?part=snippet&channelId=${encodeURIComponent(
            channelId
          )}&eventType=live&type=video&maxResults=1&key=${encodeURIComponent(ytKey)}`;
          const liveJson = await ytFetchJson(liveUrl, "yt live");
          return liveJson?.items?.[0]?.id?.videoId || "";
        }

        async function resolveLiveChatId(videoId) {
          const url = `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
            videoId
          )}&key=${encodeURIComponent(ytKey)}`;
          const json = await ytFetchJson(url, "yt videos");
          const details = json?.items?.[0]?.liveStreamingDetails;
          if (!details || details.actualEndTime) return null;
          return details.activeLiveChatId || null;
        }

        function pollOneYoutubeApi(job) {
          let videoId = null;
          let chatId = null;
          let pageToken = "";
          let seen = new Set();
          let fail = 0;
          async function ensureChat() {
            videoId = await job.getVideoId();
            if (!videoId) throw new Error("yt offline");
            chatId = await resolveLiveChatId(videoId);
            if (!chatId) throw new Error("yt no live chat");
            ytConnected.add(job.key);
            refreshStatus();
            fail = 0;
          }
          async function tick() {
            try {
              if (!chatId) await ensureChat();
              const url = new URL(`${YT_API}/liveChat/messages`);
              url.searchParams.set("liveChatId", chatId);
              url.searchParams.set("part", "snippet,authorDetails");
              url.searchParams.set("maxResults", "40");
              url.searchParams.set("key", ytKey);
              if (pageToken) url.searchParams.set("pageToken", pageToken);
              const res = await fetch(url);
              if (!res.ok) {
                if (res.status === 403 || res.status === 404) {
                  chatId = null;
                  pageToken = "";
                  ytConnected.delete(job.key);
                  refreshStatus();
                }
                throw new Error("yt chat " + res.status);
              }
              const json = await res.json();
              pageToken = json.nextPageToken || pageToken;
              const wait = Math.max(2500, Number(json.pollingIntervalMillis || 5000));
              (json.items || []).forEach((item) => {
                const id = item.id;
                if (!id || seen.has(id)) return;
                seen.add(id);
                if (seen.size > 800) seen = new Set(Array.from(seen).slice(-300));
                const text =
                  item.snippet?.displayMessage ||
                  item.snippet?.textMessageDetails?.messageText ||
                  "";
                const user = item.authorDetails?.displayName || "youtube";
                ingestChatMessage({
                  platform: "yt",
                  user,
                  channelId: item.authorDetails?.channelId || "",
                  text,
                  isMod: !!item.authorDetails?.isChatModerator,
                  isSub: !!item.authorDetails?.isChatSponsor,
                  isOwner: !!item.authorDetails?.isChatOwner,
                  isVip: false,
                  isFollow: false,
                });
              });
              setTimeout(tick, wait);
            } catch (err) {
              console.warn(err);
              ytConnected.delete(job.key);
              refreshStatus();
              fail += 1;
              chatId = fail >= 3 ? null : chatId;
              setTimeout(tick, Math.min(15000, 3000 * fail));
            }
          }
          tick();
        }

        function pollYoutube() {
          if (!wantYt) return;
          if (ytChatWeb && window.ObsYtChatWeb) {
            const jobs = [];
            ytVideoIds.forEach((vid, idx) => {
              jobs.push({
                key: "vid:" + vid,
                label: vid,
                channel: "",
                getVideoId: async () => {
                  if (idx === 0) {
                    await refreshSharedLiveOverride();
                    if (sharedOverrideVideoId) return sharedOverrideVideoId;
                  }
                  return vid;
                },
              });
            });
            ytChannels.forEach((ch) => {
              jobs.push({
                key: "ch:" + ch.toLowerCase(),
                label: ch,
                channel: ch,
                getVideoId: async () => {
                  await refreshSharedLiveOverride();
                  if (sharedOverrideVideoId) return sharedOverrideVideoId;
                  if (ytKey) {
                    try {
                      return await resolveLiveVideoId(ch);
                    } catch (_) {}
                  }
                  return "";
                },
              });
            });
            jobs.forEach((job) => {
              ObsYtChatWeb.startPoll({
                label: job.label,
                channel: job.channel,
                getVideoId: job.getVideoId,
                addMessage: ingestChatMessage,
                onStatus: (ok) => {
                  if (ok) ytConnected.add(job.key);
                  else ytConnected.delete(job.key);
                  refreshStatus();
                },
              });
            });
            return;
          }
          if (!ytKey && !ytVideoIds.length) return;
          const jobs = [];
          ytVideoIds.forEach((vid, idx) => {
            jobs.push({
              key: "vid:" + vid,
              getVideoId: async () => {
                if (idx === 0) {
                  await refreshSharedLiveOverride();
                  if (sharedOverrideVideoId) return sharedOverrideVideoId;
                }
                return vid;
              },
            });
          });
          ytChannels.forEach((ch) => {
            jobs.push({
              key: "ch:" + ch.toLowerCase(),
              getVideoId: async () => resolveLiveVideoId(ch),
            });
          });
          jobs.forEach(pollOneYoutubeApi);
        }

        function startDemo() {
          const pool = [
            { platform: "tw", user: "NightOwl", login: "nightowl", text: "抽我 " + (keyword || "參加"), isVip: true, isSub: true },
            { platform: "tw", user: "Tea", login: "tea", text: "我要抽 " + (keyword || "!join"), isSub: true },
            { platform: "tw", user: "BoxBox", login: "boxbox", text: keyword || "參加抽籤", isMod: true },
            { platform: "yt", user: "貓奴", text: keyword || "抽獎", isSub: true },
            { platform: "yt", user: "小白", text: "我 " + (keyword || "in") },
            { platform: "tw", user: "拉基粉絲A", login: "fan_a", text: keyword || "＋１", isVip: true },
            { platform: "tw", user: "StreamerFan", login: "sfan", text: keyword || "here", isSub: true },
            { platform: "yt", user: "YT觀眾1", text: keyword || "抽" },
            { platform: "tw", user: "LuckySeven", login: "lucky7", text: keyword || "go", isSub: true, isVip: true },
            { platform: "tw", user: "ModChi", login: "modchi", text: keyword || "ok", isMod: true, isSub: true },
          ];
          let i = 0;
          const push = () => {
            if (phase !== "collect") return;
            ingestChatMessage(pool[i % pool.length]);
            i += 1;
          };
          for (let n = 0; n < 4; n++) setTimeout(push, n * 400);
          setInterval(push, 900);
        }

        refreshStatus();
        if (demo) startDemo();
        else {
          connectTwitch();
          pollYoutube();
        }
      })();
    </script>
