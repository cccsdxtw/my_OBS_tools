<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS Overlay</title>
    <style>
      :root {
        --bg: rgba(0, 0, 0, 0.45);
        --fg: rgba(255, 255, 255, 0.85);
        --muted: rgba(255, 255, 255, 0.55);
        --size: 22px;
        --pad-x: 10px;
        --gap: 14px;
        --radius: 0;
        --font: "JetBrains Mono", "Cascadia Mono", "Consolas", "Courier New",
          monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: var(--font);
        color: var(--fg);
      }

      #bar {
        display: inline-flex;
        align-items: center;
        gap: var(--gap);
        min-height: calc(var(--size) + 12px);
        padding: 6px var(--pad-x);
        background: var(--bg);
        border-radius: var(--radius);
        white-space: nowrap;
        line-height: 1;
        overflow: visible;
      }

      .mod {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: var(--size);
        font-weight: 500;
        overflow: visible;
      }

      .mod[hidden] {
        display: none !important;
      }

      .icon {
        width: var(--size);
        height: var(--size);
        opacity: 0.85;
        flex: 0 0 auto;
        overflow: visible;
        display: block;
      }

      .flag-icon {
        width: calc(var(--size) * 1.15);
        height: calc(var(--size) * 0.82);
        object-fit: cover;
        border-radius: 2px;
        flex: 0 0 auto;
        display: block;
      }

      .label,
      .value {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: var(--size);
        line-height: 1;
      }

      .label {
        color: var(--muted);
        font-size: calc(var(--size) * 0.78);
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .value {
        font-variant-numeric: tabular-nums;
      }

      .error {
        color: #ff8f8f;
      }
    </style>
  </head>
  <body>
    <div id="bar" aria-live="polite">
      <section class="mod" id="mod-viewers" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
          />
        </svg>
        <span class="value" id="viewers">—</span>
      </section>

      <section class="mod" id="mod-uptime" hidden title="已開台時間">
        <!-- 直播訊號圖標（與時鐘區隔） -->
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm0 3.5c-1.4 0-2.7-.5-3.7-1.3l-1.4 1.4A7.9 7.9 0 0 0 12 20a7.9 7.9 0 0 0 5.1-1.9l-1.4-1.4A5.4 5.4 0 0 1 12 18zm0-12c1.4 0 2.7.5 3.7 1.3l1.4-1.4A7.9 7.9 0 0 0 12 4a7.9 7.9 0 0 0-5.1 1.9l1.4 1.4A5.4 5.4 0 0 1 12 6zm7.1 2.2-1.4 1.4A5.4 5.4 0 0 1 19 12a5.4 5.4 0 0 1-1.3 3.4l1.4 1.4A7.9 7.9 0 0 0 21 12a7.9 7.9 0 0 0-1.9-3.8zM4.9 8.2A7.9 7.9 0 0 0 3 12a7.9 7.9 0 0 0 1.9 3.8l1.4-1.4A5.4 5.4 0 0 1 5 12c0-1.3.5-2.5 1.3-3.4L4.9 8.2z"
          />
        </svg>
        <span class="value" id="uptime">00:00:00</span>
      </section>

      <section class="mod" id="mod-date" hidden>
        <!-- 日曆內縮，避免掛環被裁切 -->
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M8 3.25h1.5v1.5h5V3.25H16v1.5h2.25A1.75 1.75 0 0 1 20 6.5v12.25A1.75 1.75 0 0 1 18.25 20.5H5.75A1.75 1.75 0 0 1 4 18.75V6.5A1.75 1.75 0 0 1 5.75 4.75H8V3.25zM5.5 9.25h13v9.25H5.5V9.25z"
          />
        </svg>
        <span class="value" id="date"></span>
      </section>

      <section class="mod" id="mod-time" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5A8.51 8.51 0 0 0 12 3.5zm.75 4.25h-1.5v5.1l4.2 2.45.75-1.3-3.45-2V7.75z"
          />
        </svg>
        <span class="value" id="time"></span>
      </section>

      <section class="mod" id="mod-tz" hidden title="時區／地區">
        <img class="flag-icon" id="flag" alt="" hidden />
        <span class="value" id="tz" hidden></span>
      </section>

      <!-- 倒計時已獨立成 countdown.html，可另開 OBS 瀏覽器來源分開放 -->
    </div>

    <script>
      (() => {
        const TWITCH_GQL = "https://gql.twitch.tv/gql";
        // Twitch web Client-ID：公開、免登入，用來讀公開實況資料（人數 / 開台時間）
        const TWITCH_WEB_CLIENT_ID = "kimne78kx3ncx6brgo4mv6wki5h1ko";
        const DECAPI_VIEWERS = (login) =>
          `https://decapi.me/twitch/viewercount/${encodeURIComponent(login)}`;
        const DECAPI_UPTIME = (login) =>
          `https://decapi.me/twitch/uptime/${encodeURIComponent(login)}`;
        const POLL_MS = 15000;

        const params = new URLSearchParams(location.search);

        function flag(name, fallback = false) {
          if (!params.has(name)) return fallback;
          const v = params.get(name);
          return !(v === "0" || v === "false" || v === "off" || v === "no");
        }

        function cssVar(name, value) {
          if (value) document.documentElement.style.setProperty(name, value);
        }

        const channel = (
          params.get("login") ||
          params.get("channel") ||
          ""
        ).trim();
        const tz =
          params.get("tz") ||
          Intl.DateTimeFormat().resolvedOptions().timeZone ||
          "UTC";
        const dateFmt = params.get("dateFormat") || "MM/DD ddd";
        const timeFmt = params.get("timeFormat") || "HH:mm:ss";
        const viewersSource = (params.get("viewersSource") || "auto").toLowerCase();
        const streamlabsToken = (params.get("streamlabsToken") || "").trim();

        // 沒填頻道時即使勾選也不顯示人數 / 開台時間（避免空白 ERR）
        const showViewers = !!channel && flag("vc", true);
        const showUptime = !!channel && flag("st", true);
        const showDate = flag("date", true);
        const showTime = flag("time", true);
        // showTz / flag：顯示國旗（不再顯示 Asia/Taipei 文字）
        const flagCodeParam = (params.get("flag") || "").trim().toLowerCase();
        const showTz =
          flag("showTz", !!flagCodeParam) || flag("flag", !!flagCodeParam);

        const TZ_TO_FLAG = {
          "Asia/Taipei": "tw",
          "Asia/Tokyo": "jp",
          "Asia/Hong_Kong": "hk",
          "Asia/Shanghai": "cn",
          "Asia/Singapore": "sg",
          "Asia/Seoul": "kr",
          "Asia/Bangkok": "th",
          "Asia/Jakarta": "id",
          "Asia/Manila": "ph",
          "Australia/Sydney": "au",
          "Pacific/Auckland": "nz",
          "Europe/London": "gb",
          "Europe/Paris": "fr",
          "Europe/Berlin": "de",
          "America/New_York": "us",
          "America/Chicago": "us",
          "America/Denver": "us",
          "America/Los_Angeles": "us",
          "America/Toronto": "ca",
          UTC: "un",
        };

        cssVar("--size", params.get("fontSize") ? `${params.get("fontSize")}px` : "");
        cssVar("--fg", params.get("color"));
        cssVar("--bg", params.get("bg"));
        cssVar("--gap", params.get("gap") ? `${params.get("gap")}px` : "");
        cssVar("--radius", params.get("radius") ? `${params.get("radius")}px` : "");

        const els = {
          viewersMod: document.getElementById("mod-viewers"),
          uptimeMod: document.getElementById("mod-uptime"),
          dateMod: document.getElementById("mod-date"),
          timeMod: document.getElementById("mod-time"),
          tzMod: document.getElementById("mod-tz"),
          viewers: document.getElementById("viewers"),
          uptime: document.getElementById("uptime"),
          date: document.getElementById("date"),
          time: document.getElementById("time"),
          tz: document.getElementById("tz"),
        };

        els.viewersMod.hidden = !showViewers;
        els.uptimeMod.hidden = !showUptime;
        els.dateMod.hidden = !showDate;
        els.timeMod.hidden = !showTime;
        els.tzMod.hidden = !showTz;

        const flagEl = document.getElementById("flag");
        const flagCode =
          (flagCodeParam || TZ_TO_FLAG[tz] || "").replace(/[^a-z]/g, "").slice(0, 2);
        if (showTz && flagCode) {
          flagEl.hidden = false;
          flagEl.alt = flagCode.toUpperCase();
          flagEl.src = `https://flagcdn.com/h20/${flagCode}.png`;
          flagEl.srcset = `https://flagcdn.com/h40/${flagCode}.png 2x`;
          els.tz.hidden = true;
        } else if (showTz) {
          // 找不到對應國旗時才退回文字
          flagEl.hidden = true;
          els.tz.hidden = false;
          els.tz.textContent = tz;
        }

        let startedAt = null;

        function pad(n) {
          return String(Math.max(0, Math.floor(n))).padStart(2, "0");
        }

        function formatHMS(totalSeconds) {
          const s = Math.max(0, Math.floor(totalSeconds));
          const h = Math.floor(s / 3600);
          const m = Math.floor((s % 3600) / 60);
          const sec = s % 60;
          return `${pad(h)}:${pad(m)}:${pad(sec)}`;
        }

        // 簡易 format：支援 YYYY MM DD HH mm ss ddd/dddd 與常見分隔
        // ddd=週一、dddd=星期一（固定繁中）
        const WEEKDAY_SHORT = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
        const WEEKDAY_LONG = [
          "星期日",
          "星期一",
          "星期二",
          "星期三",
          "星期四",
          "星期五",
          "星期六",
        ];

        function weekdayIndexInTz(date, timeZone) {
          const wd = new Intl.DateTimeFormat("en-US", {
            timeZone,
            weekday: "short",
          }).format(date);
          const map = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
          return map[wd] ?? date.getDay();
        }

        function formatInTz(date, pattern, timeZone) {
          const dtf = new Intl.DateTimeFormat("en-US", {
            timeZone,
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
            hourCycle: "h23",
          });
          const parts = Object.fromEntries(
            dtf.formatToParts(date).map((p) => [p.type, p.value])
          );
          // en-US 偶爾給 24:xx，正規化
          const hour = parts.hour === "24" ? "00" : parts.hour;
          const wi = weekdayIndexInTz(date, timeZone);
          const map = {
            YYYY: parts.year,
            YY: parts.year.slice(-2),
            MM: parts.month,
            DD: parts.day,
            HH: hour,
            mm: parts.minute,
            ss: parts.second,
            dddd: WEEKDAY_LONG[wi],
            ddd: WEEKDAY_SHORT[wi],
            Z: timeZone,
          };
          return pattern.replace(
            /YYYY|YY|MM|DD|HH|mm|ss|dddd|ddd|Z/g,
            (token) => map[token] ?? token
          );
        }

        function tickClock() {
          const now = new Date();
          if (showDate) els.date.textContent = formatInTz(now, dateFmt, tz);
          if (showTime) els.time.textContent = formatInTz(now, timeFmt, tz);
          if (showUptime) {
            if (startedAt) {
              els.uptime.classList.remove("error");
              els.uptime.textContent = formatHMS((now - startedAt) / 1000);
            }
          }
        }

        function parseDecapiUptime(text) {
          if (!text || /offline|not live|is offline/i.test(text)) return null;
          const re =
            /(?:(\d+)\s*days?)?(?:,?\s*)?(?:(\d+)\s*hours?)?(?:,?\s*)?(?:(\d+)\s*minutes?)?(?:,?\s*)?(?:(\d+)\s*seconds?)?/i;
          const m = text.trim().match(re);
          if (!m || (!m[1] && !m[2] && !m[3] && !m[4])) return null;
          const days = Number(m[1] || 0);
          const hours = Number(m[2] || 0);
          const minutes = Number(m[3] || 0);
          const seconds = Number(m[4] || 0);
          const ms =
            (((days * 24 + hours) * 60 + minutes) * 60 + seconds) * 1000;
          return new Date(Date.now() - ms);
        }

        async function fetchGql() {
          const query = {
            query: `query($login:String!){user(login:$login){stream{viewersCount createdAt}}}`,
            variables: { login: channel },
          };
          const res = await fetch(TWITCH_GQL, {
            method: "POST",
            headers: {
              "Client-ID": TWITCH_WEB_CLIENT_ID,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(query),
          });
          if (!res.ok) throw new Error(`gql ${res.status}`);
          const json = await res.json();
          const stream = json?.data?.user?.stream;
          if (!stream) {
            return { live: false, viewers: 0, startedAt: null };
          }
          return {
            live: true,
            viewers: stream.viewersCount ?? 0,
            startedAt: stream.createdAt ? new Date(stream.createdAt) : null,
          };
        }

        async function fetchDecapi() {
          const tasks = [];
          if (showViewers) tasks.push(fetch(DECAPI_VIEWERS(channel)).then((r) => r.text()));
          else tasks.push(Promise.resolve(null));
          if (showUptime) tasks.push(fetch(DECAPI_UPTIME(channel)).then((r) => r.text()));
          else tasks.push(Promise.resolve(null));
          const [viewersText, uptimeText] = await Promise.all(tasks);
          let viewers = 0;
          let live = false;
          let start = null;
          if (viewersText != null) {
            const raw = String(viewersText).trim();
            if (/offline/i.test(raw)) {
              live = false;
              viewers = 0;
            } else {
              const n = parseInt(raw, 10);
              if (!Number.isNaN(n)) {
                viewers = n;
                live = true;
              }
            }
          }
          if (uptimeText) {
            if (/offline/i.test(uptimeText)) {
              live = false;
              start = null;
            } else {
              start = parseDecapiUptime(uptimeText);
              if (start) live = true;
            }
          }
          return { live, viewers, startedAt: start };
        }

        async function fetchStreamlabsViewers() {
          // Streamlabs widget 是完整頁面，無法穩定解析人數；保留參數提示用。
          throw new Error("streamlabs-embed-only");
        }

        async function refreshStream() {
          if (!channel || (!showViewers && !showUptime)) return;
          try {
            let data;
            if (viewersSource === "decapi") data = await fetchDecapi();
            else if (viewersSource === "streamlabs") {
              await fetchStreamlabsViewers();
            } else {
              try {
                data = await fetchGql();
              } catch (e) {
                console.warn("GQL failed, fallback DecAPI", e);
                data = await fetchDecapi();
              }
            }

            if (showViewers) {
              els.viewers.classList.remove("error");
              els.viewers.textContent = data.live ? String(data.viewers) : "0";
            }
            if (showUptime) {
              if (data.live && data.startedAt) {
                startedAt = data.startedAt;
                els.uptime.classList.remove("error");
              } else {
                startedAt = null;
                els.uptime.textContent = "00:00:00";
              }
            }
          } catch (err) {
            console.error(err);
            if (showViewers) {
              els.viewers.classList.add("error");
              els.viewers.textContent = "ERR";
            }
            if (showUptime) {
              els.uptime.classList.add("error");
              els.uptime.textContent = "ERR";
            }
          }
        }

        tickClock();
        setInterval(tickClock, 250);
        refreshStream();
        setInterval(refreshStream, POLL_MS);

        // 未使用的 Streamlabs token：在 console 提示改用免驗證來源
        if (streamlabsToken) {
          console.info(
            "[my_OBS_tools] Streamlabs token 已記錄。建議改用免驗證人數來源（預設 auto/GQL）。若仍要用 Streamlabs，請另開瀏覽器來源貼上其 widget 網址。"
          );
        }
      })();
    </script>
  </body>
</html>
