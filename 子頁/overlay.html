<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script src="../material-icons.js"></script>
    <style>
      :root {
        --bg: rgba(0, 0, 0, 0.45);
        --fg: rgba(255, 255, 255, 0.85);
        --icon: var(--fg);
        --muted: rgba(255, 255, 255, 0.7);
        --size: 22px;
        --bar-h: calc(var(--size) + 16px);
        --pad-x: 12px;
        --gap: 14px;
        --radius: 0;
        --font-zh: "IBM Plex Sans TC", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
        --font-num: "JetBrains Mono", "Cascadia Mono", "Consolas", "Courier New",
          monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        color: var(--fg);
      }

      #bar {
        display: inline-flex;
        align-items: center;
        gap: var(--gap);
        height: var(--bar-h);
        padding: 0 var(--pad-x);
        background: var(--bg);
        border-radius: var(--radius);
        white-space: nowrap;
        line-height: 1;
        overflow: hidden;
        font-family: var(--font-num);
      }

      .mod {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: var(--size);
        font-weight: 500;
      }

      .mod[hidden] {
        display: none !important;
      }

      .icon {
        width: calc(var(--size) * 0.92);
        height: calc(var(--size) * 0.92);
        opacity: 0.9;
        flex: 0 0 auto;
        display: block;
      }

      .material-symbols-outlined.icon {
        width: auto;
        height: auto;
        font-size: calc(var(--size) * 0.95);
        line-height: 1;
        color: var(--icon);
        font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
        user-select: none;
      }

      img.custom-icon.icon {
        width: calc(var(--size) * 0.92);
        height: calc(var(--size) * 0.92);
        object-fit: contain;
      }

      .flag-icon {
        width: calc(var(--size) * 1.15);
        height: calc(var(--size) * 0.82);
        object-fit: cover;
        border-radius: 2px;
        flex: 0 0 auto;
        display: block;
      }

      .label,
      .value {
        display: flex;
        align-items: center;
        height: var(--size);
        margin: 0;
        padding: 0;
        line-height: 1;
      }

      .label {
        color: var(--muted);
        font-family: var(--font-zh);
        font-size: calc(var(--size) * 0.78);
        font-weight: 600;
        letter-spacing: 0.02em;
        transform: translateY(0.06em);
      }

      .value {
        font-family: var(--font-num);
        font-variant-numeric: tabular-nums;
        transform: translateY(0.02em);
      }

      .error {
        color: #ff8f8f;
      }
    </style>
  </head>
  <body>
    <div id="bar" aria-live="polite">
      <section class="mod" id="mod-viewers" hidden>
        <span class="material-symbols-outlined icon" data-ms-default="visibility" aria-hidden="true"
          >visibility</span
        >
        <span class="value" id="viewers">—</span>
      </section>

      <section class="mod" id="mod-uptime" hidden title="已開台時間">
        <span class="material-symbols-outlined icon" data-ms-default="videocam" aria-hidden="true"
          >videocam</span
        >
        <span class="value" id="uptime">00:00:00</span>
      </section>

      <section class="mod" id="mod-date" hidden>
        <span class="material-symbols-outlined icon" data-ms-default="calendar_month" aria-hidden="true"
          >calendar_month</span
        >
        <span class="value" id="date"></span>
      </section>

      <section class="mod" id="mod-time" hidden>
        <span class="material-symbols-outlined icon" data-ms-default="schedule" aria-hidden="true"
          >schedule</span
        >
        <span class="value" id="time"></span>
      </section>

      <section class="mod" id="mod-tz" hidden title="時區／地區">
        <img class="flag-icon" id="flag" alt="" hidden />
        <span class="value" id="tz" hidden></span>
      </section>

      <!-- 倒計時已獨立成 countdown.html，可另開 OBS 瀏覽器來源分開放 -->
    </div>

    <script>
      (() => {
        const TWITCH_GQL = "https://gql.twitch.tv/gql";
        // Twitch web Client-ID：公開、免登入，用來讀公開實況資料（人數 / 開台時間）
        const TWITCH_WEB_CLIENT_ID = "kimne78kx3ncx6brgo4mv6wki5h1ko";
        const DECAPI_VIEWERS = (login) =>
          `https://decapi.me/twitch/viewercount/${encodeURIComponent(login)}`;
        const DECAPI_UPTIME = (login) =>
          `https://decapi.me/twitch/uptime/${encodeURIComponent(login)}`;
        const POLL_MS = 15000;

        const params = new URLSearchParams(location.search);

        function flag(name, fallback = false) {
          if (!params.has(name)) return fallback;
          const v = params.get(name);
          return !(v === "0" || v === "false" || v === "off" || v === "no");
        }

        function normalizeMsName(raw) {
          return String(raw || "")
            .trim()
            .replace(/([a-z0-9])([A-Z])/g, "$1_$2")
            .replace(/[\s-]+/g, "_")
            .toLowerCase()
            .replace(/[^a-z0-9_]/g, "");
        }

        function isUrlIcon(raw) {
          const s = String(raw || "").trim();
          return /^https?:\/\//i.test(s) || /\.(png|svg|webp|gif|jpe?g)(\?|#|$)/i.test(s);
        }

        function applyIcon(modId, rawParam, fallback) {
          const mod = document.getElementById(modId);
          if (!mod) return fallback;
          const raw = (rawParam || "").trim() || fallback;
          let iconEl = mod.querySelector(".icon, .custom-icon, .material-symbols-outlined");
          if (isUrlIcon(raw)) {
            if (!iconEl || iconEl.tagName !== "IMG") {
              const img = document.createElement("img");
              img.className = "custom-icon icon";
              img.alt = "";
              img.referrerPolicy = "no-referrer";
              if (iconEl) iconEl.replaceWith(img);
              else mod.insertBefore(img, mod.firstChild);
              iconEl = img;
            }
            iconEl.src = raw;
            return null;
          }
          const name = normalizeMsName(raw) || fallback;
          if (!iconEl || !iconEl.classList.contains("material-symbols-outlined")) {
            const span = document.createElement("span");
            span.className = "material-symbols-outlined icon";
            span.setAttribute("aria-hidden", "true");
            if (iconEl) iconEl.replaceWith(span);
            else mod.insertBefore(span, mod.firstChild);
            iconEl = span;
          }
          iconEl.textContent = name;
          return name;
        }

        const usedMs = [
          applyIcon("mod-viewers", params.get("vcIcon") || params.get("iconVc"), "visibility"),
          applyIcon("mod-uptime", params.get("stIcon") || params.get("iconSt"), "videocam"),
          applyIcon("mod-date", params.get("dateIcon") || params.get("iconDate"), "calendar_month"),
          applyIcon("mod-time", params.get("timeIcon") || params.get("iconTime"), "schedule"),
        ].filter(Boolean);
        if (window.MyObsMaterialIcons && usedMs.length) {
          window.MyObsMaterialIcons.ensureMaterialSymbols(usedMs);
        }

        function cssVar(name, value) {
          if (value) document.documentElement.style.setProperty(name, value);
        }

        const channel = (
          params.get("login") ||
          params.get("channel") ||
          ""
        ).trim();
        const tz =
          params.get("tz") ||
          Intl.DateTimeFormat().resolvedOptions().timeZone ||
          "UTC";
        const dateFmt = params.get("dateFormat") || "MM/DD ddd";
        const timeFmt = params.get("timeFormat") || "HH:mm:ss";
        const viewersSource = (params.get("viewersSource") || "auto").toLowerCase();
        const streamlabsToken = (params.get("streamlabsToken") || "").trim();

        // 沒填頻道時即使勾選也不顯示人數 / 開台時間（避免空白 ERR）
        const showViewers = !!channel && flag("vc", true);
        const showUptime = !!channel && flag("st", true);
        const showDate = flag("date", true);
        const showTime = flag("time", true);
        // showTz / flag：顯示國旗（不再顯示 Asia/Taipei 文字）
        const flagCodeParam = (params.get("flag") || "").trim().toLowerCase();
        const showTz =
          flag("showTz", !!flagCodeParam) || flag("flag", !!flagCodeParam);

        const TZ_TO_FLAG = {
          "Asia/Taipei": "tw",
          "Asia/Tokyo": "jp",
          "Asia/Hong_Kong": "hk",
          "Asia/Shanghai": "cn",
          "Asia/Singapore": "sg",
          "Asia/Seoul": "kr",
          "Asia/Bangkok": "th",
          "Asia/Jakarta": "id",
          "Asia/Manila": "ph",
          "Australia/Sydney": "au",
          "Pacific/Auckland": "nz",
          "Europe/London": "gb",
          "Europe/Paris": "fr",
          "Europe/Berlin": "de",
          "America/New_York": "us",
          "America/Chicago": "us",
          "America/Denver": "us",
          "America/Los_Angeles": "us",
          "America/Toronto": "ca",
          UTC: "un",
        };

        cssVar("--size", params.get("fontSize") ? `${params.get("fontSize")}px` : "");
        cssVar("--fg", params.get("color"));
        cssVar("--icon", params.get("iconColor") || params.get("iconColour"));
        const bgParam = (params.get("bg") || "").trim();
        if (!bgParam || bgParam === "0" || bgParam === "false" || bgParam === "none" || bgParam === "off") {
          cssVar("--bg", "transparent");
        } else {
          cssVar("--bg", bgParam);
        }
        cssVar("--gap", params.get("gap") ? `${params.get("gap")}px` : "");
        cssVar("--radius", params.get("radius") ? `${params.get("radius")}px` : "");

        const els = {
          viewersMod: document.getElementById("mod-viewers"),
          uptimeMod: document.getElementById("mod-uptime"),
          dateMod: document.getElementById("mod-date"),
          timeMod: document.getElementById("mod-time"),
          tzMod: document.getElementById("mod-tz"),
          viewers: document.getElementById("viewers"),
          uptime: document.getElementById("uptime"),
          date: document.getElementById("date"),
          time: document.getElementById("time"),
          tz: document.getElementById("tz"),
        };

        els.viewersMod.hidden = !showViewers;
        els.uptimeMod.hidden = !showUptime;
        els.dateMod.hidden = !showDate;
        els.timeMod.hidden = !showTime;
        els.tzMod.hidden = !showTz;

        // order=vc,st,date,time,showTz → 資訊條由左到右
        const MOD_IDS = {
          vc: "mod-viewers",
          st: "mod-uptime",
          date: "mod-date",
          time: "mod-time",
          showTz: "mod-tz",
        };
        const DEFAULT_ORDER = ["vc", "st", "date", "time", "showTz"];
        const orderRaw = (params.get("order") || "").split(",").map((s) => s.trim()).filter(Boolean);
        const order = [];
        orderRaw.forEach((k) => {
          if (MOD_IDS[k] && !order.includes(k)) order.push(k);
        });
        DEFAULT_ORDER.forEach((k) => {
          if (!order.includes(k)) order.push(k);
        });
        const bar = document.getElementById("bar");
        order.forEach((k) => {
          const el = document.getElementById(MOD_IDS[k]);
          if (el) bar.appendChild(el);
        });

        const flagEl = document.getElementById("flag");
        const flagCode =
          (flagCodeParam || TZ_TO_FLAG[tz] || "").replace(/[^a-z]/g, "").slice(0, 2);
        if (showTz && flagCode) {
          flagEl.hidden = false;
          flagEl.alt = flagCode.toUpperCase();
          flagEl.src = `https://flagcdn.com/h20/${flagCode}.png`;
          flagEl.srcset = `https://flagcdn.com/h40/${flagCode}.png 2x`;
          els.tz.hidden = true;
        } else if (showTz) {
          // 找不到對應國旗時才退回文字
          flagEl.hidden = true;
          els.tz.hidden = false;
          els.tz.textContent = tz;
        }

        let startedAt = null;

        function pad(n) {
          return String(Math.max(0, Math.floor(n))).padStart(2, "0");
        }

        function formatHMS(totalSeconds) {
          const s = Math.max(0, Math.floor(totalSeconds));
          const h = Math.floor(s / 3600);
          const m = Math.floor((s % 3600) / 60);
          const sec = s % 60;
          return `${pad(h)}:${pad(m)}:${pad(sec)}`;
        }

        // 簡易 format：支援 YYYY MM DD HH mm ss ddd/dddd 與常見分隔
        // ddd=週一、dddd=星期一（固定繁中）
        const WEEKDAY_SHORT = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
        const WEEKDAY_LONG = [
          "星期日",
          "星期一",
          "星期二",
          "星期三",
          "星期四",
          "星期五",
          "星期六",
        ];

        function weekdayIndexInTz(date, timeZone) {
          const wd = new Intl.DateTimeFormat("en-US", {
            timeZone,
            weekday: "short",
          }).format(date);
          const map = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
          return map[wd] ?? date.getDay();
        }

        function formatInTz(date, pattern, timeZone) {
          const dtf = new Intl.DateTimeFormat("en-US", {
            timeZone,
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
            hourCycle: "h23",
          });
          const parts = Object.fromEntries(
            dtf.formatToParts(date).map((p) => [p.type, p.value])
          );
          // en-US 偶爾給 24:xx，正規化
          const hour = parts.hour === "24" ? "00" : parts.hour;
          const wi = weekdayIndexInTz(date, timeZone);
          const map = {
            YYYY: parts.year,
            YY: parts.year.slice(-2),
            MM: parts.month,
            DD: parts.day,
            HH: hour,
            mm: parts.minute,
            ss: parts.second,
            dddd: WEEKDAY_LONG[wi],
            ddd: WEEKDAY_SHORT[wi],
            Z: timeZone,
          };
          return pattern.replace(
            /YYYY|YY|MM|DD|HH|mm|ss|dddd|ddd|Z/g,
            (token) => map[token] ?? token
          );
        }

        function tickClock() {
          const now = new Date();
          if (showDate) els.date.textContent = formatInTz(now, dateFmt, tz);
          if (showTime) els.time.textContent = formatInTz(now, timeFmt, tz);
          if (showUptime) {
            if (startedAt) {
              els.uptime.classList.remove("error");
              els.uptime.textContent = formatHMS((now - startedAt) / 1000);
            }
          }
        }

        function parseDecapiUptime(text) {
          if (!text || /offline|not live|is offline/i.test(text)) return null;
          const re =
            /(?:(\d+)\s*days?)?(?:,?\s*)?(?:(\d+)\s*hours?)?(?:,?\s*)?(?:(\d+)\s*minutes?)?(?:,?\s*)?(?:(\d+)\s*seconds?)?/i;
          const m = text.trim().match(re);
          if (!m || (!m[1] && !m[2] && !m[3] && !m[4])) return null;
          const days = Number(m[1] || 0);
          const hours = Number(m[2] || 0);
          const minutes = Number(m[3] || 0);
          const seconds = Number(m[4] || 0);
          const ms =
            (((days * 24 + hours) * 60 + minutes) * 60 + seconds) * 1000;
          return new Date(Date.now() - ms);
        }

        async function fetchGql() {
          const query = {
            query: `query($login:String!){user(login:$login){stream{viewersCount createdAt}}}`,
            variables: { login: channel },
          };
          const res = await fetch(TWITCH_GQL, {
            method: "POST",
            headers: {
              "Client-ID": TWITCH_WEB_CLIENT_ID,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(query),
          });
          if (!res.ok) throw new Error(`gql ${res.status}`);
          const json = await res.json();
          const stream = json?.data?.user?.stream;
          if (!stream) {
            return { live: false, viewers: 0, startedAt: null };
          }
          return {
            live: true,
            viewers: stream.viewersCount ?? 0,
            startedAt: stream.createdAt ? new Date(stream.createdAt) : null,
          };
        }

        async function fetchDecapi() {
          const tasks = [];
          if (showViewers) tasks.push(fetch(DECAPI_VIEWERS(channel)).then((r) => r.text()));
          else tasks.push(Promise.resolve(null));
          if (showUptime) tasks.push(fetch(DECAPI_UPTIME(channel)).then((r) => r.text()));
          else tasks.push(Promise.resolve(null));
          const [viewersText, uptimeText] = await Promise.all(tasks);
          let viewers = 0;
          let live = false;
          let start = null;
          if (viewersText != null) {
            const raw = String(viewersText).trim();
            if (/offline/i.test(raw)) {
              live = false;
              viewers = 0;
            } else {
              const n = parseInt(raw, 10);
              if (!Number.isNaN(n)) {
                viewers = n;
                live = true;
              }
            }
          }
          if (uptimeText) {
            if (/offline/i.test(uptimeText)) {
              live = false;
              start = null;
            } else {
              start = parseDecapiUptime(uptimeText);
              if (start) live = true;
            }
          }
          return { live, viewers, startedAt: start };
        }

        async function fetchStreamlabsViewers() {
          // Streamlabs widget 是完整頁面，無法穩定解析人數；保留參數提示用。
          throw new Error("streamlabs-embed-only");
        }

        async function refreshStream() {
          if (!channel || (!showViewers && !showUptime)) return;
          try {
            let data;
            if (viewersSource === "decapi") data = await fetchDecapi();
            else if (viewersSource === "streamlabs") {
              await fetchStreamlabsViewers();
            } else {
              try {
                data = await fetchGql();
              } catch (e) {
                console.warn("GQL failed, fallback DecAPI", e);
                data = await fetchDecapi();
              }
            }

            if (showViewers) {
              els.viewers.classList.remove("error");
              els.viewers.textContent = data.live ? String(data.viewers) : "0";
            }
            if (showUptime) {
              if (data.live && data.startedAt) {
                startedAt = data.startedAt;
                els.uptime.classList.remove("error");
              } else {
                startedAt = null;
                els.uptime.textContent = "00:00:00";
              }
            }
          } catch (err) {
            console.error(err);
            if (showViewers) {
              els.viewers.classList.add("error");
              els.viewers.textContent = "ERR";
            }
            if (showUptime) {
              els.uptime.classList.add("error");
              els.uptime.textContent = "ERR";
            }
          }
        }

        tickClock();
        setInterval(tickClock, 250);
        refreshStream();
        setInterval(refreshStream, POLL_MS);

        // 未使用的 Streamlabs token：在 console 提示改用免驗證來源
        if (streamlabsToken) {
          console.info(
            "[my_OBS_tools] Streamlabs token 已記錄。建議改用免驗證人數來源（預設 auto/GQL）。若仍要用 Streamlabs，請另開瀏覽器來源貼上其 widget 網址。"
          );
        }
      })();
    </script>
  </body>
</html>
