<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS Viewer Count · TW + YT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script src="../panel-bg.js"></script>
    <script src="../yt-live-sync.js"></script>
    <style>
      :root {
        --bg: rgba(0, 0, 0, 0.45);
        --fg: rgba(255, 255, 255, 0.85);
        --muted: rgba(255, 255, 255, 0.7);
        --size: 22px;
        --bar-h: calc(var(--size) + 16px);
        --pad-x: 12px;
        --gap: 12px;
        --radius: 0;
        --font-zh: "IBM Plex Sans TC", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
        --font-num: "JetBrains Mono", "Cascadia Mono", "Consolas", "Courier New",
          monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        color: var(--fg);
      }

      #bar {
        display: inline-flex;
        align-items: center;
        gap: var(--gap);
        height: var(--bar-h);
        padding: var(--panel-inset, 0 var(--pad-x));
        background-color: var(--bg);
        background-image: var(--panel-img, none);
        background-size: var(--panel-fit, 100% 100%);
        background-repeat: no-repeat;
        background-position: center;
        border-radius: var(--radius);
        white-space: nowrap;
        line-height: 1;
        overflow: hidden;
      }

      .plat {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .plat[hidden] {
        display: none !important;
      }

      .icon-slot {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: calc(var(--size) * 0.95);
        height: calc(var(--size) * 0.95);
        flex: 0 0 auto;
      }

      .icon,
      .custom-icon {
        width: 100%;
        height: 100%;
        opacity: 0.95;
        display: block;
        object-fit: contain;
      }

      .value {
        display: flex;
        align-items: center;
        height: var(--size);
        margin: 0;
        padding: 0;
        line-height: 1;
        font-family: var(--font-num);
        font-size: var(--size);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        transform: translateY(0.02em);
      }

      .error {
        color: #ff8f8f;
      }

      /* YouTube 無法取得：與數字同色（不再用紅字 403／ERR） */
      .value.soft-fail {
        font-family: var(--font-zh);
        font-size: calc(var(--size) * 0.72);
        font-weight: 600;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="bar" aria-live="polite">
      <section class="plat" id="mod-total" hidden>
        <span class="icon-slot" id="total-icon">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
            />
          </svg>
        </span>
        <span class="value" id="total">—</span>
      </section>

      <section class="plat" id="mod-tw" hidden>
        <span class="icon-slot" id="tw-icon" title="Twitch">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M4.3 2 2 4.3v15.4h4.6V22l2.6-2.3h3.4L20.6 12V2H4.3zm14.8 9.1-3 3h-3l-2.6 2.3v-2.3H6.9V3.7h12.2v7.4zM14.3 6.3h1.7v4.6h-1.7V6.3zm-4.6 0H11v4.6H9.7V6.3z"
            />
          </svg>
        </span>
        <span class="value" id="tw">—</span>
      </section>

      <section class="plat" id="mod-yt" hidden>
        <span class="icon-slot" id="yt-icon" title="YouTube">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.4 3.7 12 3.7 12 3.7s-7.4 0-9.4.4A3 3 0 0 0 .5 6.2 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c2 .4 9.4.4 9.4.4s7.4 0 9.4-.4a3 3 0 0 0 2.1-2.1A31.6 31.6 0 0 0 24 12a31.6 31.6 0 0 0-.5-5.8zM9.8 15.6V8.4L15.7 12l-5.9 3.6z"
            />
          </svg>
        </span>
        <span class="value" id="yt">—</span>
      </section>
    </div>

    <script>
      (() => {
        const TWITCH_GQL = "https://gql.twitch.tv/gql";
        const TWITCH_WEB_CLIENT_ID = "kimne78kx3ncx6brgo4mv6wki5h1ko";
        const DECAPI_VIEWERS = (login) =>
          `https://decapi.me/twitch/viewercount/${encodeURIComponent(login)}`;
        const YT_API = "https://www.googleapis.com/youtube/v3";
        // Twitch 維持原節奏；YouTube 可等 TW 開台後才查，並在未開台／失敗時降頻
        const POLL_MS_TW = 15000;
        const POLL_MS_YT_LIVE = 60000;
        const POLL_MS_YT_OFF = 5 * 60 * 1000;
        const POLL_MS_YT_FAIL = 3 * 60 * 1000;
        // 自動「找直播」成功後就記住；下播後至少隔這麼久才准再找下一次
        const YT_REFIND_MS = 2 * 60 * 60 * 1000;
        const YT_QUOTA_COOLDOWN_MS = 60 * 60 * 1000;
        const YT_QUOTA_UNTIL_KEY = "my_obs_tools_yt_quota_until";
        const YT_FAIL_LABEL = "無法取得";

        const params = new URLSearchParams(location.search);

        function cssVar(name, value) {
          if (value) document.documentElement.style.setProperty(name, value);
        }

        cssVar("--size", params.get("fontSize") ? `${params.get("fontSize")}px` : "");
        cssVar("--fg", params.get("color"));
        const bgParam = (params.get("bg") || "").trim();
        if (!bgParam || bgParam === "0" || bgParam === "false" || bgParam === "none" || bgParam === "off") {
          cssVar("--bg", "transparent");
        } else {
          cssVar("--bg", bgParam);
        }
        if (window.ObsPanelBg) {
          ObsPanelBg.applyOverlayPanelBg(params, cssVar, { defaultInset: 12 });
        }
        cssVar("--gap", params.get("gap") ? `${params.get("gap")}px` : "");
        cssVar("--radius", params.get("radius") ? `${params.get("radius")}px` : "");

        const twitchLogin = (
          params.get("login") ||
          params.get("twitch") ||
          params.get("channel") ||
          ""
        ).trim();
        const ytChannel = (
          params.get("yt") ||
          params.get("youtube") ||
          params.get("ytChannel") ||
          ""
        ).trim();
        function extractYoutubeVideoId(raw) {
          const s = String(raw || "").trim();
          if (!s) return "";
          if (/^[\w-]{11}$/.test(s)) return s;
          try {
            const u = new URL(s);
            const host = u.hostname.replace(/^www\./, "");
            if (host === "youtu.be") {
              const id = u.pathname.split("/").filter(Boolean)[0] || "";
              return /^[\w-]{11}$/.test(id) ? id : "";
            }
            if (
              host === "youtube.com" ||
              host === "m.youtube.com" ||
              host === "music.youtube.com"
            ) {
              const v = u.searchParams.get("v");
              if (v && /^[\w-]{11}$/.test(v)) return v;
              const parts = u.pathname.split("/").filter(Boolean);
              if (
                (parts[0] === "live" || parts[0] === "embed" || parts[0] === "shorts") &&
                parts[1] &&
                /^[\w-]{11}$/.test(parts[1])
              ) {
                return parts[1];
              }
            }
          } catch (_) {}
          const m = s.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/);
          return m ? m[1] : s;
        }

        const ytVideoParam = extractYoutubeVideoId(params.get("ytVideo") || "");
        const ytKey = (params.get("ytKey") || params.get("youtubeKey") || "").trim();
        const twitchSource = (params.get("viewersSource") || "auto").toLowerCase();
        const isPreview = ["1", "true", "yes", "on"].includes(
          String(params.get("preview") || params.get("demo") || "")
            .trim()
            .toLowerCase()
        );
        // 預覽更省；正式開台後才用較密輪詢（未開台見 POLL_MS_YT_OFF）
        const ytPollLiveMs = isPreview
          ? 3 * 60 * 1000
          : ytVideoParam
            ? POLL_MS_YT_LIVE
            : 90 * 1000;
        const ytPollOffMs = isPreview ? 5 * 60 * 1000 : POLL_MS_YT_OFF;
        // 預設開：TW 偵測到開台後才打 YouTube（兩邊一起開台時省配額）
        const ytAfterTwParam = String(params.get("ytAfterTw") || "1")
          .trim()
          .toLowerCase();
        const ytAfterTw = !["0", "false", "off", "no"].includes(ytAfterTwParam);
        const allowYtSearch = ["1", "true", "yes", "on"].includes(
          String(params.get("ytSearch") || "")
            .trim()
            .toLowerCase()
        );
        const mode = (params.get("vcMode") || "split").toLowerCase(); // split | total
        const twIconUrl = (params.get("twIcon") || "").trim();
        const ytIconUrl = (params.get("ytIcon") || "").trim();
        const totalIconUrl = (params.get("totalIcon") || params.get("icon") || "").trim();

        const els = {
          modTotal: document.getElementById("mod-total"),
          modTw: document.getElementById("mod-tw"),
          modYt: document.getElementById("mod-yt"),
          total: document.getElementById("total"),
          tw: document.getElementById("tw"),
          yt: document.getElementById("yt"),
          twIcon: document.getElementById("tw-icon"),
          ytIcon: document.getElementById("yt-icon"),
          totalIcon: document.getElementById("total-icon"),
        };

        function isHiddenIcon(url) {
          const s = String(url || "").trim().toLowerCase();
          return s === "0" || s === "none" || s === "off" || s === "false" || s === "hide";
        }

        function applyCustomIcon(slot, url) {
          if (!slot) return;
          if (isHiddenIcon(url)) {
            slot.hidden = true;
            slot.innerHTML = "";
            return;
          }
          if (!url) return; // 空白＝保留預設 SVG
          slot.hidden = false;
          slot.innerHTML = "";
          const img = document.createElement("img");
          img.className = "custom-icon";
          img.alt = "";
          img.referrerPolicy = "no-referrer";
          img.src = url;
          slot.appendChild(img);
        }

        applyCustomIcon(els.twIcon, twIconUrl);
        applyCustomIcon(els.ytIcon, ytIconUrl);
        applyCustomIcon(els.totalIcon, totalIconUrl);

        const wantTw = !!twitchLogin;
        const wantYt = !!(ytVideoParam || (ytChannel && ytKey));

        if (mode === "total") {
          els.modTotal.hidden = !(wantTw || wantYt);
        } else {
          els.modTw.hidden = !wantTw;
          els.modYt.hidden = !wantYt;
          // vcOrder=tw,yt | yt,tw
          const bar = document.getElementById("bar");
          const order = (params.get("vcOrder") || "tw,yt")
            .split(",")
            .map((s) => s.trim().toLowerCase())
            .filter((s) => s === "tw" || s === "yt");
          const uniq = [];
          order.forEach((k) => {
            if (!uniq.includes(k)) uniq.push(k);
          });
          if (!uniq.includes("tw")) uniq.push("tw");
          if (!uniq.includes("yt")) uniq.push("yt");
          uniq.forEach((k) => {
            const el = k === "tw" ? els.modTw : els.modYt;
            if (el) bar.appendChild(el);
          });
        }

        if (!wantTw && !wantYt) {
          els.modTotal.hidden = false;
          els.total.classList.add("error");
          els.total.textContent = "NO SRC";
          return;
        }

        let twCount = null; // null=未知, number=值, "ERR"|"403"=TW失敗
        let ytCount = null; // null=未知, number=值, YT_FAIL_LABEL=YT失敗
        let twLive = false;
        let ytLive = false;
        let ytVideoId = ytVideoParam || null;
        let ytChannelId = null;
        let lastYtResolve = 0;

        function isYtFail(v) {
          return (
            v === YT_FAIL_LABEL ||
            v === "ERR" ||
            v === "FILE" ||
            v === "403"
          );
        }

        function isTwFail(v) {
          return v === "ERR" || v === "FILE" || v === "403";
        }

        function setYtValueEl(el, value, tip) {
          if (!el) return;
          const failed = isYtFail(value);
          const ok = typeof value === "number";
          el.classList.remove("error");
          el.classList.toggle("soft-fail", failed);
          el.textContent = failed
            ? YT_FAIL_LABEL
            : ok
              ? String(value)
              : "—";
          el.title = failed ? tip || "YouTube 人數暫時抓不到" : "";
        }

        function render() {
          const twOk = typeof twCount === "number";
          const ytOk = typeof ytCount === "number";
          if (mode === "total") {
            if (!twOk && !ytOk) {
              const ytBad = isYtFail(ytCount);
              const twBad = isTwFail(twCount);
              if (ytBad && !twBad) {
                setYtValueEl(els.total, YT_FAIL_LABEL, ytErrTip);
                return;
              }
              els.total.classList.remove("soft-fail");
              els.total.classList.toggle("error", twBad || ytBad);
              els.total.textContent = twBad
                ? String(twCount)
                : ytBad
                  ? YT_FAIL_LABEL
                  : "—";
              els.total.title = twBad
                ? twErrTip || "Twitch 人數抓取失敗"
                : ytBad
                  ? ytErrTip || ""
                  : "";
              return;
            }
            const sum = (twOk ? twCount : 0) + (ytOk ? ytCount : 0);
            els.total.classList.remove("error", "soft-fail");
            els.total.title = "";
            els.total.textContent = String(sum);
            return;
          }
          if (wantTw) {
            const bad = isTwFail(twCount);
            els.tw.classList.remove("soft-fail");
            els.tw.classList.toggle("error", bad);
            els.tw.textContent = bad
              ? String(twCount)
              : twOk
                ? String(twCount)
                : "—";
            els.tw.title = bad ? twErrTip || "Twitch 人數抓取失敗" : "";
          }
          if (wantYt) {
            setYtValueEl(
              els.yt,
              ytCount,
              ytErrTip || "YouTube 人數抓取失敗（金鑰限制／配額／找不到直播）"
            );
          }
        }

        async function fetchTwitchGql() {
          const res = await fetch(TWITCH_GQL, {
            method: "POST",
            headers: {
              "Client-ID": TWITCH_WEB_CLIENT_ID,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              query: `query($login:String!){user(login:$login){stream{viewersCount}}}`,
              variables: { login: twitchLogin },
            }),
          });
          if (!res.ok) throw new Error(`gql ${res.status}`);
          const json = await res.json();
          const stream = json?.data?.user?.stream;
          if (!stream) return { live: false, viewers: 0 };
          return { live: true, viewers: stream.viewersCount ?? 0 };
        }

        async function fetchTwitchDecapi() {
          const text = (
            await fetch(DECAPI_VIEWERS(twitchLogin)).then((r) => r.text())
          ).trim();
          if (/offline/i.test(text)) return { live: false, viewers: 0 };
          const n = parseInt(text, 10);
          if (Number.isNaN(n)) throw new Error("decapi");
          return { live: true, viewers: n };
        }

        const isFileOrigin = location.protocol === "file:";
        let twErrTip = "";
        let ytErrTip = "";
        function yt403Tip(msg) {
          const m = String(msg || "");
          if (/accessNotConfigured|not been used|disabled/i.test(m)) {
            return "YouTube API 403：專案尚未啟用 YouTube Data API v3（函式庫裡按啟用，和金鑰限制是兩件事）";
          }
          if (/dailyLimitExceeded|quotaExceeded|rateLimitExceeded/i.test(m)) {
            return "YouTube API 403：今日配額用完或請求太頻繁，到 Google Cloud「配額」查看；或明天再試";
          }
          if (/keyInvalid|API key not valid|invalid/i.test(m)) {
            return "YouTube API 403：金鑰無效，請重新貼上／重新產生 API 金鑰";
          }
          if (/ipRefererBlocked|refererBlocked|blocked/i.test(m)) {
            return "YouTube API 403：金鑰被應用程式限制擋住；OBS／file 請把「應用程式限制」設成「無」";
          }
          if (/billing/i.test(m)) {
            return "YouTube API 403：專案可能需要綁定帳單（免費額度仍可能要求啟用帳單）";
          }
          return (
            "YouTube API 403：" +
            (m.replace(/^yt\s+/i, "").trim() || "請開 F12 Console 看完整原因") +
            "（常見：未啟用 API、配額用完、金鑰無效；不一定是應用程式限制）"
          );
        }
        function failLabel(err, which) {
          const msg = String((err && err.message) || err || "");
          if (which === "yt") console.warn("viewers yt", err);
          else console.error(which || "viewers", err);
          let tip = msg
            ? msg
            : isFileOrigin
              ? "本機 file:// 請求失敗"
              : "人數抓取失敗";
          if (which === "yt") {
            if (/403/.test(msg)) tip = yt403Tip(msg);
            ytErrTip = tip;
            return YT_FAIL_LABEL;
          }
          if (which === "tw") twErrTip = tip;
          if (/403/.test(msg)) return "403";
          return "ERR";
        }

        function ytAllowedByTw() {
          // 沒勾「等 TW」或沒填 TW → YT 自己跑；有填 TW 則等開台
          if (!ytAfterTw) return true;
          if (!wantTw) return true;
          return !!twLive;
        }

        function parkYoutubeUntilTw() {
          ytLive = false;
          ytCount = 0;
          ytErrTip = "";
        }

        let ytKick = null;
        function armYtKick(fn) {
          ytKick = fn;
        }
        function kickYoutubeSoon() {
          if (typeof ytKick === "function") ytKick();
        }

        async function refreshTwitch() {
          if (!wantTw) return;
          const wasLive = twLive;
          try {
            let data;
            if (twitchSource === "decapi") data = await fetchTwitchDecapi();
            else {
              try {
                data = await fetchTwitchGql();
              } catch (e) {
                console.warn("GQL failed, DecAPI", e);
                data = await fetchTwitchDecapi();
              }
            }
            twLive = !!data.live;
            // TW 維持原本顯示：未開台也顯示 0（人數本身），不改錯誤樣式
            twCount = data.viewers;
            twErrTip = "";
          } catch (err) {
            twLive = false;
            twCount = failLabel(err, "tw");
          }
          if (ytAfterTw && wantYt) {
            if (wasLive && !twLive) parkYoutubeUntilTw();
            if (!wasLive && twLive) kickYoutubeSoon();
          }
        }

        function normalizeHandle(input) {
          let s = input.trim();
          if (s.startsWith("https://") || s.startsWith("http://")) {
            try {
              const u = new URL(s);
              const parts = u.pathname.split("/").filter(Boolean);
              if (parts[0] === "channel" && parts[1]) return parts[1];
              if (parts[0] === "c" && parts[1]) return parts[1];
              if (parts[0] === "user" && parts[1]) return parts[1];
              if (parts[0]?.startsWith("@")) return parts[0];
              if (parts[0]) return parts[0];
            } catch (_) {}
          }
          return s;
        }

        function readYtQuotaUntil() {
          try {
            return Number(localStorage.getItem(YT_QUOTA_UNTIL_KEY) || 0) || 0;
          } catch (_) {
            return 0;
          }
        }
        function markYtQuotaCooldown(ms) {
          try {
            localStorage.setItem(
              YT_QUOTA_UNTIL_KEY,
              String(Date.now() + (ms || YT_QUOTA_COOLDOWN_MS))
            );
          } catch (_) {}
        }
        function assertYtQuotaOk() {
          const until = readYtQuotaUntil();
          if (Date.now() < until) {
            const mins = Math.max(1, Math.ceil((until - Date.now()) / 60000));
            throw new Error(
              `yt 403 quotaExceeded 配額冷卻中（約 ${mins} 分鐘後再試）`
            );
          }
        }

        async function ytFetchJson(url, label) {
          assertYtQuotaOk();
          let res;
          try {
            res = await fetch(url);
          } catch (e) {
            throw new Error(`${label} network (${e && e.message ? e.message : "fetch"})`);
          }
          let json = null;
          try {
            json = await res.json();
          } catch (_) {}
          if (!res.ok) {
            const reason =
              json?.error?.errors?.[0]?.reason ||
              json?.error?.message ||
              res.statusText ||
              "";
            const msg = `${label} ${res.status}${
              reason ? " " + String(reason).slice(0, 80) : ""
            }`;
            if (
              res.status === 403 &&
              /quotaExceeded|dailyLimitExceeded|rateLimitExceeded/i.test(
                String(reason) + msg
              )
            ) {
              markYtQuotaCooldown(YT_QUOTA_COOLDOWN_MS);
            }
            throw new Error(msg);
          }
          return json;
        }

        const ytCacheKey = `laji_obs_yt_live_cache:${(
          ytChannel ||
          ytVideoParam ||
          "default"
        ).toLowerCase()}`;
        const ytUploadsCacheKey = `laji_obs_yt_uploads:${(
          ytChannel || "default"
        ).toLowerCase()}`;

        function readYtCache() {
          try {
            return JSON.parse(localStorage.getItem(ytCacheKey) || "null");
          } catch (_) {
            return null;
          }
        }
        function writeYtCache(data) {
          try {
            localStorage.setItem(ytCacheKey, JSON.stringify(data));
          } catch (_) {}
        }
        function clearYtCache() {
          try {
            localStorage.removeItem(ytCacheKey);
          } catch (_) {}
        }
        function readUploadsPlaylistId(channelId) {
          try {
            const raw = JSON.parse(localStorage.getItem(ytUploadsCacheKey) || "null");
            if (raw && raw.channelId === channelId && raw.uploads) return raw.uploads;
          } catch (_) {}
          return null;
        }
        function writeUploadsPlaylistId(channelId, uploads) {
          try {
            localStorage.setItem(
              ytUploadsCacheKey,
              JSON.stringify({ channelId, uploads, ts: Date.now() })
            );
          } catch (_) {}
        }

        async function resolveYoutubeChannelId() {
          if (ytChannelId) return ytChannelId;
          const raw = normalizeHandle(ytChannel);
          if (/^UC[\w-]{22}$/.test(raw)) {
            ytChannelId = raw;
            return ytChannelId;
          }
          const cache = readYtCache();
          if (cache?.channelId && /^UC[\w-]{22}$/.test(cache.channelId)) {
            ytChannelId = cache.channelId;
            return ytChannelId;
          }
          const handle = raw.startsWith("@") ? raw.slice(1) : raw;
          // 1) forHandle（新頻道＠）
          try {
            const url = `${YT_API}/channels?part=id&forHandle=${encodeURIComponent(
              handle
            )}&key=${encodeURIComponent(ytKey)}`;
            const json = await ytFetchJson(url, "yt channels");
            const id = json?.items?.[0]?.id;
            if (id) {
              ytChannelId = id;
              return ytChannelId;
            }
          } catch (e) {
            console.warn(e);
          }
          // 2) 舊版 forUsername（英文 id）
          try {
            const url = `${YT_API}/channels?part=id&forUsername=${encodeURIComponent(
              handle
            )}&key=${encodeURIComponent(ytKey)}`;
            const json = await ytFetchJson(url, "yt username");
            const id = json?.items?.[0]?.id;
            if (id) {
              ytChannelId = id;
              return ytChannelId;
            }
          } catch (e) {
            console.warn(e);
          }
          throw new Error("yt channel not found（可改填 UC… 頻道 ID）");
        }

        async function resolveLiveViaSearch(channelId) {
          // search.list = 100 配額；預設關閉，除非網址加 ytSearch=1
          if (!allowYtSearch) return null;
          const url = `${YT_API}/search?part=snippet&channelId=${encodeURIComponent(
            channelId
          )}&eventType=live&type=video&maxResults=1&key=${encodeURIComponent(ytKey)}`;
          const json = await ytFetchJson(url, "yt search");
          return json?.items?.[0]?.id?.videoId || null;
        }

        async function resolveLiveViaUploads(channelId) {
          // 便宜路徑：channels(1) + playlistItems(1) + videos(1)；可快取 uploads id
          let uploads = readUploadsPlaylistId(channelId);
          if (!uploads) {
            const chUrl = `${YT_API}/channels?part=contentDetails&id=${encodeURIComponent(
              channelId
            )}&key=${encodeURIComponent(ytKey)}`;
            const chJson = await ytFetchJson(chUrl, "yt channel details");
            uploads = chJson?.items?.[0]?.contentDetails?.relatedPlaylists?.uploads;
            if (uploads) writeUploadsPlaylistId(channelId, uploads);
          }
          if (!uploads) return null;
          const plUrl = `${YT_API}/playlistItems?part=contentDetails&playlistId=${encodeURIComponent(
            uploads
          )}&maxResults=15&key=${encodeURIComponent(ytKey)}`;
          const plJson = await ytFetchJson(plUrl, "yt uploads");
          const ids = (plJson?.items || [])
            .map((it) => it?.contentDetails?.videoId)
            .filter(Boolean);
          if (!ids.length) return null;
          const vUrl = `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
            ids.join(",")
          )}&key=${encodeURIComponent(ytKey)}`;
          const vJson = await ytFetchJson(vUrl, "yt recent videos");
          const live = (vJson?.items || []).find((it) => {
            const d = it?.liveStreamingDetails;
            return d && d.actualStartTime && !d.actualEndTime;
          });
          return live?.id || null;
        }

        let sharedOverrideVideoId = null;
        async function refreshSharedLiveOverride() {
          if (!window.MyObsYtLiveSync) return sharedOverrideVideoId;
          try {
            const data = await MyObsYtLiveSync.fetchSharedYtLive();
            if (data && data.videoId) {
              sharedOverrideVideoId = String(data.videoId);
              if (data.channelId) ytChannelId = data.channelId;
            } else if (data && Object.prototype.hasOwnProperty.call(data, "videoId")) {
              sharedOverrideVideoId = null;
            }
          } catch (_) {}
          return sharedOverrideVideoId;
        }

        /**
         * 優先用入口寫入的 資料/yt-live.js（OBS 可跟著更新），
         * 再才是網址參數／快取；自動找整場最多一次。
         */
        async function resolveYoutubeLiveVideoId(force = false) {
          await refreshSharedLiveOverride();
          if (sharedOverrideVideoId) {
            ytVideoId = sharedOverrideVideoId;
            return ytVideoId;
          }
          if (ytVideoParam) {
            ytVideoId = ytVideoParam;
            return ytVideoId;
          }

          const cache = readYtCache();
          if (cache?.channelId) ytChannelId = cache.channelId;

          // 已記住本場直播 → 直接用（後面 videos.list 只查人數）
          if (!force && (ytVideoId || cache?.videoId)) {
            ytVideoId = ytVideoId || cache.videoId;
            return ytVideoId;
          }

          const now = Date.now();
          // 剛找失敗／剛下播：不要一直重找
          const waitUntil = Math.max(
            Number(cache?.huntFailedAt || 0),
            Number(cache?.endedAt || 0)
          );
          if (!force && waitUntil && now - waitUntil < YT_REFIND_MS) {
            ytVideoId = null;
            return null;
          }
          if (!force && lastYtResolve && now - lastYtResolve < YT_REFIND_MS && !cache?.videoId) {
            return null;
          }

          const channelId = await resolveYoutubeChannelId();
          let id = null;
          let lastErr = null;
          try {
            id = await resolveLiveViaUploads(channelId);
          } catch (e) {
            lastErr = e;
            console.warn(e);
          }
          if (!id && allowYtSearch) {
            try {
              id = await resolveLiveViaSearch(channelId);
            } catch (e) {
              lastErr = e;
              console.warn("yt search failed", e);
            }
          }
          lastYtResolve = Date.now();
          if (id) {
            ytVideoId = id;
            writeYtCache({
              channelId,
              videoId: id,
              ts: lastYtResolve,
              foundOnce: true,
            });
            return id;
          }
          writeYtCache({
            channelId,
            videoId: null,
            huntFailedAt: lastYtResolve,
            ts: lastYtResolve,
          });
          if (lastErr) throw lastErr;
          return null;
        }

        async function fetchYoutubeViewers() {
          assertYtQuotaOk();
          const videoId = await resolveYoutubeLiveVideoId(false);
          if (!videoId) return { live: false, viewers: 0 };
          const url = `${YT_API}/videos?part=liveStreamingDetails&id=${encodeURIComponent(
            videoId
          )}&key=${encodeURIComponent(ytKey)}`;
          const json = await ytFetchJson(url, "yt videos");
          const details = json?.items?.[0]?.liveStreamingDetails;
          if (!details || details.actualEndTime) {
            // 下播：忘掉本場，但兩小時內不再自動找下一場
            const channelId = ytChannelId || (readYtCache() || {}).channelId || "";
            // 有固定填直播網址時保留 id，之後用慢輪詢等再開台
            if (!ytVideoParam) {
              ytVideoId = null;
              writeYtCache({
                channelId,
                videoId: null,
                endedAt: Date.now(),
                ts: Date.now(),
              });
            } else {
              writeYtCache({
                channelId,
                videoId: ytVideoParam,
                endedAt: Date.now(),
                ts: Date.now(),
              });
            }
            lastYtResolve = Date.now();
            return { live: false, viewers: 0 };
          }
          if (!ytVideoParam) {
            writeYtCache({
              channelId: ytChannelId || (readYtCache() || {}).channelId,
              videoId,
              ts: Date.now(),
              foundOnce: true,
            });
          }
          const n = parseInt(details.concurrentViewers || "0", 10);
          return {
            live: true,
            viewers: Number.isNaN(n) ? 0 : n,
          };
        }

        async function refreshYoutube() {
          if (!wantYt) return;
          if (!ytAllowedByTw()) {
            parkYoutubeUntilTw();
            return;
          }
          try {
            const data = await fetchYoutubeViewers();
            ytLive = !!data.live;
            ytCount = ytLive ? data.viewers : 0;
            ytErrTip = "";
          } catch (err) {
            ytLive = false;
            ytCount = failLabel(err, "yt");
          }
        }

        function nextYtDelay() {
          if (!ytAllowedByTw()) return POLL_MS_TW; // 等 TW 開台，跟 TW 節奏對齊醒來
          if (isYtFail(ytCount)) return POLL_MS_YT_FAIL;
          return ytLive ? ytPollLiveMs : ytPollOffMs;
        }

        async function refreshTwitchOnly() {
          await refreshTwitch();
          render();
        }

        let ytTimer = null;
        let ytBusy = false;
        async function ytLoop(force) {
          if (!wantYt) return;
          if (ytBusy) return;
          ytBusy = true;
          try {
            if (ytTimer) {
              clearTimeout(ytTimer);
              ytTimer = null;
            }
            await refreshYoutube();
            render();
          } finally {
            ytBusy = false;
            ytTimer = setTimeout(() => ytLoop(false), nextYtDelay());
          }
        }
        armYtKick(() => ytLoop(true));

        render();
        if (wantTw) {
          refreshTwitchOnly();
          setInterval(refreshTwitchOnly, POLL_MS_TW);
        }
        if (wantYt) ytLoop(false);
      })();
    </script>
  </body>
</html>
